  control_endpoints:
    run_complete:
      kind: terminal
      meaning: Every gate-1-approved campaign reached exactly one verified
        gate-3 closure and the cross-run artifacts reflect each closure.
      terminal_status: accepted
    run_paused:
      kind: pause
      meaning: The user pauses, a required input, source, or hardware
        capability is unavailable, or intake costing stalls and awaits user
        direction; resumable state preserved. A run that closes in this
        condition records terminal classification incomplete.
      resumable: true
    run_blocked:
      kind: terminal
      meaning: A required capability, resource, or authority is unavailable
        and no declared route remains.
      terminal_status: blocked
    run_aborted:
      kind: terminal
      meaning: The user stops the run before the approved campaign set
        closes.
      terminal_status: closed_unaccepted
    await_remaining_closures:
      kind: join
      meaning: Hold until every approved campaign instance reaches its
        verified closure; run-closure verification re-runs at each closure.

  state:
    required:
      - workflow_identity
      - pinned_release
      - requested_targets
      - instance_roster
      - cross_run_artifact_refs
      - ranked_backlog
      - approved_campaigns
      - campaign_states
      - campaign_target_pins
      - scheduling_holds
      - comparator_registrations
      - hardware_attempt_counts
      - hardware_lease_record
      - gate_approval_records
      - active_node_runs
      - completed_outcomes
      - evidence_references
      - open_questions
      - terminal_classification
    fields:
      pinned_release:
        meaning: Frozen at intake - base version, release-branch name, SDK
          and compiler versions. The single pin authority for the run; graph
          text never names these values.
      approved_campaigns:
        meaning: Fan-out collection - one entry per gate-1-approved campaign
          with target, route, source, type, and kickoff-contract reference.
      campaign_target_pins:
        meaning: Per-campaign target base - equals the run's frozen
          pinned_release for backport-route campaigns; the kickoff-declared
          upgrade base for upgrade-route campaigns. Values are run inputs,
          never graph text.
      scheduling_holds:
        meaning: Per-campaign predicted file surfaces and the serialization
          holds the lead derives from them - campaigns with overlapping
          surfaces serialize, and an upgrade-route campaign holds all
          others while it runs exclusively. Holds are re-derived under the
          lead's standing scheduling authority whenever a campaign design
          refines its predicted surface.
      hardware_attempt_counts:
        meaning: Per-target shared budget across all routes that spend
          hardware attempts; the tier-2 breaker reads it at every 10.
      campaign_states:
        meaning: Pointer per campaign to its own state and evidence
          directory (one-file-per-event); never inlined into run state.
    checkpoint:
      after_every_consequential_transition: true

  completion:
    acceptance: Every gate-1-approved campaign closed through gate 3 as
      exactly one declared closure, each verified against world-produced
      evidence, with all four cross-run artifacts updated.
    closure: The run records an honest terminal classification and preserves
      open risks, discoveries, and resumable state.

  extensions:
    x_planning:
      dispatched_node: root
      frozen_contract_reference: planning/root-contract.md
      elaboration:
        root:
          verdict: decompose
          justification: Multi-session run with parallel campaigns, three
            user gates per campaign, and authority separation
            (measure/adjudicate/review) cannot settle in one bounded
            context; overturned only if one agent could run intake, one
            campaign, validation, and closure end-to-end.
        verify_run_preconditions:
          prediction: atomic
          justification: One agent runs read-only SSH/gh/file preflights and
            freezes run inputs; settles on recorded command transcripts.
        scan_upstream_delta:
          prediction: decompose
          justification: Per-target tracing across two reference sources
            with grep/log sweeps likely exceeds one context for multi-target
            requests; overturned if the request names one or two headline
            targets.
        cost_routes_and_rank_backlog:
          prediction: atomic
          justification: Costing consumes finished delta reports plus the
            mechanical entanglement check; overturned if costing demands
            fresh repo archaeology beyond the reports.
        review_route_verdicts:
          prediction: atomic
          justification: Bounded adversarial read of two artifacts; settles
            on a findings record.
        assemble_kickoff_contracts:
          prediction: atomic
          justification: Template-driven assembly plus per-campaign
            preflights and one gate presentation; settles on complete
            contract plus verbatim approval records.
        design_campaign:
          prediction: decompose
          justification: Comparator pre-registration, increment plan, test
            layout, and conflict prediction span several judgment surfaces;
            the validation procedure it pre-registers is new construction.
        review_campaign_design:
          prediction: atomic
          justification: Bounded adversarial read of one design record.
        implement_increments:
          prediction: decompose
          justification: Multi-increment implementation across
            collision-heavy surfaces (runner, platform, scheduler) with
            CPU-mode evidence per increment.
        review_implementation:
          prediction: atomic
          justification: Bounded adversarial read of one changeset against
            one design.
        run_hardware_attempts:
          prediction: decompose
          justification: Lease service, freeze-replicate venv (never yet
            executed anywhere), attempt loop, and host recovery are each new
            construction with distinct recovery; one context cannot hold all
            four plus the attempt loop.
        rederive_approach:
          prediction: atomic
          justification: Bounded first-principles read of one campaign's
            accumulated evidence producing one of three recorded outcomes.
        measure_against_baseline:
          prediction: decompose
          justification: The repeatable GPU-baseline correctness plus perf
            procedure exists nowhere as a procedure (built once by hand,
            forensically); building and running it spans harness
            construction and stable-read collection.
        adjudicate_results:
          prediction: atomic
          justification: Reads stable artifacts against pre-registered
            thresholds; settles on a verdict record with an evidence trail.
        review_measurement_verdict:
          prediction: atomic
          justification: Bounded adversarial read of verdict plus artifacts;
            five-way routing is judgment, not volume.
        prepare_pr:
          prediction: atomic
          justification: Checklist-driven packaging of existing evidence;
            overturned if evidence gaps force repeated re-measurement loops.
        review_pr_evidence:
          prediction: atomic
          justification: Bounded adversarial read of one package.
        close_campaign:
          prediction: atomic
          justification: One gate presentation, one closure execution, four
            serialized artifact writes; settles on a resolvable PR URL or
            recorded bundle.
        verify_run_closure:
          prediction: atomic
          justification: Reads closure records, resolves PR URLs via gh, and
            diffs the artifacts on disk; pure evidence reading.
      pin_generic_dependencies:
        - scan_upstream_delta - the delta volume and the
          compile-subsystem-left-the-repo consequence hold at the current
          pin; a different pin changes scan scope, not node meaning.
        - design_campaign - compile-touching targets need re-scoping or an
          upstream-issue path at the current pin.
        - run_hardware_attempts - the freeze-replicate private-index
          precondition (a core dependency resolving only from the vendor
          index at the current pin) is verified at intake, consumed here.
        - verify_run_preconditions - the runner-default boundary one release
          above the current pin informs the entanglement check the delta
          scan runs; recorded at intake.
      fan_in_note: verify_run_closure is run-scoped and receives edges from
        an instance-per-campaign node; it runs at each closure and routes
        campaigns_remaining to the await_remaining_closures join endpoint
        until every approved campaign settles. Runtime binding realizes the
        join; the node's own verdict logic is idempotent per closure.
      loop_bounds:
        - Hardware and correctness-repair loops carry no attempt caps by
          contract; they are bounded by the persisted fingerprint file
          (no-identical-retry) plus two designed operator stops - the tier-2
          breaker at every 10 hardware attempts per target
          (hardware_attempt_counts is a recorded shared budget across all
          routes that spend attempts) and the three user gates.
        - Review-repair loops carry declared no-progress exits - the
          implementation, adjudication, and PR-package loops each route a
          no_progress outcome to rederive_approach (edges
          impl_no_progress_to_rederivation,
          adjudication_no_progress_to_rederivation,
          pr_no_progress_to_rederivation), which lands on
          operator-controlled gates; the pre-gate-1 costing loop routes
          costing_stalled to run_paused for user direction; the design loop
          routes its own no_progress outcome to rederive_approach (edge
          design_no_progress_to_rederivation). No attempt caps introduced.
      evidence_gameability:
        - run_input_and_preflight_record - gameable (doer-run probes);
          hardened by requiring raw command transcripts in the artifact.
        - delta_report / route_costing_and_backlog - gameable (judgment
          text); hardened by UR-10 adversarial review before any gate
          consumes them.
        - implementation_changeset - low (git-produced diffs); CPU-mode
          evidence hardened by pre-hardware adversarial review.
        - hardware_attempt_log - low (one-file-per-event logs plus lease
          records).
        - measurement_artifacts - gameable (measurer-produced); hardened
          first by structure - pre-registered comparators, stable-read
          checks, measurer-never-adjudicates - then adversarial review.
        - closure_record - not gameable for the PR path (gh-resolvable URL);
          no-benefit and blocked bundles hardened by gate-3 verbatim
          approval plus run-closure verification.
        - run_closure_verdict - low (settles on gh-resolvable PR URLs and
          on-disk artifact diffs, produced by an adjudicator who produced
          none of the closure evidence); hardened by keeping the URL
          resolution and artifact-diff transcripts in the artifact.
      model_effort_assignments:
        lead: session top model, high effort - routing and gate judgment
          compound across the whole run.
        investigator: strong model, high effort - costing and re-derivation
          are judgment-heavy with wide blast radius.
        implementer: strong model, high effort - collision-heavy code
          surfaces; xhigh only for long hardware-attempt sessions.
        measurer: strong model, medium effort - procedure execution against
          a frozen design; wrong answers are caught by adjudication.
        adjudicator: strong model, high effort - verdicts have direct
          gate authority.
        adversarial_reviewer: strong model, high effort - material-findings
          judgment guards every high-stakes transition.
        delegate_dispatcher: small fast model, low effort - scoped
          single-question dispatches through fixed guardrails.
      open_questions:
        - Join and fan-in runtime semantics for verify_run_closure - assumed
          the runtime binding re-dispatches it per closure and
          await_remaining_closures holds; flag for the assembly stage.
        - The vendor SDK release notes name an adjacent autoport agentic
          skill - competing tool, prerequisite, or irrelevant; routed into
          verify_run_preconditions delegate preflight scope.
        - Namespaced delegate addressing (observed prefix form) unresolved;
          routed into verify_run_preconditions preflight scope.
        - One doc-only possible regression (segmented prefill on a
          multimodal model) unverified against code; routed into
          scan_upstream_delta scope for affected targets.
      conflicts: []
