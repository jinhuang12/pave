# Planner draft — dispatched boundary: preregister_acceptance
# (child of design_campaign, instance_per approved_campaigns; vllm-neuron-parity)
# Verdict: ATOMIC (confirms the framing prediction). nodes stays empty.
# The dispatched node's five-part contract is frozen in the parent draft and
# referenced below, never copied. The in-flight parent v2 repair
# (design_campaign.v2.draft.pave.yaml) touches parent prose only; the five
# child bodies are byte-identical to v1 (verified by diff), so the v1 path
# remains the contract authority this fragment references.
# Pin-generic: no SDK, release-tag, or framework version literals appear here;
# the registration itself records versions at run time from the kickoff record.
pave:
  name: preregister_acceptance
  status: draft
  nodes: {}
  extensions:
    x_planning:
      dispatched_node: preregister_acceptance
      frozen_contract_reference: planning/design_campaign.draft.pave.yaml#preregister_acceptance

      elaboration:
        preregister_acceptance:
          verdict: atomic
          justification: >
            One agent, holding one campaign's kickoff contract record (and, on
            the upgrade route only, the already-assembled regression matrix),
            transcribes the kickoff-declared comparators and criteria into one
            frozen registration artifact — comparator set with baseline-skew
            statement, verbatim criteria with procedure references,
            per-procedure pitfall pre-emptions — and submits it for lead
            commitment into run state. Settled by acts any later actor can
            re-run: string-comparing each registered item against its named
            source, and reading the lead-committed run-state timestamp the
            frozen mechanical comparators_preregistered check verifies before
            any measurement. Volume is one campaign's criteria set; the
            pitfall record is a bounded, already-synthesized list in the run's
            exploration evidence; no sub-goal needs its own recovery route
            (the single failure mode, an unadjudicable criterion, routes whole
            to the parent's no_progress). Falsified if registration turned out
            to require AUTHORING acceptance procedures rather than
            transcribing declared ones (procedure construction belongs to
            measure_against_baseline's decomposition, not here), or if
            per-procedure pre-emption demanded reading evidence beyond the
            synthesized exploration record in one context. Runtime-Binding
            check: fan-out per campaign already happens at the parent
            instance_per; no volume inside one instance needs many hands.
          prediction_disposition: confirmed
          prediction_source: >
            design_campaign.draft.pave.yaml
            extensions.x_planning.elaboration.preregister_acceptance
            ("atomic - transcribes kickoff-declared criteria into frozen
            adjudicable registrations; wording-critical but judgment-light and
            small in volume").

      atomic_contract:
        definition_of_done: >
          Every kickoff-declared acceptance criterion for this campaign's
          route is registered by verbatim quotation with a procedure
          reference; the comparator set — baseline identity, configuration,
          versions including the GPU-side reference version, and the
          baseline-skew statement naming known cross-version behavior
          differences — is frozen in one registration artifact with a
          per-item source reference and stable per-item ids; per-procedure
          measurement-pitfall pre-emptions are recorded; and the artifact is
          submitted to the lead for commitment into run state — settled by
          (a) any later actor string-comparing each registered item against
          its named source in kickoff_contract_record or
          regression_matrix_draft (5.3.1 rung 1: the sources are
          world-existing artifacts this doer did not write, so a minted,
          narrowed, or reworded item fails the re-read), and (b) the
          lead-committed run-state entry whose timestamp the frozen
          mechanical comparators_preregistered check (root.v6, evaluated_by
          lead) verifies precedes every measurement artifact (rung 1: an
          identifier the doer cannot mint, persisted in a second artifact the
          doer never writes). Gate-2 adversarial review re-settles
          adjudicability of the whole design record (rung 2: judge is not the
          doer; the criteria were written at kickoff, before this work).
        two_actor_registration: >
          Contract property, stated explicitly: the registration artifact is
          DOER-WRITTEN; its integrity comes from the LEAD — sole run-state
          writer — committing a run-state entry whose timestamp the
          already-frozen mechanical comparators_preregistered check verifies
          precedes every measurement artifact. This node produces the
          artifact and requests registration; it NEVER writes run state.
          Falsifier for the two-actor shape: if the doer committed its own
          registration, the timestamp would be doer-minted and could be
          backdated after measurement began, and the mechanical check would
          pass on forged provenance — the check compares timestamps, not
          authorship. Grounding precedent: the wrong-baseline incident — the
          measuring agent picked its own comparators across re-entries until
          the user intervened (system-map.md:151-153;
          exploration/validation-and-acceptance.md section 3.3, quoting the
          prior campaign's run-state verdict-correction entry). Freezing and
          measuring in one seat recreates that failure; the frozen
          forbidden_effect "running any measurement" is this node's PURPOSE
          (separation of acceptance authorship from measurement), not an
          incidental constraint.
        activities:
          - >
            Read the kickoff-declared route from kickoff_contract_record and
            assemble the criteria source set for THIS route only — kickoff
            thresholds, methods, and models; on the upgrade route, the
            regression matrix rows by stable row id (matrix_assembled
            precedes entry on that path). Route scoping is read from the
            kickoff record, never inferred.
          - >
            Freeze the comparator set: baseline identity, configuration, and
            versions, including the GPU-side reference version, each item
            carrying a source reference into the kickoff record; author the
            baseline-skew statement naming the known cross-version behavior
            differences the run's exploration record and kickoff evidence
            establish. An under-specified comparator — for example a kickoff
            record that does not fix the GPU-side reference identity — is
            surfaced via criteria_unadjudicable as a named ambiguity for an
            explicit user decision; the doer never selects a comparator the
            kickoff did not declare (the codified wrong-baseline rule).
            Downstream consumer note: measurement_artifacts.subject
            (root.v6) requires every evidence bundle to echo the GPU-side
            version and the cross-version differences, so the statement must
            be machine-referencable, not prose-only.
          - >
            Register every criterion by verbatim quotation with its procedure
            reference — kickoff-declared thresholds quoted byte-for-byte, or
            matrix rows referenced by id with their thresholds quoted; record
            per-criterion adjudicability. A criterion too vague to adjudicate
            as written is quoted byte-for-byte with the ambiguity named —
            never reworded, never repaired: kickoff-declared criteria change
            only by explicit user decision (routes to the parent's
            no_progress). Matrix rows flagged higher-risk-tier are registered
            with their flags intact; a risk tier is not unadjudicability.
          - >
            Record per-procedure measurement-pitfall pre-emptions the
            measurement design must honor, drawn from the run's exploration
            record — at minimum the four on file: the serve-bench chunk-count
            undercount on speculative configs that forced a manual harness;
            the decode-bench connector that measures without checking
            correctness; the watcher/evidence race (verdicts only on
            stable re-reads, never first-sighting signals — the frozen
            evidence_stable_before_verdict check's ancestor incident); and
            the equivalence delegate's hard-exit on version mismatch
            (system-map.md:125-128,143-146,151-155;
            exploration/validation-and-acceptance.md sections 3.3, 3.5).
          - >
            Write acceptance_preregistration to this campaign's design
            artifact directory (per the parent's evidence declaration) with
            stable per-item ids; submit the commitment request to the lead;
            emit acceptance_preregistered. Never write run state — the lead
            is its sole writer.
          - >
            When any criterion or comparator is unadjudicable as written,
            emit criteria_unadjudicable naming the criterion verbatim and
            the ambiguity; send NO commitment request; the partial
            registration persists as work-in-progress evidence, never as a
            frozen set.
        outcome_precedence: >
          Two declared outcomes; no true co-hold exists because the success
          meaning quantifies over ALL criteria ("criteria frozen and
          adjudicable as written"). Clarified for the boundary anyway: one
          unadjudicable item forces criteria_unadjudicable for the whole
          node run — there is no partial commitment, because a pending user
          decision can change the criterion set, and a second registration
          entry after that decision would leave two frozen sets and an
          ambiguous timestamp for the mechanical check to honor.
        entry_paths_note: >
          The frozen consumes list is a superset (parent-delegated finding,
          realized here per the close-out boundary's idiom): backport-route
          instances legitimately arrive WITHOUT regression_matrix_draft —
          the matrix node is never instantiated on that route, and
          screen_passed routes directly here alongside draft_increment_plan;
          the matrix is required exactly when the kickoff-declared route is
          upgrade (where matrix_assembled precedes entry). Likewise
          first-lap instances legitimately arrive without
          adversarial_review_findings — the findings history is empty by
          definition before the first gate-2 review. Contract-consistent,
          not a conflict; a builder reading the child in isolation should
          not see an unsatisfiable dependency.
        node_local_guards:
          no_measurement_before_commitment:
            rule: Running any measurement is a frozen forbidden effect;
              pre-registration completes before measurement begins.
            strength: persistent record + downstream mechanical check
              (comparators_preregistered, already frozen in root.v6 on the
              serving-candidate-to-measurement edge)
            why_not_stronger: The node has no hardware access by its own
              frozen forbidden effects, and a violation is precisely
              detectable after the fact - a measurement artifact predating
              the lead's run-state commitment fails the mechanical check
              before any measurement is consumed, routing back to
              design_campaign. A blocking hook would have to classify "is
              this action a measurement" and risks stranding the run;
              9.14.2 prefers observation when the next required guard
              catches the violation before harm.
          verbatim_never_reworded:
            rule: A criterion is registered by quotation or surfaced by
              quotation; it is never paraphrased or repaired.
            strength: persistent record (per-item source references make the
              re-check a string comparison) + independent review (gate-2
              reviewer re-reads the kickoff record)
            why_not_stronger: The violation is precisely detectable on read
              by any actor via rung-1 string comparison against a source the
              doer did not write, and the retained gate-2 review already
              performs that read - a dedicated pre-commit validator would be
              a second gate checking the same claim (4.11).
          no_partial_commitment:
            rule: No commitment request when any criterion surfaced as
              unadjudicable.
            strength: routing (one transition evaluates it)
            why_not_stronger: The lead commits only on consuming the
              acceptance_preregistered outcome, and criteria_unadjudicable
              routes to the parent's no_progress instead - the graph raises
              the rule at the only moment it binds; no standing mechanism
              earns its place (9.14.2).
        evidence_gameability:
          acceptance_preregistration: >
            Doer-written and gameable in isolation, in three directions:
            (a) MINTING - inventing or selecting comparators the kickoff did
            not declare (exactly the wrong-baseline incident class);
            (b) NARROWING - registering a subset of the kickoff-declared
            criteria so the acceptance gate reads fewer rows;
            (c) REWORDING - silently repairing a vague criterion instead of
            surfacing it. Hardened first, per 9.14.1 order:
            rung-1 provenance - every registered item carries a source
            reference into kickoff_contract_record or regression_matrix_draft
            (artifacts this doer did not write; a minted or reworded item
            fails string comparison on re-read), and the LEAD commits the
            registration into run state with a timestamp the doer cannot
            mint, in a second artifact the doer never writes;
            then a check the doer does not run - the frozen mechanical
            comparators_preregistered check, evaluated_by lead, before any
            measurement; then existing review - narrowing is caught by
            assemble_design_record's completeness self-check ("comparator
            registration present and marked for commitment") and by the
            gate-2 adversarial reviewer reading the kickoff record's FULL
            criteria list against the registration. No new review node
            added - a false pass is caught twice downstream (4.11, reuse
            existing gates).
          pitfall_preemptions: >
            Doer-written prose but not gameable in the acceptance sense - the
            pre-emptions constrain the DOWNSTREAM measurement design rather
            than settle this node's success, and each cites the run's
            exploration record by location, so an invented pitfall fails its
            citation and an omitted one is visible against the named minimum
            list. Recorded here so the reviewer challenges the judgment
            rather than discovering silence.
        model_effort:
          implementer_seat: >
            strong model, effort medium — wording-critical transcription and
            adjudicability judgment over a small evidence volume (one
            campaign's kickoff record, one matrix, one synthesized pitfall
            list); ambiguity is low because the discipline is verbatim
            quotation with source references, and the blast radius of a
            wrong registration is contained by two downstream catches (the
            mechanical comparators_preregistered check and gate-2
            adversarial review). Deviating below the run-wide high-effort
            default is justified by that containment, consistent with the
            parent's model_and_effort finding. If the binding cannot vary
            effort per node for this role, keep high — the cost delta is
            small.
          lead_seat_note: >
            The run-state commitment is the lead's own act under the root
            contract's single-writer table, not a seat this node dispatches;
            no assignment made here.

      evidence_questions:
        - Does every registered criterion and comparator item string-match
          its named source in kickoff_contract_record (or its matrix row by
          id in regression_matrix_draft), re-checkable by an actor other
          than the doer? (rung 1)
        - Does the comparator set fix baseline identity, configuration, and
          versions including the GPU-side reference, with a baseline-skew
          statement in machine-referencable form that
          measure_against_baseline can echo in every evidence bundle, as
          measurement_artifacts.subject requires? (root.v6)
        - Does the lead-committed run-state entry carry a timestamp
          preceding every measurement artifact for this campaign? (the
          frozen mechanical comparators_preregistered check settles it
          before measurement is consumed)
        - For each registered procedure, are the known pitfalls from the
          run's exploration record addressed as pre-emptions, including at
          minimum the four on file (serve-bench undercount on speculative
          configs, correctness-blind decode-bench connector,
          stable-read-before-verdict, delegate version-mismatch hard-exit)?
        - When a criterion surfaced as unadjudicable, is it quoted
          byte-for-byte with the ambiguity named and no proposed rewording,
          and did NO commitment request accompany it?

      interface_findings:
        - subject: lead commitment timing (assembly interface need)
          needs: >
            The frozen check only requires the run-state timestamp to
            precede measurement artifacts, which leaves slack - an
            uncommitted registration could ride through gate 2 and fail
            only at the serving-to-measurement edge, an expensive late loop
            (on_failure_route re-enters design_campaign). Recommend the
            lead commit upon consuming acceptance_preregistered, before
            assemble_design_record's self-check reads "marked for run-state
            commitment," so a missing commitment surfaces at design time.
            Lead's call; an interface note, not a contract change.
        - subject: registration artifact format
          needs: >
            Stable per-item ids and per-item source references (kickoff
            record path or matrix row id), so the mechanical check, the
            gate-2 reviewer, and the downstream measurement design can
            reference procedures and re-run the string comparison. Artifact
            lives under this campaign's design artifact directory per the
            parent's evidence declaration.
        - subject: pitfall evidence pointers
          needs: >
            The frozen consumes list names formal evidence ids only; the
            measurement-pitfall pre-emptions draw on the run's exploration
            record (system-map.md Evidence flow;
            exploration/validation-and-acceptance.md sections 3.3 and 3.5).
            Assembly should hand the seat those pointers in the dispatch
            brief. An interface note, not a contract change.
        - subject: baseline-skew downstream echo
          needs: >
            measurement_artifacts.subject (root.v6) requires every bundle to
            name the GPU-side version and cross-version differences; the
            registration must therefore carry those fields where the
            measurement boundary can cite them by id, not re-derive them.

      uncertainty_ledger:
        facts:
          - The dispatched contract is frozen at
            design_campaign.draft.pave.yaml#preregister_acceptance; the
            in-flight v2 parent repair is prose-only and the five child
            bodies are byte-identical (design_campaign.v2 revision note;
            verified by diff). Bears on - contract authority for this
            fragment.
          - comparators_preregistered is mechanical, evaluated_by lead,
            on_failure_route design_campaign, and guards the
            serving-candidate-to-measurement edge (root.v6:208-213,
            759-762). Bears on - the DoD's rung-1 leg and the two-actor
            shape.
          - The wrong-baseline incident is on record - the measuring agent
            picked its own comparators across re-entries until the user
            intervened; the pre-registered correction rule flipped the
            verdict (system-map.md:151-153;
            exploration/validation-and-acceptance.md section 3.3). Bears on
            - the grounding precedent for separation and the two-actor
            falsifier.
          - The kickoff contract carries target, route, source, thresholds,
            methods, models, and for upgrade routes the regression-matrix
            criteria (root.v6 assemble_kickoff_contracts purpose). Bears on
            - transcription sources exist; this node authors no criteria.
          - Backport instances never instantiate the matrix node, and the
            first design lap has an empty findings history (parent
            interface_findings routing; screen purpose). Bears on - the
            entry-paths superset note.
          - measurement_artifacts.subject requires every evidence bundle to
            name the GPU-side version and known cross-version differences
            (root.v6:143-150). Bears on - the baseline-skew statement has a
            declared downstream consumer.
          - Four measurement-tool pitfalls are on record in the run's
            exploration evidence (system-map.md:125-128,143-146,151-155;
            validation-and-acceptance.md sections 3.3, 3.5). Bears on - the
            pre-emption activity has named, bounded sources.
          - The L3 delegation (superset-consumes note, close-out boundary's
            idiom) is recorded in design_campaign.v2 delegations. Bears on -
            realized here as entry_paths_note.
        assumptions:
          - The kickoff record plus the run's exploration evidence suffice
            to author the baseline-skew statement without consuming
            delta_report. Falsifier - a campaign whose kickoff record omits
            the GPU-side reference identity; handled in-graph by
            criteria_unadjudicable (an under-specified comparator is an
            ambiguity for explicit user decision, never doer selection), so
            the assumption failing does not strand the run.
          - Run-state commitment mechanics (entry shape, timestamp source)
            are assembly-settled under the root contract's single-writer
            table; this design declares needs only.
        open_questions:
          - Where do pitfall pre-emptions come from, given the consumes
            list? Closed - the run's synthesized exploration record; pointer
            need recorded in interface_findings.
          - Can the registration and the matrix drift on the upgrade route?
            Closed - the registration references rows by stable id and
            quotes thresholds verbatim; gate 2 reviews both in one record,
            and the parent v2 gameability entry already notes the rows
            inherit the run-state anchor when this node freezes them.
          - Does an under-specified comparator map to a declared outcome?
            Closed - criteria_unadjudicable; surfacing verbatim is the
            codified remedy, and the parent routes it to no_progress for
            the user decision.
        research_dispatches: >
          none - the dispatch brief, both parent fragments, root.v6, and the
          run's exploration record answered every sizing-relevant question;
          no target-repo read was needed (the node touches no code).

      conflicts: []
