conflicts:
  - id: c1
    raised_by: cost_routes_and_rank_backlog
    summary: >-
      Root consumes gap on the costing re-entry loop:
      cost_routes_and_rank_backlog must read adversarial_review_findings to
      repair against findings and detect the identical-fingerprint stall for
      costing_stalled, but root.v6 consumes omits it. Also converged on by
      review_route_verdicts (its f1: findings record carries stable
      per-finding labels + cited-location fingerprints for exactly this
      read). Same declarative shape as round-2 fix C. Planned resolution:
      lead adds adversarial_review_findings to
      cost_routes_and_rank_backlog.consumes at resynchronization before
      assembly; no routing change; reviewer informed.
    status: resolved
  - id: c2
    raised_by: review_route_verdicts
    summary: >-
      Coverage refutation ("every requested target has exactly one
      disposition") needs the frozen target request from intake, absent from
      review_route_verdicts' frozen consumes. Planner proposed treating the
      persisted intake record as a read-only refutation source; planned
      resolution: lead prefers the declarative consumes addition
      (run_input_and_preflight_record) at resynchronization - same low-risk
      shape as c1; reviewer informed.
    status: resolved
  - id: c3
    raised_by: rederive_approach
    summary: >-
      Frozen consumes for rederive_approach omits five read-only inputs its
      first-principles read needs (measurement_artifacts,
      gate_approval_record, kickoff_contract_record,
      route_costing_and_backlog, and prior rederivation_record self-reads).
      Planned resolution: declarative consumes extension at
      resynchronization; nothing else moves.
    status: resolved
  - id: c4
    raised_by: review_measurement_verdict
    summary: >-
      Frozen consumes omits the kickoff criteria and route type the
      confirmation re-derivation reads (kickoff_contract_record at minimum;
      comparator registrations and approved_campaigns route field via run
      state). Without it, criteria drift - the wrong-baseline incident class
      - is uncatchable. Planned resolution: add kickoff_contract_record to
      consumes at resynchronization; run-state route reads are a runtime
      binding note. BATCHED 2026-08-25 per reviewer: the same add applies
      to adjudicate_results.consumes (its DoD quotes criteria verbatim from
      the kickoff contract but the frozen consumes omits it) - symmetry, or
      the two builders diverge on the pair whose whole relationship is
      re-derivation.
    status: resolved
  - id: c5
    raised_by: verify_run_closure
    summary: >-
      No declared outcome exists for a claimed closure that FAILS first-hand
      verification; the design records the named discrepancy and reports
      campaigns_remaining, but without a surfacing path to re-entry at
      close_campaign a silent hold at the join is a livelock. Options: (a)
      binding-level surfacing to close_campaign re-entry (no contract
      change), (b) one non-success outcome on verify_run_closure edged to
      close_campaign. RESOLVED IN PRINCIPLE 2026-08-25 (reviewer verdict +
      lead decision): option (b) - outcome closure_unverified with
      required_evidence run_closure_verdict, one edge to close_campaign
      (reuses the declared destination of closure_evidence_settled's
      on_failure_route), loop bounded by gate 3's user ownership stated in
      loop_bounds (no attempt caps). FOURTH PART added 2026-08-25 (reviewer,
      via close_campaign.v2): re-entry supersession semantics in the
      assembly artifact-layout reference - a close-out re-entry supersedes
      the prior closure_record and gate_approval_record to a declared
      archive path so "exactly one closure record" reads the current one;
      without this, laps accumulate records and verification can never
      converge. Re-entry re-executes the SAME closure type (no breach of
      the one-closure-type forbidden effect); gate-3 re-presentation
      matches the declined_closure precedent (gate identities, not
      interactions). Parent edit lands at resynchronization; status stays
      open until applied to the root draft. EDGE FORM settled 2026-08-25
      (reviewer, round 2 on verify_run_closure.v2): the closure_unverified
      edge lands in FAN-OUT form - to: {fan_out: close_campaign, for_each:
      the verdict record's discrepant-campaign set} - mirroring
      approved_campaigns_fan_out, because verify_run_closure has no
      instance_per while close_campaign does and one verdict can name
      multiple discrepant campaigns; a plain edge would be ambiguous about
      which campaign re-enters.
    status: resolved
  - id: c6
    raised_by: review_implementation
    summary: >-
      The frozen reviewed_impl_to_hardware edge carries no check, so nothing
      mechanically stops a post-review commit reaching leased hardware; the
      consumer-side convention is weak because run_hardware_attempts' roles
      include the implementer - the seat whose commit would be unreviewed.
      Reviewer-recommended, lead-accepted resolution at resynchronization:
      add a mechanical edge check (current branch checkout equals the
      commit stamped in the findings record), evaluated_by lead,
      on_failure_route review_implementation. Harm if skipped: a wasted
      leased-host cycle, a breaker tick, and a fingerprint entry that
      poisons no-identical-retry; detection is an exact stamp comparison at
      zero cost.
    status: resolved
  - id: c7
    raised_by: run_hardware_attempts
    summary: >-
      Frozen breaker_tripped meaning in root.v6 reads "ten attempts since
      last re-derivation" (count-ten-only). The child execute_attempt_loop's
      tier-1 no-materially-different-attempt check can exhaust BEFORE ten
      counted attempts; the honest condition is still a no-progress halt
      that must reach rederive_approach. The fragment folds early tier-1
      exhaustion into the child's breaker_tripped (logged as early
      exhaustion) so routing is preserved. Proposed resolution at
      resynchronization (planner's smallest change, lead-endorsed): widen
      the parent meaning to "the two-tier breaker halts (tenth counted
      attempt, or tier-1 exhaustion - no materially different attempt
      remains)". Harm if unresolved: either a strict reading forces up to
      ten known-identical attempts on leased hardware (wasted spend,
      fingerprint pollution), or the fold stands undeclared and the parent
      outcome meaning is inaccurate to its own evidence.
      AMENDED 2026-08-25 (venv round-1 cross-boundary finding,
      plan-reviewer-2): the SAME widening also admits a venv recipe
      dead end (replication_failed arrives with zero compile
      attempts; the strict ten-count meaning refuses it - c9-shaped
      wrong door). One edit at the same wording site now closes
      THREE conditions: tenth counted attempt, tier-1 exhaustion
      (no materially different attempt remains), and venv recipe
      dead end (replication exhausted without a countable approach
      attempt).
    status: resolved
  - id: c8
    raised_by: screen_pin_and_progress
    summary: >-
      Frozen consumes [kickoff_contract_record, delta_report,
      adversarial_review_findings] cannot settle "no new design
      evidence" on the revised_approach_to_redesign re-entry: the fresh
      lever produced by rederive_approach lives only in
      rederivation_record, which this node does not consume. Reading
      declared inputs alone, the node could emit progress_exhausted
      immediately after rederive_approach produced a revised approach -
      a screen<->rederive ping-pong burning the bounded rederivation
      laps. Raised in prose by np-screen (no id minted); c8 assigned by
      lead. Proposed resolution at resynchronization (planner's
      smallest change): extend screen_pin_and_progress.consumes with
      rederivation_record plus read access to prior
      campaign_design_record versions for the evidence-movement
      comparison. No new producer, edge, or check. Harm if unresolved:
      false progress_exhausted right after a legitimate re-derivation,
      wasting the campaign's recovery budget.
      RESOLUTION NARROWED (2026-08-25, plan-reviewer-2 boundary
      review): limb 1 ONLY - extend consumes with rederivation_record.
      Limb 2 (read access to prior campaign_design_record versions)
      REJECTED: findings records are already design-revision-stamped
      (review_campaign_design a1/a3 + its own interface finding), so
      comparing the stamps of the two most recent findings entries
      settles evidence movement from artifacts already consumed; limb
      2 would create the two-revisions-in-one-path misgrade hazard.
      Companion requirement: the findings-format assembly duty gains
      the design-revision stamp (a confirmation of an existing
      commitment, not new).
    status: resolved
  - id: c9
    raised_by: design_campaign
    summary: >-
      Lead-minted on the round-2 review finding (the planner asserted
      the mapping as settled rather than surfacing it - c7's shape).
      The child sizing valves (draft_increment_plan.scope_exceeded,
      assemble_regression_matrix.scope_exceeded) correctly route to
      rederive_approach, but the parent's only door there is
      no_progress, whose frozen meaning ("repeated identical review
      findings or no new design evidence across repair attempts")
      refuses sizing-valve traffic - a valve can fire on lap 1 with
      abundant new evidence. Destination right, door wrong. Proposed
      resolution at resynchronization (minimal widening, c7 pattern):
      extend the parent no_progress meaning to also cover a child
      sizing-valve firing, naming the breaching subset (a re-scoped
      campaign plan is itself a first-principles re-derivation
      product). Harm if unresolved: a strict reader of the parent
      meaning rejects the traffic and the valve strands - the exact
      defect HIGH-2(v1) named, one level up.
      CONFIRMED on primary evidence 2026-08-25 by plan-reviewer-2
      (root.v6:370-373 - a design-time scope breach is neither
      disjunct; widening at resync is the smallest fix, a fourth
      parent outcome would cost a node-level change for no routing
      gain). design_campaign.v3 states its mapping contingent on
      this conflict; reviewer PASSED that form.
    status: resolved
  - id: c10
    raised_by: acquire_hardware_lease
    summary: >-
      Raised in prose by np-lease (label n1, no id minted); c10
      assigned by lead. The frozen v2 activity "request a lease for a
      host matching the campaign's declared target hardware" omits
      the allowance filter that no_host_available's WIDENED meaning
      (allowance-exhausted counts as unavailable) requires. A literal
      implementer could re-request the host recover_leased_host just
      declared unrecoverable for allowance exhaustion: acquire ->
      venv -> host_faulted -> recover (exhausted) -> unrecoverable ->
      acquire re-grants the same host - spends no attempt budget,
      never terminates, and reopens the exact flap hole the widening
      closed. Proposed resolution at resynchronization (planner's
      smallest change, lead-endorsed): extend the activity with
      "excluding hosts whose recovery allowance for this campaign is
      exhausted (derived from the recovery records, never a stored
      counter)".
      CONFIRMED 2026-08-25 by plan-reviewer via independent
      verification (the loop is the second-order residue of its own
      round-2 flap fix - the disqualifier list describes the terminal
      condition, not the selection activity, and the activity text is
      operative); resolution endorsed as written.
    status: resolved
  - id: c11
    raised_by: capture_baseline_reference
    summary: >-
      Raised in prose by np-mbase (label n1, no id minted); c11
      assigned by lead. A strict reading of the frozen "any write,
      restart... ever" read-only-baseline line classifies launching a
      serving process on the GPU baseline as forbidden, producing a
