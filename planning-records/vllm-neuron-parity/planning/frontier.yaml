      being served. Smallest change at resynchronization: one
      clarifying clause scoping the restart/write prohibition to
      DURABLE host state (ephemeral serving-process lifecycle
      allowed, durable mutation forbidden) - the same operational
      definition the fragment books as assembly need i1, defined
      once and cited.
    status: resolved
  - id: c12
    raised_by: capture_baseline_reference
    summary: >-
      Raised in prose by np-mbase (label n2, no id minted); c12
      assigned by lead. A persistent pinned-capture-input digest
      mismatch (live digest contradicts the design-record pin) has
      NO honest door: baseline_unusable's frozen meaning is
      baseline-only, and the defect is design-side, first surfacing
      here because sibling smoke runs on scratch inputs. Smallest
      change at resynchronization: widen baseline_unusable's meaning
      by one clause ("or a pinned capture input whose live digest
      contradicts its design-record pin") - the destination
      (re-derivation) is already right.
    status: resolved
  - id: c13
    raised_by: stabilize_and_package_evidence
    summary: >-
      CROSS-REVIEWER CONFLICT on the (measurement, defect identity)
      pair keying (item 26 second append). plan-reviewer (who adopted
      the item at the measure v2 PASS) re-confirmed the mechanism on
      run_candidate_measurements: path-encoded pair keying makes the
      frozen count-by-path rule mechanical; relabeling hardened by
      content-derived identity + child-1 falsification + child-4
      proliferation check; asks only the one-phrase frozen-text
      substitution at the low1 landing sites + parent loop_bounds.
      plan-reviewer-2 filed HIGHs against the keying on BOTH its
      boundaries: (a) every frozen statement says per-measurement,
      and the parent's "without new evidence" qualifier ALREADY
      prevents the false exhaustion g4 cites (three distinct defects
      = three passes each with new evidence = zero budget charged
      under per-measurement keying); (b) pair keying unbounds the
      loop - nothing bounds N distinct identities per measurement,
      so a measurement failing on a slightly different property each
      pass never reaches the designed declared_measurement_
      unproducible stop; the composed filters at stab :142-143 make
      the first filter sufficient and the second the unbounding one.
      Provenance settled by lead: it IS a closed-review adopted item
      that never landed in contract text. Substance OPEN: cross-
      briefs sent to both reviewers; lead adjudicates on their
      positions. Candidate resolutions: (1) revert to per-measurement
      keying (strike g4's falsifier + pair leaks in mbase g3/i3,
      stab :129-143, mruns/mproc pair text; rely on the no-new-
      evidence qualifier); (2) keep pair keying, land the
      substitution, ADD an aggregate per-measurement bound on
      distinct identities (closes the unbounded-N branch by
      construction); (3) another smallest change a reviewer
      surfaces. HELD on c13: np-mstab + np-mbase REVISE repairs,
      mruns LOW-1 substitution, item 17 EIGHTH pair.
      POSITION 1/2 received (plan-reviewer, 2026-08-25): CONCEDES
      argument 1 in full and WITHDRAWS its own pair key as a budget
      key (redundant with the qualifier; false positive that
      propagated). REJECTS reverting as the fix for argument 2:
      per-measurement + qualifier is IDENTICALLY unbounded (each
      new-property lap zero-charges forever). ROOT CAUSE named: the
      loop_bounds sentence is self-inconsistent - the bound is
      judgment-filtered ("without new evidence") while the
      derivation is mechanical and unfiltered (count files by path
      counts every record); each reviewer anchored on one clause.
      RECOMMENDS resolution-(3) variant: TWO-TIER bound settling the
      existing declared_measurement_unproducible - fast tier =
      design_campaign.v3's exhaustion-predicate shape (same defect
      recurs AND no defect-closing evidence for that defect since
      that lap); backstop tier = absolute per-measurement pass
      ceiling counted mechanically by path on ALL passes
      (breaker_tripped ten-attempt precedent; ceiling value =
      lead's call). Identity survives in the fast-tier predicate,
      stops being a budget key. Qualifier judgment burden
      acceptable ONLY with the backstop (novelty-inflation vector:
      the deciding seat is under standing pressure to answer "new
      evidence"). Heaviest failure mode: the unbounded loop
      (irreversible leased-host spend, no operator stop past gate
      2). Held-item dispositions: LOW-1 substitution WITHDRAWN
      (loop_bounds amends to the two-tier text instead); EIGHTH
      pair SURVIVES NARROWED (re-entry targeting + recurrence
      predicate, no budget arithmetic); mbase g4 falsifier strike
      conceded WITH re-verify condition (at the ceiling, premature
      exhaustion becomes possible again); mruns defect_identity_
      stability entry + mproc verbatim-pair-key copying shrink to
      "revision entries name the defect they repair". Awaiting
      position 2/2 (plan-reviewer-2).
      POSITION 2/2 + LEAD ADJUDICATION (2026-08-25). Reviewer-2:
      concedes the builder failure mode is REAL because the
      qualifier is x_planning-ONLY (:397 sits in extensions; neither
      outcome meaning nor the activities line carries it, and NO
      contract text states the number three - its own where-it-lands
      rule applied against itself); the missing piece is the
      QUALIFIER, not a partition; the novelty judgment is already
      MECHANIZED as a recorded NEW-relative-to-prior field (file
      arithmetic in both designs - the judgment-burden dichotomy
      dissolves); pair keying keeps the filter anyway, so option (2)
      = option (1) + three extra parts (9.14.2 favors (1)).
      RESOLUTION (lead synthesis): (i) budget keying reverts to
      PER-MEASUREMENT; (ii) qualifier + magnitude + keying land in
      CONTRACT TEXT at the three sites reviewer-2 enumerated plus
      loop_bounds; (iii) reviewer-1's UNFILTERED BACKSTOP added -
      absolute ceiling on total passes per measurement counted by
      path regardless of new evidence, suggested NINE (three times
      the filtered budget; hardware-breaker two-tier precedent) -
      closes the residual unbounded branch under genuine per-lap
      novelty that option (1) alone leaves open (reviewer-1's
      counterfactual, unrebutted by position 2/2); (iv) pair keying
      STRUCK run-wide; (v) EIGHTH pair booked NARROWED (re-entry
      targeting + recurrence/novelty predicate, no budget-key
      role); (vi) g4 falsifier struck now, at-ceiling false-
      exhaustion falsifier re-verified at resync (reviewer-1
      condition). Repairs released: np-mstab + np-mbase on v2
      paths; np-mproc updated mid-repair (pair-copy text shrinks).
      Contract edits ride resync as item 26 fifth append.
      ACCEPTANCE ROUND (2026-08-25): both reviewers accepted the
      adjudication; landing set EXTENDED to run_candidate_
      measurements' five budget-reader sites + three further
      refinements - see item 26 SIXTH append.
    status: resolved
