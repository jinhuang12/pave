# Node-planner draft v3 — prepare_pr (vllm-neuron-parity)
# Supersedes planning/prepare_pr.v2.draft.pave.yaml (kept as provenance;
# v2 closed boundary-review finding F-PR and the detector-key addendum).
# SOLE DELTA (LOW micro-amendment from boundary review): the content-
# identity predicate is hardened against the unresolvable-revision false
# pass — `git diff <bad-object>` writes its error to stderr, exits nonzero,
# and leaves stdout EMPTY, so a naive no-output test passes. The predicate
# now requires (a) `git rev-parse --verify` succeeds on the measured
# revision, and (b) the git diff exits status 0 with empty output —
# transcript persists both. Propagated to every text stating the predicate.
# Verdict: ATOMIC (unchanged). nodes stays empty.
pave:
  name: prepare_pr
  status: draft
  nodes: {}
  extensions:
    x_planning:
      dispatched_node: prepare_pr
      frozen_contract_reference: planning/root.v6.draft.pave.yaml#prepare_pr
      supersedes: planning/prepare_pr.v2.draft.pave.yaml
      revision_note: >
        v3 sole delta: content-identity predicate hardened to exit-code
        discipline - the measured revision must resolve
        (`git rev-parse --verify` succeeds) and the git diff must exit
        status 0 with empty output, transcript persisting both - closing
        the unresolvable-revision false pass (`git diff <bad-object>`
        errors to stderr with empty stdout). Propagated to the DoD (d),
        activity 5, the gap trigger, the edge-check recommendation, and
        every other text stating the predicate. All v2 content otherwise
        carried forward: F-PR content-identity repair, gap-path no_progress
        detector, detector keying on review_pr_evidence's normalized
        findings form.
      elaboration:
        prepare_pr:
          verdict: atomic
          justification: >
            One implementer, in the campaign's isolated worktree, tidies the
            branch and records the clean diff against the campaign_target_pins
            base, drafts the contribution-checklist-complete description with
            every claim linked to an existing world artifact, and settles the
            definition of done by a mechanical pass — every referenced
            artifact path resolves on disk and every acceptance-bearing
            artifact is content-identical to the final branch head (the
            measured revision recorded in the measurer's own artifact
            resolves under `git rev-parse --verify`, and its `git diff`
            against the final head exits status 0 with empty output; all
            identifiers and the diff output are git-issued). Falsified if
            packaging ever has to produce new measurement or verdict
            evidence in-node, or if diff-cleaning demands multi-attempt
            conflict resolution that exceeds one bounded context.
      atomic_contract:
        definition_of_done: >
          pr_package_ready — the package at
          artifacts/campaigns/<campaign>/pr/ is
          contribution-checklist-complete and every claim links to world
          evidence — settled at ladder rung 1 (pave-spec §5.3.1): a
          mechanical verification pass whose transcript persists inside the
          package confirms (a) every checklist item recorded pass with its
          concrete evidence path; (b) every referenced artifact path resolves
          on disk, or carries an explicit remote-only marker with host and
          remote path; (c) the recorded `git diff <pin-base>...<branch>`
          transcript is clean — no compile-cache, NEFF/HLO, run-directory,
          or campaign-state debris staged, contamination scan exit 0;
          (d) every acceptance-bearing artifact under claim (measurement
          bundle, adjudication verdict) is content-identical to the final
          campaign-branch head — the measured revision recorded inside the
          measurer's or adjudicator's own artifact (an identifier the
          packager cannot mint) first resolves
          (`git rev-parse --verify <measured-revision>` succeeds), and
          `git diff <measured-revision> <final-branch-head>` exits status 0
          with empty output — empty stdout alone proves nothing, since a
          bad object also produces it while erroring to stderr — with the
          transcript persisting both the rev-parse result and the diff exit
          status; both revisions and the diff output are git-issued. A
          repair commit landing after measurement still fails — non-empty
          diff — which is what this item exists to catch; history tidying
          that preserves tree content (squash, rebase onto the frozen base)
          passes, so artifact immutability and branch tidying no longer
          conflict; (e) the baseline-skew declaration is present and copied
          from the measurement bundle's recorded GPU-side vLLM version and
          known cross-version differences, never authored fresh.
          The settling act reads disk and git output, not the implementer's
          assertion; review_pr_evidence re-settles from the same persisted
          artifacts.
        activities:
          - Read the campaign's kickoff-declared acceptance criteria and the
            run's self-owned contribution checklist artifact (route-scoped -
            correctness+perf gate items for backport routes, regression
            matrix items for upgrade routes).
          - Tidy the campaign branch in its isolated worktree (squash WIP
            debris, clean history) and record the diff transcript against
            the base branch resolved from campaign_target_pins at run time.
          - Run the mechanical change-set scans - debris sweep and
            NxDI-contamination scan over added/modified lines - and persist
            the exit-code transcripts.
          - Draft the PR description - what and why, route and source used,
            measurement summary with artifact links, verdict trail
            (adjudication verdict plus adversarial findings records),
            baseline-skew declaration, CPU-mode and hardware test evidence.
          - Run the link-resolution and content-identity verification pass
            over every acceptance-bearing claim - per artifact, the measured
            revision read from the producing role's artifact resolves under
            `git rev-parse --verify`, and
            `git diff <measured-revision> <final-branch-head>` exits status
            0 with empty output - and persist the transcript covering both
            the rev-parse result and the diff exit status in the package.
          - Emit exactly one outcome per the routing discipline below.
        routing_discipline:
          handled_locally:
            - Description drafting, formatting, link assembly, checklist
              bookkeeping.
            - Diff tidying and history cleanup against the frozen pin base
              (the base cannot move mid-run - it is frozen in
              campaign_target_pins and protected by the run-wide
              branch-mutation blocking hooks). Content-preserving tidying
              never invalidates acceptance evidence under the content-
              identity predicate.
            - Package repair after review_pr_evidence material findings that
              name presentation or linkage defects (the repair loop edge
              pr_findings_to_package_repair).
          evidence_gap_found_when:
            - A checklist-required claim has no artifact on disk.
            - An acceptance-bearing artifact fails content identity - the
              measured revision recorded in the producing role's artifact
              does not resolve (`git rev-parse --verify` fails), or the
              `git diff` between it and the final branch head exits nonzero
              or produces output (e.g. a repair commit landed after
              measurement, or the recorded revision was garbage-collected
              or mistranscribed). Never fired by content-preserving history
              tidying.
            - A kickoff-declared measurement or the baseline-skew fields are
              absent from the measurement bundle. Anything needing NEW world
              evidence routes out; this node never measures.
          no_progress_when:
            - The current review_pr_evidence findings record for this
              campaign's package is identical to the prior lap's under that
              sibling's stable normalized findings form, and no new evidence
              artifact has appeared since. The detector keys on the
              normalized record's per-finding elements - finding label,
              package location (the claim or artifact path the finding
              names), defect class, and required change - so
              identity-across-laps is a mechanical string match over those
              elements, never judgment. Detector reads the adversarial
              findings history under artifacts/reviews/ for this campaign;
              an empty history on first entry is normal and never triggers.
            - The evidence_gap_found path stalls - this node would emit the
              same named gap (or an identical gap set) it emitted on a prior
              lap while the campaign's evidence directory is unchanged since
              that lap (detector compares the recorded gap list and the
              evidence-directory state against the prior lap's record,
              persisted in the package workspace). Recorded detector, no
              attempt caps.
            - Diff-cleaning is unresolvable - the changeset cannot be
              cleanly based on the frozen target base - since repeated
              packaging attempts cannot fix a broken changeset; that is
              re-derivation territory.
        atomicity_falsifier_disposition: >
          The framing falsifier (repeated re-measurement loops) cannot
          materialize as intra-node work: evidence_gap_found routes each gap
          to measure_against_baseline and every prepare_pr run is a fresh
          bounded assembly pass over stable artifacts. Repeated laps through
          that edge are a graph-level loop bounded on both paths - the
          review-repair path by the findings-history detector, and the
          gap path by the identical-gap-unchanged-artifacts detector added
          in v2 - each landing on rederive_approach (root loop_bounds
          note), not node-internal volume. Atomic stands.
      enforcement:
        - subject: pr_evidence_package completeness claim
          gameability: >
            Gameable in part - the implementer writes both the package and
            the verification transcript, so it could narrow the checklist or
            misstate the content-identity result.
          hardening: >
            Harden-first order (pave-spec §9.14.1). Rung 1 provenance - every
            acceptance-bearing claim binds to git-issued identifiers (the
            measured revision recorded in other roles' artifacts, the final
            branch head, and the diff output itself) and to artifacts
            authored by other roles (measurer, adjudicator, reviewers); a
            link to a nonexistent artifact fails mechanically, and a forged
            content-identity claim is re-derivable by anyone from the same
            two git-issued revisions. Rung 2 - recommend a lead-evaluated
            mechanical check on the pr_package_to_pr_review edge re-running
            link resolution and the content-identity predicate in its fixed
            form - `git rev-parse --verify` succeeds on the measured
            revision AND `git diff <measured-revision> <final-branch-head>`
            exits status 0 with empty output; NEVER SHA equality (which
            would re-introduce the F-PR false gap as a blocking edge check)
            and never an output-emptiness test alone (which a bad object
            also passes while erroring to stderr) - see interface findings.
            Rung 3 - review_pr_evidence already provides the independent
            adversarial pass for the judgment surface (does the description
            honestly represent the evidence).
          strength: mechanical (script-verifiable resolvability and
            content identity) plus the existing independent review.
          why_no_stronger_rung: >
            False-pass severity is capped by review_pr_evidence and the
            gate-3 human decision before any push; debate or a stage audit
            would duplicate the existing review node without new detection
            power.
        - subject: protected-base mutation during diff tidying
          gameability: not gameable (git refuses or the hook blocks; the
            failure is world-visible).
          strength: existing run-wide blocking hooks (root-contract §3
            forbidden effect 1) - reuse, no node-local addition.
          why_no_stronger_rung: the existing gate already catches the
            failure before harm.
        - subject: debris and NxDI contamination in the change set
          gameability: not gameable once the scan transcript persists (exit
            codes over the actual diff).
          strength: mechanical scans as node activities with persisted
            transcripts - likely (build debris happens), costly (poisons the
            PR), precisely detectable.
          why_no_stronger_rung: precise mechanical detection makes review
            redundant for this sub-check; review still reads the transcript.
      model_effort:
        implementer: >
          strong model, high effort - matches the root's frozen role-level
          assignment. Medium effort would likely hold (checklist-driven
          packaging with three downstream catches - mechanical edge check,
          adversarial review, gate-3 human), but splitting the implementer
          role into a second tier for one node does not earn its cost, and
          the node carries real judgment: deciding gap-vs-local-repair and
          writing an honest description.
      evidence_questions:
        - question: Does packaging ever require re-measurement in-node?
          answer: No - closed from the frozen contract; evidence_gap_found
            routes to measure_against_baseline (root.v6 edge
            evidence_gap_to_remeasure). No explorer needed.
        - question: Can diff-cleaning blow the context via conflict storms?
          answer: No - closed by frozen-state semantics; the base is frozen
            in campaign_target_pins and hook-protected, and backport
            branches are cut from it; an unresolvable rebase means a broken
            changeset, routed as no_progress. No explorer needed.
        - question: Does a delegate skill validate plugin-repo PRs?
          answer: No - closed from system-map.md (delegates lens); the
            contribution-validation delegate validates NAD-repo artifacts
            only; the checklist is self-owned (precedent at
            skills/vllm-neuron-feature-port/references/contribution-checklist.md).
        - question: Do no-benefit closures pass through this node?
          answer: No - closed from root.v6 routing; no_benefit_confirmed
            routes review_measurement_verdict directly to close_campaign, so
            prepare_pr only ever assembles for pass-confirmed campaigns.
        - question: Can branch tidying coexist with immutable acceptance
            artifacts?
          answer: Yes, under content identity only - closed by boundary
            review F-PR; SHA identity provably fails on every tidied branch
            (squash rewrites SHAs while artifacts are frozen at entry), so
            the settling predicate is the verified-revision empty diff
            (rev-parse succeeds, diff exits 0 with empty output) between the
            measured revision and the final head.
      interface_findings:
        - finding: >
            prepare_pr's frozen contract lists no allowed_effects, but diff
            tidying needs writes inside the campaign worktree and branch
            (the same allowance implement_increments declares). The root's
            run-wide allowed effects (isolated worktrees; campaign branches
            on the fork) already authorize it, so no frozen-field change is
            needed - recorded so the assembly stage can mirror the allowance
            explicitly if it normalizes effects per node.
        - finding: >
            Recommend (lead's call, parent-level) a mechanical check on edge
            pr_package_to_pr_review, evaluated by the lead like
            evidence_stable_before_verdict - package links resolve and every
            acceptance-bearing artifact passes the content-identity
            predicate (`git rev-parse --verify` succeeds on the measured
            revision, and `git diff <measured-revision>
            <final-branch-head>` exits status 0 with empty output) - with
            on_failure_route prepare_pr. The check MUST use this fixed
            predicate: never SHA equality (fails on every content-preserving
            tidy - the F-PR false gap as a blocking edge check), and never
            an output-emptiness test alone (a bad object also produces
            empty stdout while erroring to stderr - a false PASS). Cheap,
            precisely detectable, and it stops a reviewer from reading a
            package whose links dangle.
        - finding: >
            The run-specific contribution checklist is a build-stage
            artifact adapted from the absorbed skill's precedent. The
            adaptation must drop the precedent's benefit-sign-selects-
            terminal logic (items 9-10 terminal routing): in this graph the
            no-benefit split happens at review_measurement_verdict before
            prepare_pr ever opens, and closure-type selection is
            close_campaign's. The currency rule carries over in
            content-identity form (verified measured revision diffing empty
            against the final head, exit-code checked), not the precedent's
            exact-revision-name form, which presumes an untidied branch; the
            evidence-resolvability rule carries over intact.
        - finding: >
            Route scoping - for upgrade-route campaigns the checklist's
            measurement items read the kickoff-declared regression matrix
            instead of the correctness and performance gates; the package's
            evidence section is route-scoped and the base branch name always
            resolves from campaign_target_pins at run time (pin-generic).
        - finding: >
            Sibling coupling - review_pr_evidence re-settles the same
            currency property; its planner applies the mirrored
            content-identity predicate (per the lead's boundary-review
            routing). The two predicate texts must stay identical in
            substance: the revision recorded in the producing role's
            artifact resolves under `git rev-parse --verify`, and its git
            diff against the final campaign-branch head exits status 0 with
            empty output, transcript persisted.
        - finding: >
            Producer/detector key agreement (loop-bound dependency) - this
            node's no_progress detector is mechanical only if
            review_pr_evidence's findings record keeps a stable normalized
            form across laps. Resolution per the lead: the four-element
            findings-record shape (finding label, package location, defect
            class, required change) is pinned once in the artifact-layout
            reference at assembly, and both fragments cite it - no
            duplication. A format change that renames or drops any of those
            elements silently breaks this loop bound; treat the record
            shape as a frozen interface between the two build units.
      uncertainty_ledger:
        facts:
          - prepare_pr contract, outcomes, and routing - root.v6.draft.pave.yaml
            (nodes.prepare_pr; edges confirmed_pass_to_pr_prep,
            evidence_gap_to_remeasure, pr_no_progress_to_rederivation,
            pr_findings_to_package_repair).
          - pr_evidence_package is a derivation at
            artifacts/campaigns/<campaign>/pr/ - root.v6 evidence table.
          - Opening the PR is out of scope here; push and open belong to
            close_campaign - root.v6 and root-contract.md §3.
          - Baseline-skew declaration is a user requirement carried inside
            measurement_artifacts - requirements.md (baseline-skew control)
            and root.v6 measurement_artifacts subject.
          - Checklist precedent with three-way outcome split and currency
            rule - skills/vllm-neuron-feature-port/references/contribution-checklist.md.
          - Contribution-validation delegate does not validate plugin PRs -
            system-map.md delegates lens.
          - Boundary review F-PR (HIGH) - v1's SHA-identity predicate
            contradicted branch tidying and artifact immutability; repaired
            in v2 to content identity (lead's boundary-review return,
            2026-08-25).
          - Boundary review LOW micro-amendment - `git diff <bad-object>`
            exits nonzero with empty stdout, so an output-emptiness test
            alone false-passes on an unresolvable measured revision;
            repaired in this v3 with rev-parse verification plus diff
            exit-status 0 (lead's return, 2026-08-25).
        assumptions:
          - By entry, measurement artifacts, adjudication verdict, and
            review findings exist and are stable (only inbound happy-path
            edge is confirmed_pass_to_pr_prep); under content identity this
            stability is consistent with later history tidying.
          - One campaign's evidence volume fits one bounded context because
            artifacts are read as needed, never held at once.
          - The kickoff contract names the per-campaign acceptance criteria
            the checklist instantiates.
          - The measurer's and adjudicator's artifacts record the revision
            they ran against (root.v6 measurement_artifacts subject and the
            requirements' currency rule imply it; the checklist build unit
            must require the field explicitly).
        open_questions_closed:
          - All evidence questions above closed from the frozen graph, root
            contract, system map, checklist precedent, and the boundary
            review; no explorer dispatches were needed.
      conflicts: []
