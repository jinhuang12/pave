        high1b_pair_leaks_fixed: >
          Landing sites - enforcement.g3 rule (re-capture trigger reworded
          to the defect-named per-measurement form: the trigger is the
          DEFECT RECORD that enumerates the invalidated comparisons;
          measurement id and content-derived defect identity remain record
          FIELDS for targeting, never budget keys), interface_needs.i3
