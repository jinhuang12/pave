pave:
  name: capture_baseline_reference
  status: draft
  nodes: {}

  extensions:
    x_planning:
      dispatched_node: capture_baseline_reference
      frozen_contract_reference: planning/measure_against_baseline.v2.draft.pave.yaml#capture_baseline_reference
      supersedes: planning/capture_baseline_reference.draft.pave.yaml
      revision_deltas:
        high1a_g4_regrounded: >
          Landing sites - enforcement.g4_budget_derivation (renamed from
