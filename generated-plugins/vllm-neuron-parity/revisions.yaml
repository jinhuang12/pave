  semantic_diff: 'Re-entry instruments on screen_pin_and_progress and preregister_acceptance,
    declared per node: the investigator seat runs on the first entry into the screen
    and the implementer seat on the first preregistration; every re-entry whose registered
    inputs are byte-unchanged the lead settles mechanically with no seat (pin digest
    plus standing note; the four-slice check on the byte-unchanged registration),
    and any registered-value touch keeps the full value-level seat. Which instrument
    answers the node at each entry is runtime binding (pave-spec section 2.1), so
    this lands as kind binding; no node is added or removed, no outcome, edge, check,
    or evidence definition changes, and the counts stay 32 / 95 / 14. Same check,
    cheaper instrument, mechanical evidence still produced - rule 9''s bound - so
    check strength is unchanged. Why it holds for runs in general: a priced seat re-run
    over byte-unchanged inputs buys no evidence, in any run.'
