  semantic_diff: 'Gate-2 materiality and the design repair loop, plus set-sized scoping
    in the increment loop, in one graph revision. Counts: 32 nodes / 95 edges / 14
    checks become 32 / 95 / 15; 5 endpoints and 24 evidence definitions unchanged
    (three evidence subjects reworded). (1) review_campaign_design defines material
    - the nodes that consume the design would build the wrong thing from it as written,
    or a frozen or registered value would move (P9); nothing else. Everything else
    is bookkeeping - recorded in the same findings record, never selecting an outcome;
    the lead applies it as direct edits to the plan or record with one revision-log
    line and the edit plus new digest in run state, no seat and no lap (pave-spec
    9.4 and the 9.8 lead-edit row). No new outcome or edge is needed: bookkeeping
    never routes, so an outcome for it would be an edge nobody traverses. The reviewer
    labels each material finding''s class (repair-introduced included) and surfaces
    so both lead-evaluated checks stay mechanical. (2) New check design_loop_within_bound
    (mechanical, lead) on the four repair edges out of the gate - design_findings_to_redesign,
    narrow_registration_repair, narrow_record_repair, narrow_plan_repair - bounds
    the loop at eight rounds without design_sound or two consecutive rounds half repair-introduced,
    counted since the last verbatim user decision at the gate or the last entry from
    outside the design boundary. Repair-introduced is decidable from the block diff
    plus the findings record - a finding on a block the previous lap''s block diff
    touched that no earlier round named - and is not assigned in the round after a
    whole-plan lap. Its on_failure_route is the gate itself, re-entered for the user''s
    disposition - the lead presents the standing findings with a close-anyway recommendation
    and the user''s verbatim decision disposes of them (design_sound) or grants one
    more lap under a fresh count; a P9 finding is never disposed. Which seat, if any,
    answers that re-entry is runtime binding and is declared in the binding successor.
    (3) design_approved_by_user states the standing approval - a recorded gate-2 approval
    holds across re-entries while the registration is byte-unchanged, the criteria
    and the user decisions recorded at this gate intact, and no material finding stands
    - and the gate node''s purpose says it applies that standing approval on such
    a re-entry instead of re-asking; batch_review_current''s wording follows the layout
    reference (one findings record per review node, a dated section per round), no
    change to what it tests. (4) Outcome meanings: design_sound absorbs applied bookkeeping
    and the bound disposition; material_findings names when the full lap is required;
    narrow_findings drops the first-run artifact path and provenance stamp and says
    the repair is block-scoped with a block diff handed back; narrow_delta_scoped
    counts material findings only. (5) draft_increment_plan authors against the target
    artifacts on disk and re-enters block-scoped - the brief names blocks, the lap
    hands back a block diff with touched and must-hold digests, an unnamed-block cascade
    stops for a re-brief, a whole-plan lap is its own briefed lap; increment_plan_draft
    and plan_drafted carry the block diff. (6) scope_next_increment may select a set
    of pending items sized by the batch review''s complexity call (one when any is
    complex, up to three low-complexity in aggregate), marks a pairwise-disjoint-surface
    set eligible for concurrent realization, and collapses a landed item''s plan block
    to its ledger row; increment_lap_record (which also lists any join conflict of
    a concurrent-eligible set as a scheduling defect) and increment_selected carry
    the set. realize_increment realizes the item or set with per-item evidence, converges
    the set at one outcome by the existing precedence, admits one checkout per item
    on the campaign branch for a concurrent-eligible set in its purpose and allowed_effects,
    and leaves hands-per-set to runtime binding. (7) verify_run_preconditions records
    the GPU baseline as a declared input; reachability is capture_baseline_reference''s
    baseline_unusable door. (8) Rationale-only: the three narrow edges and the three
    re-entry instrument paragraphs drop their user-directed-amendment stamps and the
    approvals/ path (revision 1''s deferred item). Price per run: nothing new is priced
    - a drafter lap and a reviewer round per bookkeeping finding go to zero, the design
    loop is capped at eight reviewer rounds per user decision, and one scoping lap
    may carry up to three low-complexity items. Envelope (rule 6) - changed_with_approval:
    the lead gains a write path into the increment plan and design record (bookkeeping
    edits, landed-block collapse), a state-authority move; the user gate fires less
    often under the standing approval, a user-directed check change; design_sound
    can be recorded by user disposition at the bound; and realize_increment''s write
    set widens to one checkout per item for a concurrent-eligible set. Check strength
    otherwise never weakens - narrow_delta_scoped keeps its recurrence clause, P9
    stays non-waivable, no check is dropped. Why it holds in general: a repair loop
    with no declared bound stops only when a person tires; a finding the consumer
    re-derives from persisted inputs cannot change what gets built, so a seat that
    repairs it buys nothing; a realization lap that holds one item while disjoint
    low-complexity items wait pays a scoping lap per item for no evidence.'
