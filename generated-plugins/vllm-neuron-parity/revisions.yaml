  semantic_diff: 'Lands the graph layer of the seven amendments the field root applied
    to the delivered graph between 2026-08-29 and 2026-09-03: three change only the
    graph and land here; three touch only the lead skill and hook scripts (evolution
    contract rules 8 and 9, the advisory-hook omission correction, the lead-session
    identity gate); the 2026-08-31 ceremony-cuts amendment splits - its edge narrow_plan_repair
    lands here, and its re-entry instrument declarations on screen_pin_and_progress
    and preregister_acceptance are runtime binding and land separately as revision
    2, kind binding. Counts: 31 nodes / 89 edges / 12 checks become 32 / 95 / 14;
    5 control endpoints and 24 evidence definitions unchanged. (1) Severity triage
    at gate 2: outcome review_campaign_design.narrow_findings, check narrow_delta_scoped,
    and edges narrow_registration_repair, narrow_record_repair, and narrow_plan_repair
    route findings that name only increment-plan, design-record, or registration surfaces
    to a drafter-scoped repair on the continued doer thread and back to the gate,
    instead of a full design lap; a repeated finding fingerprint or any ambiguity
    fails closed into the full lap, and the full-lap edge design_findings_to_redesign
    is untouched (its rationale now says full-lap re-entries land at the screen while
    narrow re-entries land at their resolving node). (2) Deletion replaces archiving
    at design re-entry: superseded lap material is deleted from the read path and
    history is the record''s one-line revision log plus run state (assemble_design_record
    purpose and activities - the record delta-updates in place and superseded lap
    banners are deleted - record_incomplete meaning, design_entry_id state field);
    assemble_design_record also consumes adversarial_review_findings so the record
    carries the standing findings. (3) Per-batch implementation review: node review_increment_batch
    (adversarial_reviewer, fresh seat per batch, read-only; outcomes batch_sound /
    material_findings / design_contradicted), check batch_review_current (lead-mechanical,
    on passed_to_next_scoping and plan_satisfied_to_recording, on_failure_route review_increment_batch),
    edges batch_sound_to_scoping, batch_findings_to_repair -> scope_next_increment,
    and batch_review_to_redesign -> screen_pin_and_progress; adversarial_review_findings
    gains a producer, increment_lap_record carries the open batch and the size call,
    and review_implementation narrows to cross-increment integration. Price: one fresh
    adversarial_reviewer seat per 1-3 landed increments - in the first run''s shape,
    roughly twenty to fifty-five seats per campaign - approved with this landing under
    rule 6''s budget item. Why these hold for runs in general: a repair scoped to
    the surfaces a finding names cannot regress surfaces it never touched; an archive
    nobody reads is state ceremony the document budget forbids; and a graph that reviews
    a whole campaign once at its end cannot catch a defect while it is still one commit
    deep, whatever the campaign. No existing check changes; two existing edges gain
    a check.'
