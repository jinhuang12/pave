  semantic_diff: 'Instruments on five existing nodes, declared per node; no node,
    outcome, edge, check, or evidence definition changes and the counts stay 32 /
    95 / 15. (0) Seat continuity for the stage-6 loop, declared once per node in activities
    (where revision 2 put its instruments): one retained doer thread per campaign
    answers scope_next_increment (when a seat is dispatched), realize_increment, and
    record_changeset for every item, replaced only when its context degrades the work;
    review_increment_batch stays a fresh seat per batch. (1) scope_next_increment:
    every lap the lead settles mechanically from the persisted inputs (landed set,
    gate table and milestone order, ascending id, open batch and size call, detector
    inputs, worktree preconditions) with a lap record that carries the commands it
    derived from; the implementer seat runs only for a judgment the rule does not
    settle - a contradiction candidate no realizer record holds, or a findings-history
    versus lap-record disagreement; ambiguity runs the seat. (2) review_campaign_design
    re-entry: whole read on the first review of a design entry and on full-lap re-entries;
    after a block-scoped repair the seat reads the touched blocks, their cascade,
    and one scripted census while the lead byte-checks untouched blocks against the
    must-hold digests; at the bound re-entry (design_loop_within_bound failed) no
    reviewer seat is dispatched - the lead and the user answer it; the challenger
    is retained across the rounds of one design entry (spec 9.4). (3) assemble_design_record:
    when the only changed input is a verified block diff whose touched blocks keep
    their contracts complete, the lead performs the delta and the self-check with
    no seat; any other changed input, a gap, or ambiguity runs the assembler. (4)
    realize_increment: one retained seat realizes a set in order by default; a concurrent-eligible
    set may run one seat per item when each has its own checkout and the lead lands
    them at the join, a join conflict returning the set to serial. Price per run:
    the scoper seat goes from one per lap to one per judgment lap; a bookkeeping reviewer
    round and an assembler seat per block-scoped re-entry go to zero; no new seat
    is priced. Envelope (rule 6) - changed_with_approval: the lap record becomes the
    lead''s by default and the lead performs the record delta - state-authority moves
    under rule 6. Same checks, cheaper instruments, mechanical evidence still produced
    in every lap record (rule 9''s bound); a check the graph forbids the lead to judge
    keeps its seat. Why it holds in general: an outcome any reader re-derives from
    persisted inputs is not a judgment, so a seat that re-derives it buys no evidence,
    and a fresh challenger each round forces a living document to carry its whole
    argument history in self-defense.'
