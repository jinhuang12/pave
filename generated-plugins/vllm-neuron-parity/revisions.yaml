  semantic_diff: 'Ten recorded graph-layer defects in one revision, every one of them
    prose inside existing structure: two checks asked the wrong question, and five
    node bodies restated duties their references pin once - one of those restatements
    carrying the wrong remedy. Counts: 32 nodes / 95 edges / 16 checks / 24 evidence
    definitions / 5 control endpoints, all unchanged. Every node id, outcome set,
    role list, allowed and forbidden effect, consumes and produces list, required_evidence
    list, check style, evaluator and failure route is byte-identical, proved by parsing
    both graphs and comparing them field by field, not by reading the diff. No node,
    outcome, edge, check or evidence definition is added, removed or re-scoped. 28
    added lines against 36 removed in 9 hunks, a net cut of 8 lines.

    (1) THE MEASUREMENT-TRAP ACTIVITY NO LONGER PRESCRIBES THE INSTRUMENT THAT FAILED.
    realize_measurement_procedures told the measurer "the stock serving-benchmark
    path undercounts speculative-decode configurations (use a streaming harness for
    those); the decode-only bench connector produces no correctness signal" (:2047-2050).
    Its authority says the opposite about the remedy: the undercount comes from deriving
    throughput out of stream chunks in ANY harness, a campaign''s own streaming harness
    reproduced it, and whether the stock tool shares the failure is unverified at
    this pin (references/measurement-pitfalls.md:46-50). A measurer following the
    activity builds the anti-pattern. Both clauses are now one pointer plus the clause
    that changes what the node does: realize no procedure that reproduces a trap recorded
    in references/measurement-pitfalls.md, and where a trap is in what the procedure
    counts, swapping the instrument that exposed it is not the remedy. WHY, generally:
    it names no tool, no model and no metric, and it corrects the reasoning error
    rather than the example - the graph told a seat to fix a mismeasurement by changing
