pave:
  version: 0.3.0
  name: vllm_neuron_parity
  status: draft
  purpose: 'Bring the vLLM-Neuron platform plugin fork to parity with upstream
    vLLM on NVIDIA GPUs, measured on the repo-tracked feature x model parity scorecard.
    One run: scan the upstream delta against the pinned release, cost each requested
    target''s routes (backport at the pin vs pin upgrade), rank the backlog, and
    execute user-approved campaigns (feature port and model port; shared intake
    and shared validation back-end) until each target closes through gate 3 as
    exactly one of: evidence-backed PR opened on the fork, no-benefit closure,
    or honest blocked terminal.

    '
  entrypoints:
  - verify_run_preconditions
  scope:
    in:
    - Delta scan of upstream reference sources against the pinned release, computed
      once per run at invocation.
    - Route costing (backport-at-pin route A with sources A1 upstream GPU vLLM
      and A2 tpu-inference design-port; pin-upgrade route B as cost-justified
      fallback, run exclusively, gated on a regression matrix) and backlog ranking.
    - Campaign execution for both campaign types with a shared validation back-end
      against a GPU baseline, three user gates per campaign, and gate-3 closure
      with cross-run artifact updates.
    out:
    - Continuous upstream tracking after the per-run delta scan.
    - Fork sync with official plugin releases (manual, user-owned).
    - Merging PRs (human).
    - Hardware provisioning of any kind.
    - Changing kickoff-declared metrics, thresholds, or methods without an explicit
      user decision recorded in run state.
    - Any write outside the run's artifact tree, the campaign worktrees and branches, and
      the fork - the workflow's own package, the harness configuration, and memory
      included (user-owned; a workflow change takes the revision path).
  principles:
  - The pinned base, release-branch name, and SDK version are run inputs read
    at intake and frozen in state; graph text stays pin-generic.
  - The agent that measured a number never adjudicates it; comparator sets are
    pre-registered before measurement; verdicts read stable artifacts, never first-sighting
    signals.
  - Adversarial review is material-findings-only and follows every high-stakes
    artifact - route verdicts, campaign designs, each landed kernel-class increment
    (read beside its oracle and ratio records by a reviewer the doer answers
    directly, inside the realizing node), and the whole campaign changeset with its
    PR description before gate 3. Glue increments get no per-item review, because
    the costly, hard-to-reverse defect class is a kernel built to the wrong form or
    cost, and the whole-changeset read before the PR catches the rest. Measurement
    verdicts are issued once, by an adjudicator independent of the measurer, and
    read by the PR review before gate 3.
  - Cost before code, device from the first kernel - every hot op of a served phase
    at the declared shapes - every hot op on the design's execution map, whatever
    its substrate - an authored or vendored kernel, a torch or
    compiler-lowered op, a collective, data movement - carries a cost row before any
    kernel is written (bytes moved, instructions on the engine that binds, descriptor
    and serial-chain counts, the predicted time under the served utilization cap, and
    the roofline ratio that predicts), each value either measured - citing a row of
    the run's hardware calibration record whose lowering and access pattern match
    the op's, or a device anchor measured the same way - or derived with its
    arithmetic shown, because a cost estimated without a device-measured rate is the
    miss class that builds kernels only to close them. The roofline is the op's minimum
    work - the bytes it must move and the instructions it must issue - at the binding
    engine's calibrated rate under the served cap, never the chosen form's own work,
    because a form's floor excuses the form. The bar is a roofline ratio of 1.5
    unless the kickoff contract names another with its reason; an op over the bar
    carries a written hardware reason that cites the measured rows showing its
    binding engine at its floor under the served cap, or the design is re-derived,
    not built. A
    kernel-class increment is accepted on two values the world produces - it matches
    its fp64 oracle in the class it declared over the registered regimes, and its
    ratio measured kernel-alone on a device meets the bar or the written reason -
    never on a CPU-mode transcript alone, because the device's cost and numerics are
    the two questions a CPU run cannot answer. Glue increments keep CPU-mode
    acceptance, and once a candidate has served, work on that tip goes to an idle
    device over CPU emulation (the rule and its record at realize_increment). Before
    any serving attempt, the uncharged bring-up ladder at execute_attempt_loop,
    because a many-rank charged launch is the slowest way to find a defect a
    device-free or one-rank probe finds in minutes. No attempt caps - two-tier stop
    limit instead (fingerprint no-identical-retry; halt and re-derive at every 10
    budget-counted hardware attempts per target; what counts is the one rule at the
    hardware_attempt_counts state field).
  - Kernel-substrate rule - new kernel-class functionality not already provided
    by the Neuron NKI library is implemented in NKI, never as torch-level fallback
    (torch stays legitimate for orchestration and glue); substrate is a per-increment
    design declaration checked at the design gate and the whole-campaign review (split
    enforcement level - mechanical substrate-fidelity check for items declared kernel-class;
    reviewed level for the classification itself, since no mechanical scan can
    tell kernel-class torch from legitimate glue).
  - Cross-run artifacts (scorecard, backlog, debt list, fingerprints) have one
    serialized writer (lead) and never live on campaign branches.
  - All hardware work is in-band over SSH within the workflow; out-of-band handoff
    files are the named anti-pattern.
  - Success evidence decides on external signals (resolvable PR URLs, command
    transcripts, stable measurement artifacts), never doer self-report.
  - The lead writes run state, the user's decision record, and the records the
    workflow names it the writer of; it keeps no log of its own. An outcome row names
    a declared outcome and points at evidence; an event inside a node is the
    seat's record at its evidence path, never a row; a ruling a seat needs lives once,
    in the round record or outcome row of the node it decides. Every seat waits on the
    lead's word, so a lead minute is a wall-clock minute.
  roles:
    lead:
      purpose: Route outcomes, own run state, present gates, freeze the hardware
        roster at intake (the queue tool grants against it), own campaign scheduling
        (scheduling_holds_recorded states the rule), and serialize single-writer
        updates to the cross-run artifacts. Seat lifecycle - a doer seat retires only
        on the review outcome that passes its work (a stopped seat is unreachable, and
        a repair round needs the context that did the work); a reviewer gets one
        frozen stamp after every constraint has reached the producer, and any later
        change is the next revision, never a re-stamp; a record another seat is
        writing is read after its mtime settles, because a mid-write read judges half
        a record.
    user:
      purpose: Approval authority at the three campaign gates, criterion changes,
        GPU-baseline reboot confirmation, PR merge. A standing approval is the user's
        verbatim line with the scope it names; the lead never widens one by reading
        intent.
    investigator:
      purpose: Gap scan, route analysis, costing, and first-principles re-derivation;
        gathers and weighs evidence, never approves results.
    implementer:
      purpose: Design and build campaign candidates in isolated worktrees, run
        hardware attempts under lease, and write the PR description.
    measurer:
      purpose: Execute the hardware calibration suite and pre-registered measurement
        procedures against the GPU baseline, and write stable evidence artifacts;
        never adjudicates.
    adjudicator:
      purpose: Issue gate verdicts from stable, pre-registered evidence and name
        the consequence; never the agent that measured.
    adversarial_reviewer:
      purpose: Material-findings-only adversarial review of high-stakes artifacts;
        independent of the artifact's producer.
    delegate_dispatcher:
      purpose: Dispatch external delegate skills through guardrails - intercept
        forbidden cache-clear remedies, force the equivalence adapter's target
        stack, scope the benchmark skill away from self-provisioning.
  evidence:
    run_input_and_preflight_record:
      kind: observation
      produced_by: verify_run_preconditions
      subject: frozen run inputs - the requested targets, each with the served shapes
        (context lengths and concurrency levels) its criteria are stated at - and
        preflight command transcripts
      artifact: artifacts/run/intake-preflight/
    hardware_calibration_record:
      kind: observation
      produced_by:
      - calibrate_hardware
      - design_campaign
      - measure_candidate
      subject: measured cost rows for the pinned SDK per roster hardware class - the
        fixed suite's rows (calibrate_hardware names the classes), the anchors a
        design measures for a form that has no row, and the served utilization cap
        per engine that measure_candidate reads from each served profile at the
        declared shapes - each with its value, its source (suite, anchor or served
        profile), its reproduction command, the pin and host class it was measured on,
        and the run record of the job or served run
        that produced it; carried from a prior run only while the pin is identical
      artifact: artifacts/run/calibration/
    delta_report:
      kind: observation
      produced_by:
      - trace_target_delta
      - cost_routes_and_rank_backlog
      subject: per-target upstream delta against the pinned release, with source
        traces
      artifact: artifacts/run/delta/
    route_costing_and_backlog:
      kind: derivation
      produced_by: cost_routes_and_rank_backlog
      subject: per-target route costing and the ranked backlog
      artifact: artifacts/run/backlog/
    kickoff_contract_record:
      kind: derivation
      produced_by: assemble_kickoff_contracts
      subject: per-campaign kickoff contracts with per-campaign preflights
      artifact: artifacts/campaigns/<campaign>/kickoff/
    gate_approval_record:
      kind: judgment
      produced_by:
      - assemble_kickoff_contracts
      - review_campaign_design
      - close_campaign
      subject: verbatim user decisions at gates 1, 2, 3
      artifact: artifacts/campaigns/<campaign>/approvals/
    campaign_design_record:
      kind: derivation
      produced_by: design_campaign
      subject: execution map per served phase, increment plan with a cost row and a
        numerics plan per kernel-class increment, test layout, pre-registered
        comparator set, predicted file surface,
        venv and lease plan, and for upgrade-route campaigns the assembled regression
        matrix
      artifact: artifacts/campaigns/<campaign>/design/
    implementation_changeset:
      kind: observation
      produced_by: scope_next_increment
      subject: campaign branch diffs plus increment evidence - CPU-mode records for
        glue increments; oracle, ratio and review records for kernel-class ones
      artifact: artifacts/campaigns/<campaign>/increments/
    hardware_attempt_log:
      kind: observation
      produced_by:
      - prepare_host
      - execute_attempt_loop
      - realize_increment
      subject: one-file-per-event attempt, fingerprint, lease, and recovery records;
        a run record names its class (serving, diagnostic, cpu_mode) and, on a served
        tip, the queue tool's remaining-capacity reading at launch; its measurement
        outcome (served or failed, and what the request path returned) stands apart
        from hygiene findings on the host after it (a leftover process, an open device
        handle), which never set the outcome - a census that marks a measured run
        failed erases its evidence
      artifact: artifacts/campaigns/<campaign>/attempts/
    rederivation_record:
      kind: derivation
      produced_by: rederive_approach
      subject: first-principles re-derivation verdict and revised approach
      artifact: artifacts/campaigns/<campaign>/rederivations/
    measurement_artifacts:
      kind: observation
      produced_by: measure_candidate
      subject: correctness and performance measurements against the GPU baseline and
        the entitlement, with the served profile's per-op attribution at the declared
        shapes; each evidence bundle names the GPU-side vLLM version
        and the known cross-version behavior differences (baseline-skew control)
      artifact: artifacts/campaigns/<campaign>/measurements/
    adjudication_verdict:
      kind: judgment
      produced_by: adjudicate_results
      subject: gate verdicts against kickoff-declared thresholds
      artifact: artifacts/campaigns/<campaign>/verdicts/
    adversarial_review_findings:
      kind: judgment
      produced_by:
      - assemble_kickoff_contracts
      - review_campaign_design
      - realize_increment
      - review_pr_evidence
      subject: material findings - each with its defect class and the surfaces
        it names - bookkeeping findings marked as such, or the recorded absence
        of any material finding
      artifact: artifacts/reviews/
    pr_evidence_package:
      kind: derivation
      produced_by: prepare_pr
      subject: the PR description in the form the fork's maintainer reads - the
        section outline the layout reference fixes, in order - a short lead with the
        mechanism and the paired headline result; the mechanism and what it does not
        approximate; scope and activation (files touched, the conditions under which
        the change is active, what stays unchanged, what the results do not cover);
        the paired measurements - every performance number the candidate at its
        measured revision against its comparator at a named commit or version (the
        target base where it serves the configuration, the planner's entitlement and
        the GPU reference where it does not) over the declared context lengths and
        concurrency levels, with the protocol the registered procedure fixed (arms as
        commits, hardware and parallelism, pairing order, warm-ups, repeats) and the
        untargeted shapes stated as measured; the correctness and accuracy comparison
        as counts, with its non-claims (what the probes do not prove); how it was
        tested (the whole-tree test command with its counts, the acceptance
        measurement with its verdict); reproduction commands per arm; the authorship
        disclosure; and what stays open - each claim linked once to its record, every
        cell read from a registered bundle, never an index that links every claim
      artifact: artifacts/campaigns/<campaign>/pr/
    closure_record:
      kind: observation
      produced_by: close_campaign
      subject: exactly one executed closure (resolvable PR URL, no-benefit bundle
        with upstream-issue draft, or blocked record) plus the cross-run artifact
        updates
      artifact: artifacts/campaigns/<campaign>/closure/
    run_closure_verdict:
      kind: judgment
      produced_by: verify_run_closure
      subject: per-campaign closure verification against external evidence
      artifact: artifacts/run/closure/
    pin_feasibility_note:
      kind: derivation
      produced_by: design_campaign
      subject: feasibility-at-pin verdict with re-checkable absence evidence or
        the named viable design lever per round
      artifact: artifacts/campaigns/<campaign>/design/
    increment_plan_draft:
      kind: derivation
      produced_by: design_campaign
      subject: increment plan, test layout, venv and lease plan, and refined predicted
        file surface - feeds scheduling_holds re-derivation; on a block-scoped
        re-entry, the block diff (the touched blocks, nothing else)
      artifact: artifacts/campaigns/<campaign>/design/
    regression_matrix_draft:
      kind: derivation
      produced_by: design_campaign
      subject: adjudicable regression-matrix rows for upgrade-route campaigns
        - procedure reference and verbatim threshold per at-risk support-table
        cell
      artifact: artifacts/campaigns/<campaign>/design/
    acceptance_preregistration:
      kind: derivation
      produced_by: design_campaign
      subject: frozen comparator set and route-scoped acceptance criteria, adjudicable
        as written, ahead of all measurement
      artifact: artifacts/campaigns/<campaign>/design/
    increment_lap_record:
      kind: observation
      produced_by: scope_next_increment
      subject: round record, written when a seat ran, a gap or stuck item is named, or
        the changeset is assembled - the selected work item or set with its
        implementation order, declared CPU-mode acceptance per item, findings
        answered, stuck and
        gap identities, the plan's
        revision-log line after landed-block collapse, and any join conflict of a concurrent-eligible
        set recorded as a scheduling defect
      artifact: artifacts/campaigns/<campaign>/increments/
    increment_evidence_records:
      kind: observation
      produced_by: realize_increment
      subject: per-increment passing evidence - the CPU-mode transcript for a glue
        increment; for a kernel-class increment the oracle record over the registered
        regimes, the kernel-alone ratio record read against its cost row, and the
        kernel review's findings record - or persisted investigation records on stuck
        rounds
      artifact: artifacts/campaigns/<campaign>/increments/
    measurement_procedure_record:
      kind: observation
      produced_by: measure_candidate
      subject: runnable smoke-verified procedure per declared measurement with
        fixed invocation and versioned revision entries
      artifact: artifacts/campaigns/<campaign>/measurements/procedures/
    baseline_reference_capture:
      kind: observation
      produced_by: measure_candidate
      subject: GPU-baseline reference outputs with the baseline-skew record, or
        the justified skip for routes declaring no baseline comparator
      artifact: artifacts/campaigns/<campaign>/measurements/baseline/
    candidate_measurement_runs:
      kind: observation
      produced_by: measure_candidate
      subject: raw measurement outputs one file per event, each stamped with the
        measured git-issued revision, invocation, and environment; defect findings
        as their own event files
      artifact: artifacts/campaigns/<campaign>/measurements/runs/
  checks:
    kickoff_contract_approved:
      style: reviewed
      question: Does every campaign entering execution carry a complete kickoff
        contract (targets, routes, sources, thresholds - the correctness gate stated
        as a served-output comparison against the reference (for a model port a
        ladder read in order, because a failed rung localizes the defect before the
        next rung's cost is paid - coherent served generation on the reference's
        prompt set, where token identity with the reference is never a rung, because
        two stacks round differently and a correct port can break greedy parity; a
        declared benchmark subset matching the reference within its bound; then the
        full declared benchmarks matching the reference within theirs, each
        benchmark bound stating how a score inside the reference's own noise reads (a
        repeat count, an interval, or the user's word at adjudication), set by the
        user here, because a bound with no noise form fails a correct port on a
        run-to-run spread; the feature's observable output for a feature port) with
        its pass rule,
        every intermediate-tensor tolerance registered as a diagnostic that selects no
        outcome, because two hardware stacks never agree bit for bit and a tensor gate
        measures the stack, not the port; the performance gate stated for every served
        phase of the configuration (first-token latency for prefill, inter-token
        latency for decode) at the declared shapes - for the phase the campaign
        targets, as a ratio to the entitlement the parallelism planner recorded at
        costing, with the roofline bar the cost-before-code principle sets or a
        written hardware reason, because a gate stated against the GPU baseline alone
        accepts a port that leaves most of the device's floor unused; for every other
        phase, as no regression against the target base within a stated bound, held
        by compiled-program digest equality when the base's programs at that
        configuration are on disk and unchanged, measured otherwise, because a change
        in one phase reaches the others through shared graphs and carried state -
        methods, models, hosts,
        test layout, spend notes, delegate/venv/weights/ GPU-baseline preflights,
        pinned-release-branch-present-on-fork and SDK-uniformity preflight, prior-run
        carry-over decisions, and for upgrade-route campaigns the upgrade base
        recorded to campaign_target_pins plus the regression-matrix criteria)
        approved verbatim by the user at gate 1?
      evaluated_by: user
      on_failure_route: assemble_kickoff_contracts
    scheduling_holds_recorded:
      style: mechanical
      question: With two or more approved campaigns, does every one carry a predicted
        file surface in scheduling_holds, with serialization holds derived before
        instances dispatch - overlapping surfaces serialize, and an upgrade-route
        campaign holds all others for exclusive execution? With one approved campaign
        the field is empty and the check passes. The defect this catches is two
        campaigns writing one file surface at once.
      evaluated_by: lead
      on_failure_route: assemble_kickoff_contracts
    design_approved_by_user:
      style: reviewed
      question: Does the user approve this campaign design at gate 2 - a recorded
        approval stands across re-entries while the acceptance registration is
        byte-unchanged, the kickoff-declared criteria and the user decisions recorded
        at this gate are intact, and no material finding stands, and the gate is re-presented
        only when one of those moves - and does any change to kickoff-declared
        criteria carry an explicit recorded user decision? A criterion or registered
        value the user changed in their own recorded words is approved by that
        decision - the gate is not re-presented for it, only for a material finding
        on the new registration.
      evaluated_by: user
      on_failure_route: design_campaign
    narrow_delta_scoped:
      style: mechanical
      question: Does every standing material finding in this review round (bookkeeping
        findings never enter this classification - the lead applies them as direct
        edits, per review_campaign_design) name only increment-plan
        text, design-record, or registration surfaces, with the kickoff-declared
        criteria unchanged (value-level read against the kickoff record) and the pin
        and feasibility facts untouched since this design entry - and does no standing
        material finding repeat a prior narrow round's finding fingerprint
        (same node, surface, and claim) without a gap-closing artifact produced
        since that round? Recurrence fails this check - the full round owns it, where
        the design node's design_blocked outcome bounds repetition. The narrow
        repair brief names the surfaces the findings name - a registered-value
        touch gets the value-level read, never hash-only verification.
        Ambiguity fails this check (fail closed into the full design round).
      evaluated_by: lead
      on_failure_route: design_campaign
    design_loop_within_bound:
      style: mechanical
      question: Counting this campaign's gate-2 review rounds from the findings
        records since the later of the last verbatim user decision at this gate and
        the last entry into the design phase from outside it (the gate-1 fan-out, a
        rederivation, or an implementation-side defect route) - are there fewer than
        four rounds without design_sound? The defect this catches is a review loop
        that keeps finding wording after the material findings are gone. Evaluated
        first on every repair edge out of the gate. Failure is the designed stop of
        the design repair loop - this node re-enters for the user's disposition, the
        lead presents the standing findings to the user with a close-anyway
        recommendation, and the user's verbatim decision selects the outcome -
        design_sound with the findings disposed (deferred as carried items to a named
        later design touch, or accepted as repaired without a further review round),
        or one more repair round under a fresh count. A finding that would move a
        frozen or registered value is never disposed this way (P9).
      evaluated_by: lead
      on_failure_route: review_campaign_design
    comparators_preregistered:
      style: mechanical
      question: Is the comparator set for this campaign recorded and frozen in
        run state with a timestamp preceding every measurement artifact adjudicated
        against it?
      evaluated_by: lead
      on_failure_route: design_campaign
    acceptance_threshold_evaluated:
      style: mechanical
      question: Does every evidence bundle under verdict record, for every criterion
        the acceptance registration records for that measurement, a pre-registered
        threshold actually evaluated - the value read, the threshold it was compared
        against, and the result of that comparison - together with the negative-control
        result from the procedure's smoke record - or, for a measurement a stopped
        correctness ladder never ran, the record "not run after rung n failed" naming
        the failed rung, which is the evaluated form for every later rung and every
        performance procedure behind the ladder?
      evaluated_by: lead
      on_failure_route: measure_candidate
      rationale: An exit status is not an evaluation - a comparator exits zero with an
        empty evaluated-threshold list when the criterion it needed was never
        recorded, so the count runs against the criteria the registration names, never
        the producer's list. The lead reads the bundle's own record and the smoke
        negative control - no seat, no new measurement.
    measurer_not_adjudicator:
      style: mechanical
      question: Is the adjudicating agent identity distinct from every agent that
        produced the measurement artifacts under verdict - the producer set covering
        any agent that acted at any step of the measurement node?
      evaluated_by: lead
      on_failure_route: measure_candidate
    impl_commit_is_reviewed:
      style: mechanical
      question: Does the campaign branch tip the closure will push equal the tip
        commit the whole-campaign review's findings record names, and does the
        measured revision every adjudicated bundle stamps equal that tip or differ
        from it only by commits whose file sets are tests, controls, launchers,
        checkers, or bundles and no product source - each named with its file set in
        the attempt log? The defect this catches is unreviewed or unmeasured product
        source reaching the PR; a failure re-enters the implementation loop, whose
        exit re-serves, re-measures and re-reviews the tip.
      evaluated_by: lead
      on_failure_route: scope_next_increment
    preflight_record_complete:
      style: mechanical
      question: Does the preflight record carry a passing, transcript-backed entry
        for every declared run precondition, with the frozen run inputs written
        to run state?
      evaluated_by: lead
      on_failure_route: verify_run_preconditions
    pin_infeasibility_socratic_guard:
      style: socratic
      question: Does the note name the missing surface with a verbatim re-checkable
        command at the pinned revision, does re-execution reproduce the absence,
        and does the note tie the surface to a kickoff-declared capability?
      evaluated_by: lead
      on_failure_route: design_campaign
      rationale: Evaluator is never the note author. Bound, declared where the graph
        sees it - a note that still cannot produce re-executable absence evidence on
        its return is design_blocked's evidence; the ambiguity rule is the terminator,
        no counter needed.
    procedures_smoke_verified:
      style: mechanical
      question: Does every declared measurement for this campaign's route have
        a runnable procedure with a passing smoke record and a fixed invocation,
        recorded before any measured run that cites that procedure revision -
        and does the same smoke record show the procedure FAILING on its registered
        known-bad input, the negative control that proves this check tool can fail
        at all?
      evaluated_by: lead
      on_failure_route: measure_candidate
    revision_stamped:
      style: mechanical
      question: Does every run record carry a git-issued revision identifier read
        from the checked-out commit at measurement time - never a branch name
        - and do all records for one measurement agree?
      evaluated_by: lead
      on_failure_route: measure_candidate
    changeset_complete:
      style: mechanical
      question: Does the changeset artifact the plan_satisfied round assembled hold
        the git-produced branch diff against the target base recorded in
        campaign_target_pins, an evidence index in which every planned and repair
        increment resolves to its passing record - the CPU-mode record for a glue
        increment; for a kernel-class increment the oracle record, the kernel-alone
        ratio record within the bar or the design's written reason, and the kernel
        review record with no standing material finding - an NxDI-import scan
        transcript over the diff with zero hits, a substrate-fidelity transcript
        in which every design-declared-NKI increment shows NKI usage, the run
        record of the declared test paths collected and run whole-tree on the tip -
        zero collection errors and zero new failures against the target base, a
        quarantined item carrying its import proof - and a process-vocabulary scan
        transcript over the diff's added lines and added paths with zero hits (the
        run's minted identifiers - increment and block ids, decision and ruling
        references, round and attempt numbers - and this workflow's process nouns -
        plan block, ruling, lease, grant, seat, campaign; the word list is kept
        with the scan tool, as the import pattern is; code that records how the work
        was scheduled costs a second PR to strip it) - each recomputable by a reviewer
        from the branch and the records? A gap fails
        the check as a coverage-gap item recorded in the round record with its
        class - (a) an increment lacks a passing record, (b) the diff holds work no
        increment record covers, (c) an import-scan hit, (d) a substrate-fidelity hit,
        (e) a collection error or a new failure in the declared test paths, (f) a
        process-vocabulary hit - whose
        declared acceptance is the recomputed check that found it.
      evaluated_by: lead
      on_failure_route: scope_next_increment
  nodes:
    verify_run_preconditions:
      intent: execute
      purpose: Read the invocation inputs (pinned release descriptor, target request,
        instance roster), freeze them in run state, and verify every run precondition
        before any other work - pinned release branch present on the fork, delegate
        skills available (namespaced addressing resolved; the adjacent vendor
        autoport skill is classified at intake - competing tool per the system
        map, never a prerequisite, so its absence is never inputs_missing), the
        runner-default boundary one release above the pin recorded as advisory
        context for the delta scan's entanglement check, SDK and compiler uniformity
        across named hosts, the GPU baseline identity recorded as a declared input
        (its reachability is probed at reference capture, whose baseline_unusable
        outcome owns that failure - an unreachable baseline at intake is never
        inputs_missing), per-target weight artifacts
        present, venv replication precondition (Neuron private-index or DLAMI-preinstalled
        dependency check), cross-run artifacts loaded with every scorecard row
        AND every debt-ledger entry re-verified against the frozen pin (no row
        or entry carries forward as decided across a pin change - delta scan covers
        requested targets only, so unrequested targets go stale here or nowhere),
        prior-run carry-over decisions surfaced to the user. Out of scope - any
        fork sync (manual, user-owned) and any provisioning.
      roles:
      - lead
      - investigator
      produces:
      - run_input_and_preflight_record
      allowed_effects:
      - Read-only SSH probes to the named instances.
      - Read-only gh and git queries against fork and upstream sources.
      forbidden_effects:
      - Any write to the fork, the hosts, or the cross-run artifacts.
      outcomes:
        preconditions_met:
          meaning: Every precondition verified with a recorded command transcript;
            run inputs frozen in state.
          required_evidence:
          - run_input_and_preflight_record
        inputs_missing:
          meaning: A user-owned input is absent (for example the pinned release
            branch is not on the fork); the remedy is user-owned - the run never
            substitutes one - and resumable state is preserved.
    calibrate_hardware:
      intent: execute
      purpose: Put one hardware calibration record under the run before any route is
        costed - for every roster hardware class a requested target's configuration
        uses, the fixed suite's rows measured on the pinned SDK, each row with its
        value, reproduction command and pin. The suite covers the cost classes a
        design's rows cite - instruction floor per engine, DMA descriptor and
        transpose cost, gather and scatter cost per element for each access pattern,
        compare rate per engine, the throttle ramp and the utilization cap under a
        sustained synthetic kernel_alone load, collective cost at the served rank
        count; the row list is kept with the suite in the release layer, as the scan
        word list is, and grows from the hazard items campaigns close with. The served
        utilization cap is a second row of the cap class that measure_candidate appends
        from each served profile, because a port has no served path at calibration;
        every row names its source (suite, anchor, served profile), and a design cites
        the served cap row when one exists and the suite's synthetic-load row until
        then. Why
        first - a cost row that cites no measured rate is a guess. Check tool - when a
        record for the identical
        pin and hardware class already exists (this run's, or a prior run's at the
        layout reference's path), the lead verifies the pin equality and records
        calibration_recorded with no seat and no device; otherwise the measurer runs
        the suite under a kernel_alone job lease on one roster host of the class, with
        no campaign lease, because the record belongs to the run. Out of scope -
        costing anything, any candidate code, any serving launch.
      roles:
      - measurer
      consumes:
      - run_input_and_preflight_record
      produces:
      - hardware_calibration_record
      allowed_effects:
      - kernel_alone device runs on roster hosts under a job lease through the
        hardware queue tool; writes under the run's calibration artifact directory.
      forbidden_effects:
      - Any write to the fork, a campaign branch, or a host beyond the job lease.
      - Any serving launch.
      outcomes:
        calibration_recorded:
          meaning: Every roster hardware class a requested target uses has a record
            on the frozen pin with every suite row present - measured in this run, or
            carried with its pin verified equal - decided by the record's rows and
            their run records, never by the measurer's claim.
          required_evidence:
          - hardware_calibration_record
        calibration_unproducible:
          meaning: A hardware class a requested target uses has no record and the
            suite cannot be measured on any host of the class - unreachable, faulted, or the suite
            fails on the pin - with the evidence recorded; the run pauses, because
            hardware and SDK remedies are user-owned.
    cost_routes_and_rank_backlog:
      intent: plan
      purpose: Two steps in one seat. First, decide the delta scan across the whole
        target set - verify every requested target has a per-target report, check
        each report against the fixed costing-sufficiency rubric (satisfied by honest
        residual-gap recording, never by gap absence), drive at most one bounded
        re-trace per deficient target, and write the run-level delta index. Then,
        for each requested target, run the parallelism planner on the target's
        configuration at the served shapes the run input declares for it (frozen into
        the kickoff later) and record its entitlement (first-token and inter-token
        latency and memory per device - the floor every performance criterion is
        stated against); cost route A backport at the pin (choosing between sources
        A1 and A2) against route B pin upgrade (fallback, justified on cost,
        exclusive-execution, regression-matrix gated) - per route the hot ops of its
        served phases from the trace's op inventory, whatever their substrate, and
        the roofline ratio the sum of their cost rows predicts
        against the entitlement, citing calibration rows where they exist and naming
        the ops that need an anchor at design - predict the touched-file surface for
        conflict-aware scheduling, and rank the backlog. The seat that
        judges a report is never the seat of any trace_target_delta instance whose
        report it judges - the lead enforces the seat split at dispatch. With one
        requested target the coverage, rubric and index steps are the lead's own and
        the seat costs the routes only. Out of scope - producing any trace content
        itself, and starting any campaign.
      roles:
      - investigator
      consumes:
      - delta_report
      - run_input_and_preflight_record
      - hardware_calibration_record
      - adversarial_review_findings
      produces:
      - delta_report
      - route_costing_and_backlog
      activities:
      - Mechanical coverage check - diff the frozen requested-target list against
        the per-target report files on disk; persist the diff output.
      - Rubric check per report against the fixed section list frozen in trace_target_delta's
        success outcome; persist a per-target verdict. A report whose deficiency
        is recorded as a residual gap after its re-trace bound is exhausted passes
        the rubric.
      - On a deficient report, route the named target back for one re-trace; after
        that single bound, record the deficiency as a residual gap in the index and
        treat the report as sufficient.
      - Write the run-level delta index binding per-target reports, verdicts, and
        residual gaps into one costing-consumable artifact.
      - Run the planner per target; cost each target's routes with their predicted
        ratios, predict its file surface, rank the backlog.
      - Emit exactly one outcome under the declared precedence - costing_stalled
        wins when a named gap already survived one re-trace or review findings repeat
        with no new evidence; reports_insufficient wins while any deficient target's
        re-trace bound is unexhausted; sources_unreachable wins once no re-trace
        remains and any target is blocked on a source; backlog_ranked otherwise.
      allowed_effects:
      - Writes of the run-level index, the sufficiency record, and the costing
        report under the run's delta and backlog artifact directories.
      forbidden_effects:
      - Editing any per-target report body.
      outcomes:
        backlog_ranked:
          meaning: Every requested target's report is present and rubric-sufficient,
            the run-level index is written, and every target carries its planner
            entitlement, a costed route verdict with each route's predicted roofline
            ratio, a predicted touched-file surface, and a backlog rank with recorded
            rationale.
          required_evidence:
          - delta_report
          - route_costing_and_backlog
        reports_insufficient:
          meaning: Named targets' reports fail the rubric, or costing exposed a
            named gap the scan must close, and their re-trace bound is not exhausted;
            only those targets re-trace.
        sources_unreachable:
          meaning: One or more targets are blocked on an unavailable reference
            source and no re-trace remains outstanding; traced targets keep their
            reports and per-target resumable state is preserved.
        costing_stalled:
          meaning: Repeated identical review findings with no new evidence, or
            the same named residual gap persisting after its one re-trace; the run
            pauses for user direction before any gate-1 election. Takes precedence
            over reports_insufficient - re-tracing a gap that already survived a
            re-trace without user direction is the loop this stop exists to break.
    assemble_kickoff_contracts:
      intent: execute
      purpose: Two steps, review then contracts. Review - before gate 1 is presented,
        an adversarial, material-findings-only review of the gap-scan and
        route-analysis verdicts by a reviewer seat independent of the costing seat
        and retained across the re-costing rounds, read against the delta report,
        the costing and backlog record, and the
        intake preflight record; a material finding is this node's material_findings
        outcome and the backlog re-costs before any election, because a user
        electing from a defective ranking is the costly direction. With one
        requested target there is no ranking to review - the lead records the
        review as satisfied with no seat, the outcome row citing the costing record
        itself, and the user's election at gate 1 is the review. Contracts - for
        each target the user elects from the reviewed backlog, assemble the complete
        kickoff contract - target, route, source, thresholds (in the served-output
        and entitlement-ratio forms kickoff_contract_approved asks for), methods,
        models, hosts, test layout, spend notes, all per-campaign preflights,
        prior-run carry-over decisions, and for upgrade-route campaigns the upgrade
        base (feeding campaign_target_pins) and the regression-matrix criteria
        - present gate 1, and record the approved campaign set in run state. The
        run refuses to start any campaign whose kickoff contract is incomplete.
      roles:
      - lead
      - user
      - adversarial_reviewer
      consumes:
      - delta_report
      - route_costing_and_backlog
      - run_input_and_preflight_record
      produces:
      - adversarial_review_findings
      - kickoff_contract_record
      - gate_approval_record
      outcomes:
        material_findings:
          meaning: Named material defects in the route verdicts require re-costing;
            decided before gate 1 is presented, so the user never elects from a
            ranking a standing finding contradicts.
        contracts_ready:
          meaning: At least one campaign has a complete kickoff contract and a
            verbatim gate-1 approval record, the gate presented after the review
            record stood - the reviewer's findings record with two or more requested
            targets, the outcome row citing the costing record with one.
          required_evidence:
          - kickoff_contract_record
          - gate_approval_record
        no_campaign_approved:
          meaning: The user approves no campaign; the run closes without execution.
    review_campaign_design:
      intent: review
      instance_per: approved_campaigns
      purpose: Adversarial, material-findings-only review of the campaign design,
        then present gate 2 with the reviewed design and record the verbatim user
        decision - or, on a re-entry where design_approved_by_user says the recorded
        approval stands, apply the standing approval and record that basis instead
        of re-asking. Material means exactly two things - the nodes that consume the
        design (scope_next_increment, realize_increment) would build the wrong
        thing from the design as written, or a frozen or registered value would
        move (P9); nothing else is material. The kernel-substrate declarations
        are reviewed under that definition - a kernel-class increment planned as
        torch-level fallback where the run's kernel-substrate rule requires NKI
        builds the wrong thing, and so does the classification itself when wrong
        (an increment recorded non-kernel-class whose planned work is kernel-class
        functionality). So are the execution map, cost table and numerics plans (the
        cost-before-code principle) - a served phase with no map; a hot op on the map
        with no row, whatever its substrate; at a shortfall re-entry, a component the
        served profile attributed above the tolerance with no map row (a map gap, the
        row the re-entry must add);
        a row that cites no calibration or anchor row for a rate it uses, or cites a
        row whose lowering or access pattern is not the op's; a predicted ratio over
        the bar whose written reason cites no measured row showing the binding engine
        at its floor; derived values with no arithmetic; a row naming no hazard where
        the recorded hazard list holds one for its form; a kernel-class increment
        whose numerics plan omits a registered regime class, the
        dtype-per-stage table or the NaN containment note, or uses a refused form -
        each builds or keeps a kernel the device will contradict; and so is a design
        whose predicted sum misses the campaign's performance gate with no reason the
        user can weigh. Every other finding - cite hygiene, counts and scans,
        wording, stale paths, record-only items, anything the consumer re-derives
        from persisted inputs - is bookkeeping. The reviewer records bookkeeping
        in the same findings record, marked as such with the surface it names;
        bookkeeping never selects an outcome. The lead applies each bookkeeping
        finding as a direct edit to the plan or the record (one revision-log line
        in the edited document, the edit and its revision-log line in run state) - no
        seat and no round, whichever outcome the material findings select; lead
        edits land before any repair seat is briefed, and the brief names the
        post-edit revision-log line. For each material finding the reviewer labels the
        defect class and names the surfaces it touches, so the lead's classification
        (narrow_delta_scoped) stays mechanical. Re-entry check tool - the reviewer
        seat reads the whole design on the first review
        of a design entry and on every full-round re-entry; at the bound re-entry
        no reviewer seat is dispatched. After a block-scoped
        repair it reads the touched blocks the block diff names, their cascade
        (blocks that cite or depend on them), and one scripted whole-plan scan;
        the lead reads the diff to confirm no unnamed block moved before briefing
        the seat and records that check in run state. A diff that
        touches blocks the brief did not name, or a whole-plan round, gets the whole
        read. The challenger is retained across the rounds of one design entry - a
        fresh seat opens with each new whole-plan design entry, never per round (spec
        section 9.4); for a block-scoped re-entry naming kernel-class ops (a served
        shortfall, a contradicted row) the challenger is the retained kernel reviewer
        that read the op's kernel (any retained kernel reviewer when none did),
        because a fresh seat per lever would pay a seat and the lead's relay each
        time.
      roles:
      - adversarial_reviewer
      - lead
      - user
      consumes:
      - campaign_design_record
      produces:
      - adversarial_review_findings
      - gate_approval_record
      outcomes:
        design_sound:
          meaning: No material finding stands - bookkeeping findings, if any, are
            already applied as lead edits (purpose) - and the user's gate-2 approval
            is recorded verbatim or stands per design_approved_by_user. At the
            loop bound the user's verbatim disposition of the remaining findings
            (deferred as carried items to a named later design touch, or accepted
            as repaired without a further review round) makes them non-standing;
            a finding that would move a frozen or registered value is never disposed
            this way (P9).
          required_evidence:
          - adversarial_review_findings
          - gate_approval_record
        material_findings:
          meaning: Material findings stand and the repair needs the full design
            round - a finding names the pin, an absent capability, or a
            kickoff-declared criterion, repeats a prior round's fingerprint, or
            the narrow classification is ambiguous (fail closed).
        narrow_findings:
          meaning: Material findings stand, and every one of them names only increment-plan
            text, design-record, or registration surfaces - pin, feasibility and
            kickoff-declared criteria untouched. The lead (never the reviewer or the
            drafter) classifies
            via narrow_delta_scoped and takes the narrow edge; the repair
            is block-scoped at the design node (a brief naming the blocks, a
            block diff handed back), and the repaired design re-enters this same
            gate under the standing approval.
    rederive_approach:
      intent: plan
      instance_per: approved_campaigns
      purpose: First-principles re-derivation after the stop limit trips, a measurement
        path dead-ends, a repair loop reports no progress, or the user declines
        a close-out - re-read the accumulated evidence and produce exactly one
        of - a revised design, a route-change proposal (a kickoff-criteria change
        requiring an explicit user decision at the next gate), or a close-out
        recommendation.
      roles:
      - investigator
      - lead
      consumes:
      - hardware_attempt_log
      - adjudication_verdict
      - campaign_design_record
      - adversarial_review_findings
      - measurement_artifacts
      - gate_approval_record
      - kickoff_contract_record
      - route_costing_and_backlog
      - rederivation_record
      produces:
      - rederivation_record
      outcomes:
        revised_approach:
          meaning: A materially different approach is recorded and re-enters design
            and its gates.
          required_evidence:
          - rederivation_record
        close_out_recommended:
          meaning: The evidence supports closing this campaign; routed to gate
            3.
          required_evidence:
          - rederivation_record
    adjudicate_results:
      intent: review
      instance_per: approved_campaigns
      purpose: Issue this campaign's acceptance verdicts by reading the stable
        measurement artifacts against the kickoff-declared thresholds - the correctness
        and performance gates for backport-route campaigns; for upgrade-route
        campaigns the kickoff-declared regression matrix instead - and name exactly
        one consequence. A failed performance gate names which of its two routes holds
        by one rule - the served profile's per-op attribution (the diagnostic the design
        registered) is read against the design record's predicted rows as the
        measurer re-rated them into the bundle under the served utilization cap row
        - a mechanical step, each predicted time scaled by the ratio of the cap row
        it was priced under to the served cap row - so the adjudicator reads
        evaluated records only; any
        attributed component measured over its prediction beyond the registered
        tolerance, and any component or time class the profile attributes that no row
        predicts (glue, a collective, unattributed time, rank skew) above that
        tolerance, is a cost-model miss the design must re-derive
        (performance_shortfall); a sum that misses with every attributed component
        inside a row that predicted it was predicted as designed, and closes
        (no_benefit). The adjudicating agent never produced any artifact under
        verdict, and reads only the evaluated-threshold records the bundles carry,
        never a first-sighting signal. No second review of the verdict follows - the
        PR review reads the verdict before gate 3. A verdict's prose is corrected only
        by an erratum the adjudicator appends to the verdict record, naming the line
        and the evidence; a value or the consequence never moves by erratum.
      roles:
      - adjudicator
      consumes:
      - measurement_artifacts
      - campaign_design_record
      - kickoff_contract_record
      produces:
      - adjudication_verdict
      outcomes:
        gates_passed:
          meaning: The campaign's route-scoped acceptance passed - for backport-route
            campaigns the kickoff-declared correctness and performance gates; for
            upgrade-route campaigns the kickoff-declared regression matrix - with
            the evidence trail recorded.
          required_evidence:
          - adjudication_verdict
        correctness_shortfall:
          meaning: Backport-route campaigns only - the correctness gate failed, the
            verdict naming the first failed rung of a model port's ladder;
            implementation resumes. Upgrade-route failures route through
            regression_failed instead.
          required_evidence:
          - adjudication_verdict
        performance_shortfall:
          meaning: Backport-route campaigns only - correct port, performance gate
            failed, and at least one attributed component measured over its predicted
            cost beyond the registered tolerance, or above the tolerance with no row
            predicting it, each named with its measured and predicted values; the
            design re-enters block-scoped for those components' cost rows. A second
            shortfall on a component whose row was already re-derived once with no
            new calibration or anchor row is design_blocked at design, not a third
            row.
          required_evidence:
          - adjudication_verdict
        no_benefit:
          meaning: Backport-route campaigns only - correct port, performance gate
            failed with every attributed component inside a row that predicted it and
            nothing unrowed above the tolerance, so the design was right and the sum
            still misses the criterion the user approved (an accepted predicted value
            included); routed to no-benefit close-out. Unreachable for upgrade-route
            campaigns, whose failure outcome is regression_failed.
          required_evidence:
          - adjudication_verdict
        regression_failed:
          meaning: An upgrade-route campaign's regression matrix failed, or a
            backport-route campaign regressed a served phase it did not target beyond
            the kickoff's stated bound - a changeset defect, not a cost-model result,
            so it outranks performance_shortfall and no_benefit when results co-hold;
            implementation resumes on the regressed surfaces.
          required_evidence:
          - adjudication_verdict
        evidence_unstable:
          meaning: An artifact under verdict is incomplete - a bundle part or its
            evaluated-threshold record is missing - so measurement re-collects it.
    prepare_pr:
      intent: execute
      instance_per: approved_campaigns
      purpose: Write one document - the PR description, contribution-checklist
        complete, in the section form pr_evidence_package declares (the form the
        fork's maintainer reads, one section per question a maintainer asks) - for
        the campaign branch's clean diff against the target base recorded in
        campaign_target_pins (the pinned release branch for backport-route campaigns;
        the kickoff-declared upgrade base for upgrade-route campaigns). Every number
        is read from a registered measurement's bundle and paired with its comparator
        at a named commit or version, never a run made for the description; every
        limit of the records is written where the claim stops (a shape not measured,
        a count that is not a benchmark, a comparison that is not bit-equality),
        because a reader who finds one unstated limit distrusts the stated results.
        No evidence index and no separate evidence package - the records are the
        evidence and the description says what they show; an index that links every
        claim is the run's record rewritten for a reader who did not ask for it. Out
        of scope - opening the PR (a gate-3 closure action).
      roles:
      - implementer
      consumes:
      - implementation_changeset
      - measurement_artifacts
      - adjudication_verdict
      - adversarial_review_findings
      produces:
      - pr_evidence_package
      outcomes:
        pr_package_ready:
          meaning: The description is complete in the declared form and its test,
            acceptance and performance claims link to their records.
          required_evidence:
          - pr_evidence_package
        evidence_gap_found:
          meaning: A claim lacks its evidence; measurement must fill the gap.
        no_progress:
          meaning: Repeated identical review findings on the description with no new
            evidence; routed to first-principles re-derivation.
    review_pr_evidence:
      intent: review
      instance_per: approved_campaigns
      purpose: The one whole-campaign review - adversarial, material-findings-only -
        of the campaign branch's clean diff against the target base together with the
        PR description and the records it links, before anything is pushed for
        closure. On the code, material means - an increment's code does not do what
        its plan block declares; its acceptance is hollow (it would pass on wrong
        code); a claim of no behavior change is decided by an AST or token diff of the
        touched functions, never by reading; a frozen or registered value moved (P9);
        a kernel-class item rides a torch substitute, or a non-kernel declaration
        hides kernel-class substance (the kernel-substrate rule); an NxDI import on
        added lines (P4); an integration defect across landed increments; or process
        residue in shipped source or tests - a plan block, ruling, campaign identifier
        or process word on an added line or path, a test filed by the increment or
        round that wrote it instead of the product module it tests, a test that
        asserts the run's own state (the repository's history, a log line, a cache
        counter) instead of product behavior, or a test that pins a digest of a file
        this repository authors (a copy of external bytes keeps its digest) - material
        because the fork's maintainer has to strip it, and the strip is a second PR.
        On the description, material means a missing section of the declared form, a
        test or acceptance claim with no record behind it, a number with no paired
        comparator at a named commit or version, a claim that reaches past what its
        record measured with no limit stated beside it, or a verdict other than the
        one the adjudicator recorded. Every material finding carries the fingerprint triple (increment id
        + surface + defect class) the no-progress detector keys on; the
        artifact-layout impl/review pair entry is the shape authority. Narrow findings
        (cite hygiene, wording, evidence formatting in the records) are recorded in
        the same file and route nowhere. One reviewer seat per campaign, independent
        of every realizer, read-only on the worktree and branch, no host execution.
        Out of scope - any code change, any edit to the plan or the design record.
      roles:
      - adversarial_reviewer
      consumes:
      - implementation_changeset
      - pr_evidence_package
      - adjudication_verdict
      produces:
      - adversarial_review_findings
      forbidden_effects:
      - Any write to the campaign worktree source tree or any branch.
      - Any write to the increment plan, the design record, or run state.
      - Host execution of any kind.
      outcomes:
        pr_ready:
          meaning: No material finding stands over the changeset or the description;
            the findings record names the branch tip reviewed, and the campaign may
            close through gate 3.
          required_evidence:
          - adversarial_review_findings
        material_findings:
          meaning: Named material defects in the description only; prepare_pr repairs
            it.
          required_evidence:
          - adversarial_review_findings
        code_findings:
          meaning: Named material defects in the code, each with its fingerprint
            triple; scoping mints the repair items that answer them, and the repaired
            tip serves and measures again before it returns here.
          required_evidence:
          - adversarial_review_findings
    close_campaign:
      intent: execute
      instance_per: approved_campaigns
      purpose: Present gate 3 with the closure candidate and its evidence, record
        the verbatim user decision, execute exactly one approved closure - push
        the branch and open the PR on the fork, record the no-benefit bundle with
        its upstream-issue draft, or record the blocked terminal - then apply
        the serialized single-writer updates to the scorecard, backlog, debt list,
        and fingerprint file - the debt list taking, as release items, every hazard
        the campaign measured - a rate that needed an anchor (a calibration row to
        add), a regime that caught a defect (an oracle regime to keep), a form the
        device contradicted (a form to refuse), a per-op cost miss (a cost class to
        re-rate) - so the next run's suite, oracle and hazard lists start where this
        one ended. Out of scope - merging the PR (human) and any write
        to a campaign branch during artifact updates.
      roles:
      - lead
      - user
      - implementer
      consumes:
      - pr_evidence_package
      - adjudication_verdict
      - rederivation_record
      - hardware_attempt_log
      - campaign_design_record
      produces:
      - closure_record
      - gate_approval_record
      allowed_effects:
      - Branch push and PR open on the fork only.
      - Serialized writes to the cross-run artifacts in the workflow repo.
      forbidden_effects:
      - Mutating protected base branches on fork or upstream.
      - More than one closure type per campaign.
      outcomes:
        closure_recorded:
          meaning: Exactly one closure executed with its external evidence and the
            cross-run artifacts updated.
          required_evidence:
          - closure_record
          - gate_approval_record
        closure_declined:
          meaning: The user declines the closure at gate 3 and directs further
            work; routed to re-derivation.
    verify_run_closure:
      intent: review
      purpose: Decide the run outcome from world-issued evidence only. The lead
        runs this node with no seat. For each gate-1-approved campaign, read its
        close-out approval record and its closure evidence, and record two identifiers
        the lead cannot mint - the gh pr view transcript resolving the PR number
        on the fork (or the recorded no-benefit or blocked bundle), and the git
        commit hash of the cross-run artifact update, whose diff touches all four -
        scorecard, backlog, debt list, fingerprint file - with this campaign's
        closure row. A closure without both is unverified, whatever the lead believes. Runs
        at each campaign closure; holds until every campaign is decided. When a
        failed verification and open campaigns co-hold, closure_unverified decides
        first - the discrepant campaign re-enters close-out while the join keeps
        holding for the rest.
      roles:
      - lead
      consumes:
      - closure_record
      - gate_approval_record
      produces:
      - run_closure_verdict
      outcomes:
        run_closed_complete:
          meaning: Every approved campaign reached exactly one verified gate-3
            closure and the artifacts reflect it.
          required_evidence:
          - run_closure_verdict
        campaigns_remaining:
          meaning: Verified closures so far recorded; other approved campaigns
            are still open.
          required_evidence:
          - run_closure_verdict
        resumable_stop:
          meaning: Remaining campaigns cannot proceed now but resumable state
            is preserved.
        closure_unverified:
          meaning: A claimed closure failed first-hand verification; the named
            discrepancy is recorded in the verdict and each discrepant campaign
            re-enters close-out. Re-entry re-executes the SAME closure type (never
            a second closure type) and re-presents gate 3.
          required_evidence:
          - run_closure_verdict
        no_route_remains:
          meaning: A required capability, resource, or authority is gone and no
            declared route remains for the open campaigns.
    trace_target_delta:
      intent: explore
      instance_per: requested_targets
      purpose: 'For exactly one requested target, resolve the minimal set of upstream
        changes it needs and every fact route costing consumes, recorded as one
        per-target delta report with source traces — contributing the per-target
        conjunct of scan_upstream_delta''s definition of done. Out of scope -
        route selection, costing, and any other target.

        '
      roles:
      - investigator
      consumes:
      - run_input_and_preflight_record
      produces:
      - delta_report
      activities:
      - Establish the plugin-side current state of the target at the frozen pin
        (present, partial, or absent), correcting any false premise in the target's
        framing with code citations before tracing further.
      - For a model-port target, decompose the reference's full forward pass at the
        served configuration the run input declares - every op class of each
        component block, across every parallelism and scheduling form the target
        serves (tensor, expert, sequence and context parallel forms, speculative
        decoding, asynchronous scheduling) - and inventory each op against the
        kernels the NKI library and the plugin carry at the pin as present, partial
        or absent, because the gap list is what costing prices and design maps; a
        feature-level trace alone hides the ops a port must build.
      - Trace source A1 (upstream GPU vLLM, local clone) - headline features via
        the PR-linked release-note chain to introducing commits; diffuse features
        via recorded git log grep/-S sweeps with queries, hit lists, and residual
        uncertainty persisted.
      - Determine source A2 applicability from the TPU reference repo's own support
        matrices via gh, then record a design trace (never a code-vendor plan
        - both its front-ends lower to a different kernel substrate) or a cited
        dead-end.
      - Run the mechanical runner-entanglement check - the config oracle's forcing
        conditions plus the legacy-runner grep - and record the verdict with command
        transcripts.
      - Flag whether the target touches a subsystem that left the plugin repo
        at the pin (externalized to an unpinned vendor dependency), so costing
        can re-scope the target or route an upstream-issue path.
      - Verify at code level any doc-only support claim that bears on this target
        (for example a documented support flip with no code evidence), and record
        the finding either way.
      - Close the report with a residual-gaps section (possibly empty) naming
        what could not be decided and why - an honestly recorded gap satisfies
        sufficiency for costing, which prices uncertainty instead of inheriting
        it silently.
      allowed_effects:
      - Read-only git, gh, and grep queries against the reference sources and
        the read-only plugin repo.
      - Writes only this target's report files under the run's delta artifact
        directory.
      forbidden_effects:
      - Any write to the plugin repo, the fork, upstream remotes, or any host.
      outcomes:
        target_traced:
          meaning: This target's delta report exists with every costing-required
            section - plugin-side state, A1 trace, A2 applicability and trace
            or dead-end, runner-entanglement verdict, externalized-subsystem flag,
            the op inventory with its kernel-gap list for a model port, doc-claim
            verification, residual gaps - each decisive claim carrying
            its command transcript. Sufficiency is satisfied by honest residual-gap
            recording, not by gap absence.
          required_evidence:
          - delta_report
        source_unreachable:
          meaning: A reference source this target's trace requires is unavailable;
            the partial per-target record is preserved for resume.
    design_campaign:
      intent: plan
      instance_per: approved_campaigns
      purpose: Design this campaign end to end and hand gate 2 one complete design
        record. Four steps, in order, under one node id. (1) Screen, on the first
        entry only - decide against read-only evidence that every capability the
        kickoff-declared target needs exists in the pinned repo (branch, SDK and
        weights are already the kickoff preflights' work); the note records
        re-checkable
        absence evidence. A re-entry never re-screens - the pin is frozen at intake,
        and the untried-lever question is design_blocked's own evidence. (2) Draft -
        the increment plan, test layout, venv plan,
        lease plan, and refined predicted file surface, all under the kickoff
        contract. Per increment the plan declares a stable id; the file surface it
        touches; its acceptance command WITH its expected result (a tier-1 measurement
        against a declared threshold, never a bare exit check) - CPU-mode for a glue
        increment; test-layout additions held to load-bearing tests - a test is
        written only where it fails on the defect class the increment's acceptance
        names, a kernel-class increment's tests are at most its oracle's regime
        entries, no increment exists to write tests, and a test the change breaks at
        a moved seam is deleted and listed in the evidence record, never repaired to
        pass, because a test that guards nothing costs every later increment its run
        and its repair; the single-agent-context size check; and a
        substrate decision - kernel-class (NKI required for kernel-class functionality
        the existing Neuron NKI library does not already provide) or an explicit
        non-kernel-class declaration, each with rationale. A kernel-class increment is
        one hot op (a fused form counts as one). Before any code the design carries,
        per served phase, an execution map - each component block's ops in execution
        order with input and output shapes at the declared served shapes, derived
        from the reference implementation and the trace's op inventory - and the
        cost table the map is the subject list of, one row per hot op on the map,
        whatever its
        substrate - authored or vendored kernels, torch and compiler-lowered ops,
        collectives, data movement - where a hot op is any op whose predicted
        time at those shapes exceeds the one tolerance the design registers (below it
        an op needs no row; beyond it a measured component is over its row); the map
        fixes each op and its shapes, never the reference's form - the form is chosen
        per row at the roofline, so a reference form that is slow on this hardware
        is re-derived, not copied; an op a chosen form adds (a producer, a mask, a
        layout change) is costed inside the row of the map op it serves, because a
        form's own ops are where the misses hide that a profile finds only after
        serving. A
        row (the cost-before-code principle) - bytes moved, instructions
        on the engine that binds, DMA descriptors, the engine mapping, serial-chain
        length, the predicted time under the served utilization cap row when the
        calibration record holds one and under the suite's synthetic-load cap row
        until then, the op's minimum work at the binding engine's calibrated rate as its
        roofline, and the predicted ratio - each value measured, citing a calibration
        row whose lowering and access pattern match the op's (a row for another
        pattern is no row), or derived with its arithmetic; a rate with no matching
        row is anchored first - a kernel_alone run of the costed form under a job
        lease, its row appended to the calibration record, re-run once on another
        roster host of the class when a host fault ends it and left unmeasured with
        the fault telemetry after a second - because the misses that build a kernel
        only to close it are the uncalibrated ones; an op over the bar carries a
        written hardware reason citing the measured rows that show its binding engine
        at its floor under the served cap, or the design re-derives its form here;
        each row names the recorded hazards its form avoids. Each kernel-class
        increment carries a numerics plan - the correctness class it declares
        (bit-equal, value-equal within a stated bound, or a stated precision class),
        the fp64 oracle it is read against over the registered regime classes
        (correlated inputs, repeated tokens, near-one gates, long carried state, an
        all-NaN row - the list is kept with the oracle tooling and grows from closure
        hazard items), the dtype per stage, a NaN containment note (which rows a NaN
        input reaches), and the two refused forms - a mask applied by multiplication
        to an operand that can hold a non-finite value, and an algebraic identity
        trusted without a finite-precision bound - because each refused form passes
        every generic input and fails only on the regimes the oracle names. The design's predicted
        sum over its rows is read against the campaign's performance gate; a sum that
        misses carries the reasons the user weighs at gate 2, and the user's
        acceptance of a predicted value is a criterion change - a user decision in the
        user's own words in the decision record, re-registered here as the criterion
        the adjudicator reads (kickoff criteria change only by explicit user
        decision) - so a predicted miss never closes as no_benefit by design. Any touch of the patch-application entry point or the
        ad hoc monkeypatches is a design decision recorded here, never implementer
        initiative. For upgrade-route campaigns only, assemble the regression matrix
        the acceptance gate reads - a stable row id, a model-by-feature cell, a
        procedure reference into the in-repo accuracy framework, and a verbatim-quotable
        threshold per at-risk support-table cell, rows on the unread orchestration
        layer flagged as a higher risk tier. (3) Register - freeze the comparator
        set (baseline identity, configuration, versions, the GPU-side reference
        version and known cross-version behavior differences) and record every
        kickoff-declared criterion adjudicable as written - verbatim thresholds or
        matrix rows with procedure references, per-procedure measurement-pitfall
        pre-emptions, and per-criterion check-tool liveness pairs (the value that must
        appear evaluated, and a known-bad input the procedure must fail on) - and,
        for a model port, the performance table's cells (first-token latency,
        inter-token latency and output tokens per second at each declared context
        length and concurrency level), each with the comparator arm the PR pairs it
        with and the protocol the description reports (arms as commits, hardware and
        parallelism, pairing order, warm-ups, repeats), as declared measurements, so
        the PR reports cells that were measured under a protocol that was registered
        - and
        register the served profile at the declared shapes with its per-op attribution
        as the diagnostic that tells the performance gate's two failure routes apart
        (adjudicate_results), with the one tolerance that bounds a hot op and a
        measured component's excess over its row, and each kernel-class op's declared
        correctness class, because a
        change of class is the user's call and a registration change re-presents
        gate 2; the predicted rows themselves stay in the design record, so a
        re-derived row re-enters gate 2 under the standing approval and not as a
        changed criterion. A
        criterion
        that cannot be registered adjudicably is surfaced, never reworded - kickoff-declared
        criteria change only by explicit user decision (P9). (4) Assemble - the
        campaign_design_record from the three outputs, then the completeness self-check
        before the record reaches gate 2 - every increment carries its full contract,
        every hot op its cost row with every rate cited to a matching row, a
        kernel-class increment its numerics plan;
        every criterion is adjudicable as written; the patch-decision and substrate
        registers are present with explicit none-declarations; the coverage trace
        maps every kickoff-declared deliverable and criterion to the increments
        that implement it and the registered acceptance that judges it. When the
        screen finds a required capability absent at the pin, assemble the
        infeasibility variant instead - the evidence, re-scope options, and
        upstream-issue draft path close-out needs. Every artifact is authored against
        the target artifacts on disk, never from memory of them, and cites the
        revision-log line of the record it edits. Hands - whether the first round runs
        as one seat or as sequential seats (screen, draft, register, assemble) under
        this one node is run setup declared per node (spec section 2.1); a large
        campaign runs sequential seats so no seat exceeds its bounded context, and
        the investigator seat owns the screen. Re-entry - the brief names the parts
        to touch and the finding, contradiction, adjudicated per-op cost miss, or user
        decision each answers; an unchanged part
        is not re-authored, the round hands back a block diff, and a round that must
        touch a part the brief did not name stops and reports the cascade for a
        re-brief. Re-entry check tool - when the campaign_target_pins entry equals
        its source and the standing note is cited, the registration is byte-unchanged
        with no standing finding naming a registered value, and the only changed
        input is a block diff the lead has read touching no unnamed part, the lead
        performs the delta and re-runs the completeness self-check with no seat,
        recorded in run state; a registered-value touch, a finding that names an
        absent capability, a self-check gap, or ambiguity runs the seat. A
        registered-value
        touch always gets a fresh value-level read,
        never hash-only verification. Superseded round material is deleted from the
        read path at each re-entry, the supersession recorded as one revision-log
        line; the current record carries the current design content only. Out of
        scope - code changes, any measurement of a candidate, hardware contact beyond
        an anchor run.
      roles:
      - investigator
      - implementer
      consumes:
      - kickoff_contract_record
      - delta_report
      - hardware_calibration_record
      - adversarial_review_findings
      - rederivation_record
      - adjudication_verdict
      produces:
      - pin_feasibility_note
      - increment_plan_draft
      - regression_matrix_draft
      - acceptance_preregistration
      - campaign_design_record
      - hardware_calibration_record
      allowed_effects:
      - kernel_alone anchor runs of a costed form that has no calibration row, under a
        job lease through the hardware queue tool, each row appended to the
        calibration record with its run record.
      forbidden_effects:
      - Code changes to the target repo.
      - Hardware contact beyond an anchor run; any serving launch.
      - Running any measurement of a candidate or any matrix procedure.
      outcomes:
        design_ready:
          meaning: Complete, self-checked design record assembled with its frozen
            acceptance registration, ready for gate 2. Never co-holds with
            infeasibility_recorded.
          required_evidence:
          - campaign_design_record
          - acceptance_preregistration
        infeasibility_recorded:
          meaning: A capability the target requires is absent at the pinned release,
            shown with re-checkable command output; the record documents the
            evidence, re-scope options, and an upstream-issue draft path toward
            close-out. Reported ahead of design_blocked when both hold, because
            re-derivation cannot restore a surface absent at the pin.
          required_evidence:
          - campaign_design_record
          - pin_feasibility_note
        design_blocked:
          meaning: The design cannot be completed as kicked off and the record names
            which stop fired - the findings history shows the same material finding
            recurring with no untried lever; the plan or matrix breaches this node's
            bounded context even across sequential seats; a kickoff-declared cell
            or criterion cannot be made adjudicable without changing it; a hot op has
            no costed form within the bar and no hardware reason the record can state,
            or its row was re-derived once for a served shortfall and no new
            calibration or anchor row exists, or the user declined its predicted miss
            at gate 2 and no new row or form exists;
            or the completeness self-check finds the same named gap recurring with no
            gap-closing artifact since the prior round. Routed to first-principles
            re-derivation with the evidence.
    scope_next_increment:
      intent: plan
      instance_per: approved_campaigns
      purpose: 'On every entry to implementation - fresh from the design gate,
        or re-entry from a realized item, a whole-campaign code finding, a stale tip at
        the close-out check, an attempt-loop product defect, a
        correctness shortfall verdict, or a regression verdict - reconcile four
        persisted inputs: the approved
        design''s increment plan, the adversarial findings history for this campaign,
        the per-increment evidence records already on disk, and the user decisions
        recorded since the standing gate-2 approval. Verify the campaign
        worktree and branch preconditions (worktree present, branch based on this
        campaign''s entry in campaign_target_pins, no protected base branch touched).
        Then emit exactly one of: the next pending work item - or a set of pending
        items sized by one of two calls - the serial call (one item when any is
        complex - a kernel-class increment outside a kernel set, or a runner,
        scheduler, or weight-loading change - up to three low-complexity items in
        aggregate), or the kernel call, the default whenever two or more kernel-class
        increments are pending - every pending kernel-class increment whose op is
        distinct and whose file-and-method surface is pairwise-disjoint from the
        others'', recorded in order as one pull list with the review capacity (items
        in flight per retained kernel reviewer, a run-setup value) in the round row;
        as many items as the roster''s idle kernel_alone capacity at this round allows
        (the queue tool''s remaining-capacity reading) run at once, one seat per item,
        and a seat that reaches its verdict takes the next recorded item until none
        remain, because each is one op with its own oracle, lease and review that
        shares only the branch, a port''s kernels are its critical path, and
        implementation time is the objective; the serial hand is the lead''s narrowing
        when idle capacity is one -
        - as a recorded round entry naming each item''s design increment id, declared
        acceptance, and the findings it must answer, plus the set''s implementation
        order (a set whose items declare pairwise-disjoint file-and-method surfaces
        under the collision ranking''s declared-scope rule is marked eligible for
        concurrent implementation; any other set is implemented in the recorded order);
        or the completion, defect, exhaustion, or no-progress verdict. On plan_satisfied
        the lead also assembles the implementation_changeset in the same round - the
        campaign branch diff against the target base recorded in campaign_target_pins,
        the evidence index proving every planned and repair increment carries its
        passing record (changeset_complete names each class''s), the transcript of a
        mechanical NxDI-import scan over the diff
        (zero hits), the transcript of the mechanical substrate-fidelity check
        (every design-declared-NKI increment''s diff shows NKI usage), and the
        transcript of the process-vocabulary scan over the added lines and paths of
        the diff (zero hits); the three transcripts
        meet the scan-completeness discipline pinned at references/artifact-layout.md
        section 4.6, and the whole-tree run record of the declared test paths on the
        tip (changeset_complete names its two zeros). A gap in any of the six is a
        coverage-gap work item minted in the same round record with its class (a)-(f),
        and the round re-enters. Work-item classes and their declared acceptance:
        build or repair increments (the design''s CPU-mode command for a glue
        increment; the oracle match, kernel-alone ratio and kernel review for a
        kernel-class one); coverage-gap
        items (the recomputed gap check that found the gap - the missing increment''s
        own CPU-mode command for a record gap, the evidence-index coverage
        recomputation for a diff-work-uncovered gap, the import scan re-run for an
        import-scan hit, the substrate-fidelity check re-run for a substrate-fidelity
        hit, the whole-tree run re-run for a
        test-tree hit, the process-vocabulary scan re-run for a process-vocabulary
        hit); repackaging items when review
        found the changeset not reviewable as one unit against the increment plan
        (the recomputed one-unit coverage check); localization items, minted at a
        re-entry from a correctness-shortfall or regression verdict before any repair
        item, unless a localization record already names that verdict''s entry point
        - the acceptance is the recorded entry point on the served device (the
        compare tool''s first layer or state that departs from the reference beyond
        the registered tolerance) or the recorded finding that no device-exposed
        state departs - on CPU emulation of the served tip only when the run record''s
        launch reading shows no idle device; repair items then derive from that record;
        fold items, minted at the round that first reads a user decision, in the user''s
        own words, that a changeset the campaign did not design (the user''s own branch
        or pull request against the campaign branch) lands on the campaign branch - the
        merge decision stays the user''s; the campaign only lands commits on its own
        branch - selected ahead of plan items because every later item builds on the
        tip; the acceptance is the folded tip''s diff against the pre-fold tip equal, as
        a set of added and removed lines, to the changeset''s diff against its own base
        (values git produces), plus the whole-tree CPU-mode test pass on the folded tip;
        the changeset''s review is the whole-campaign review before the PR, as for every
        glue increment, so no reviewer runs before the fold; a maintainer-pass item,
        minted once every planned and repair item has passed and the branch diff''s
        digest differs from the newest pass record''s - the first pass reads the clean
        diff, every later pass the diff since the newest pass record''s tip (the
        whole-campaign review keeps the one full read), as the fork''s maintainer,
        removing dead code, duplicated helpers, process
        residue and tests beyond load-bearing, with no behavior change - its
        acceptance the AST or token diff of the touched functions showing no behavior
        change, the process-vocabulary scan at zero and the whole-tree pass on the
        new tip, because a residue finding after serving costs a re-serve while a
        pass before hardware costs one seat. The no-progress detector reads
        two input families and fires on either. (1) The findings history under
        artifacts/reviews/ - repeated identical material findings, keyed on exactly
        the finding fingerprint the reviewed sibling fixed (the artifact-layout
        impl/review pair entry is the shape authority): the triple increment id
        + surface + defect class - identical-across-rounds is a mechanical string
        match of triples against prior round records with no new passing increment
        evidence record for that item since the triple was last answered. (2)
        This boundary''s own round records'' gap and stuck entries - this node would
        emit the same named gap (or an identical gap set) or re-select the same
        stuck increment it recorded on a prior round while no new passing increment
        evidence record for that item has appeared since that round and the item''s
        declared acceptance has not advanced (the detector compares the recorded gap
        list, the stuck-increment id, and the passing-record set against the prior
        round''s record; it reads passing records only, because a stuck round writes
        an investigation record). Recorded
        detector, no attempt caps. Design-approved monkeypatches arrive as debt
        notes, never findings: they mint no work item and enter neither detector
        input. Empty histories on a first round can never fire either input. When
        more than one verdict holds at once, report exactly one outcome by this
        precedence: (0) criteria_changed_by_user - the acceptance basis moved, so no
        other verdict is decidable until it is re-registered; (1) plan_unrealizable_as_designed
        - a concrete recorded contradiction outranks every repetition signal; (2)
        no_new_route - repetition proves
        iteration is not working, so it outranks resizing; (3) plan_exceeds_node; (4)
        plan_satisfied when nothing is pending; (5) increment_selected otherwise - an
        item whose prerequisite is an unlanded plan block is held by id in the row and
        the prerequisite selected, an ordering fact with no route of its
        own.
        A landed item''s plan block collapses to its plan row at the round that
        first reads its passing record (the layout reference''s cap rule), and
        the round record names the plan''s revision-log line after the collapse. Check tool
        - every round the lead decides mechanically from the persisted inputs with
        no seat: the landed set from the passing records, the gate table and milestone
        order from the plan, the ascending increment id within the released items,
        the two detector inputs, and the worktree
        precondition checks. A mechanical round writes its outcome row - the selected
        block, the plan''s revision-log line - and no round
        record; a round record is written when a seat ran, a gap or stuck item is
        named, or the changeset is assembled, and it carries the commands and outputs
        it derived from, never a bare conclusion. The implementer seat
        runs only when the round needs a judgment the rule does not decide - a contradiction
        candidate the worktree precondition check surfaces that no realizer record
        has yet recorded (plan_unrealizable_as_designed needs a recorded contradiction,
        and the realizer''s evidence_contradicts_design stays the usual door),
        a disagreement between the findings history and the round records about
        whether a triple was answered, or a repair item to derive from a localization
        record that names the defect but not the fix. Ambiguity runs the seat. Out of scope
        - any code change, any test run, any probe: a seat here reads records and
        recommends; the instrument that localizes a served candidate is the
        localization item, realized on the device.

        '
      roles:
      - implementer
      consumes:
      - campaign_design_record
      - adversarial_review_findings
      - increment_evidence_records
      - increment_lap_record
      produces:
      - increment_lap_record
      - implementation_changeset
      activities:
      - When a seat is dispatched, it is the one retained doer thread per campaign
        that answers this node and its stage-6 loop sibling (realize_increment)
        for every glue item, replaced only when its context degrades the work; a
        kernel set's items each get their own seat (realize_increment's default).
      - On plan_satisfied, assemble the six changeset components with the commands
        recorded in the round record; each is recomputable by a reviewer from the
        branch and the records.
      allowed_effects:
      - Reads of the campaign worktree, design record, findings history, and increment
        evidence records.
      - Writes of round records and the changeset artifact inside this campaign's
        evidence directory only.
      forbidden_effects:
      - Any write to the campaign worktree source tree or any branch.
      outcomes:
        increment_selected:
          meaning: The next pending work item, or a set sized as one implementation,
            is named in the outcome row - each item with its design increment id, its
            declared acceptance (as its work-item class declares it), and the review
            findings
            it answers, plus the set's implementation order or concurrent-eligibility
            mark - decided by the lead resolving item-by-item against the approved
            design record and findings history
            on disk, a derivation any reader can re-run from the same two inputs.
        plan_satisfied:
          meaning: Every increment in the approved plan, plus every repair item
            derived from confirmed findings, carries its passing evidence record on
            disk (CPU-mode for glue; oracle, ratio and review for kernel-class), the
            maintainer-pass record names the branch diff's digest, nothing is
            pending, and the changeset artifact is assembled
            in this round. Routes to hardware preparation under the edge's checks.
          required_evidence:
          - increment_evidence_records
          - implementation_changeset
        plan_unrealizable_as_designed:
          meaning: The design's increment plan contradicts the repo state this
            node can observe - a named surface or precondition does not exist
            as designed (for example a subsystem that left the repo at the pinned
            base) - with the contradiction recorded. Implements the parent outcome
            design_defect_found.
        no_new_route:
          meaning: Either input of the no-progress detector in the purpose fired - the
            findings history repeats a material finding's fingerprint triple
            (increment id + surface + defect class) with no new passing evidence
            record for that item since the triple was last answered (so a
            doer-reviewer disagreement loop fires this outcome instead of spinning
            behind gate 2), or this boundary's own round records repeat a named gap or
            stuck increment with no new passing record and no advance in the declared
            acceptance. Round records prove either repetition mechanically. Implements
            the parent outcome no_progress.
        plan_exceeds_node:
          meaning: The reconciled remaining work cannot fit this node as sized
            - the exhaustion evidence (round records, attempt fingerprints, remaining-item
            list) is recorded. Implements the parent outcome scope_exceeded.
        criteria_changed_by_user:
          meaning: A user decision recorded in the user's own words after the standing
            gate-2 approval changes a kickoff-declared criterion or a registered value
            (P9) - decided by the decision record, never by a lead reading of intent.
            The round records the decision's reference and selects nothing; the design
            node re-enters for the register step alone (a new registration beside the
            frozen text, which stays untouched), and gate 2 re-enters under that
            decision as its approval. A measurement in flight completes on the
            registration it started under; the change takes effect from this round.
          required_evidence:
          - increment_lap_record
    realize_increment:
      intent: execute
      instance_per: approved_campaigns
      purpose: 'Implement the selected work item - or each item of the selected set,
        every item with its own code change, tests, acceptance transcript, commit,
        and one-file evidence record - in this campaign''s isolated worktree (one
        checkout per item for a concurrent-eligible set) on its campaign branch:
        make the code change the design names
        for this increment, add or extend the load-bearing tests the design''s test
        layout declares for it (the fork''s small test overlay is the only in-repo
        net; a test the change breaks at a moved seam is deleted and listed in the
        evidence record, as the design''s test rule says), run the increment''s declared
        acceptance to a recorded command transcript - CPU-mode (VLLM_NEURON_CPU_MODE=1)
        for a glue increment; for a kernel-class increment, first the fp64 oracle and
        its regime inputs, built and recorded before the kernel, then the kernel to the
        costed form, read on two values the world produces - the oracle match in the
        declared class over every registered regime, and the ratio measured
        kernel-alone on a device at the cost row''s shapes under a kernel_alone job
        lease, read against the row''s roofline (the op''s minimum work at the
        calibrated rate), within the bar or the design''s written reason - and then
        its review:
        a retained kernel reviewer (independent of this seat; one reviewer per review
        capacity of items in flight, the capacity the kernel call''s round row
        declares, so the review queue never outgrows the hands that build; each
        retained across its own items'' rounds (spec section 9.4 per item), context
        carried by the records and never by relay, replaced only when its context
        degrades the work) reads the kernel diff beside the oracle, ratio and
        cost-row records, and the
        doer answers its findings directly, round by round, with no lead word between
        them; the item passes when no material finding stands, and material here means
        the whole-campaign review''s code classes (review_pr_evidence) plus a kernel
        built to a form other than the costed one, an oracle run over fewer regimes
        than registered, a ratio measured at other shapes or arms than the row''s, a
        dtype stage outside the table, or a refused numerics form; a ratio that misses
        the bar where the row predicted inside it is the design contradicted (the cost
        row, not the code, is wrong) and takes that outcome -
        and write the increment''s one-file evidence record (command, exit status,
        diff stat, commit hash; for a kernel-class increment the oracle, ratio and
        review records beside it). When the selected item is a coverage-gap item,
        the work is to close the named gap and decide on the recomputed gap check
        that found it, as the round record declares - the missing increment''s own
        CPU-mode command, the evidence-index coverage recomputation, the import
        scan re-run over the repaired diff, the substrate-fidelity check re-run over
        the repaired diff, the whole-tree run of the declared test paths re-run on
        the repaired tip, or the process-vocabulary scan re-run over the repaired
        diff. When the selected item is a repackaging item (review
        found the changeset not reviewable as one unit against the increment plan),
        the work is instead to regroup the campaign branch''s commits and increment
        records so the changeset reads as one unit per plan increment, deciding
        on the recomputed one-unit coverage check the round record declares - same
        branch authority, no new code behavior. A set converges here - the node''s
        outcome is recorded once every item of the set has reached its verdict (for
        a kernel set, once its pull list is empty and every item has one),
        by the outcome precedence applied over the set (a recorded contradiction
        on any item outranks; then increment_stuck when any item lacks a passing
        record, the passed items'' records standing and landing; then increment_passed).
        Check tool for a glue set - by default the one retained doer thread
        implements the set in the recorded order, item by item, each item to its
        own commit and evidence record; a set marked concurrent-eligible may instead
        run one seat per item at once when the lead gives each item its own checkout
        and lands the items onto the campaign branch at the join in the recorded
        order, a conflict at the join being a scheduling defect recorded in the
        round record that returns the set to the serial default; whether a glue set
        runs one hand in order or one per item is run setup, declared per node (spec
        section 2.1). A kernel set runs one seat per item at once by default, each
        item in its own checkout (its surfaces are pairwise-disjoint by the kernel
        call), a finishing seat taking the next item of the pull list with no scoping
        round between, because
        implementation time is the objective and a kernel waits on nothing but its
        own oracle, lease and review; each item builds its oracle and compiles on CPU
        while its kernel_alone lease is queued (a queued lease is waiting, not stuck,
        until the grant request''s wall-clock cap expires; then the item records
        increment_stuck with the queue record), the lease reserves only the device
        slice its pre-registration pins so sibling kernels share a host''s pools, and
        finished items queue to their retained kernel reviewer in finishing order.
        When the selected
        item is a localization item, the work is to find where the served candidate''s
        computation departs from the reference - a diagnostic run (the class
        hardware_attempt_counts defines) reading state out through instrumentation
        that touches no traced code, existing dump machinery before new, compared per
        layer or state to the reference; the item''s acceptance is the one its class
        declares at scope_next_increment. When the selected item is a fold item, the
        work is to rebase the changeset onto the campaign tip in the worktree, resolve
        any conflict to the exact union of both sides, run the whole-tree CPU-mode pass,
        and land the commits as written (authors and messages kept, no squash) so the
        whole-campaign review reads the commits the user wrote; the item''s acceptance is the one
        its class declares at scope_next_increment. When the selected item is a
        maintainer-pass item, the work is the maintainer read of the diff its class
        declares (the clean diff first, the delta since the newest pass record after)
        and its commits, by the retained doer thread, the acceptance the one its
        class declares. Device over emulation - the run goes to a
        Neuron device whenever the queue tool''s remaining-capacity reading at launch
        shows one idle for the job''s need, because emulating a device is slow by
        construction and the device''s numerics are the question; CPU-mode emulation
        of the served tip is the fallback when the reading shows none, or the
        instrument for a question the device cannot expose, the reason in the record.
        Every run record on a served tip carries that reading. Reproducing or
        localizing a device result is localization work in every item - a CPU-mode
        run that does it while its reading shows an idle device is work not done as
        designed, so its result is not a pass and its record is the finding the next
        scoping round reads. Dispatch delegate skills only
        through the run''s guardrails. Out of scope - serving attempts, any write
        outside the campaign worktree and branch, and any change to kickoff- or
        design-declared acceptance criteria.

        '
      roles:
      - implementer
      - adversarial_reviewer
      - delegate_dispatcher
      consumes:
      - increment_lap_record
      - campaign_design_record
      - hardware_calibration_record
      produces:
      - increment_evidence_records
      - adversarial_review_findings
      - hardware_attempt_log
      activities:
      - Locate the increment's file surface from the design record and read only
        the slices of the collision-heavy files it names.
      - Implement the change - for a kernel-class item the oracle first, then the
        kernel to the costed form; author or extend the declared tests.
      - Run the declared acceptance; capture the full transcript - for a kernel-class
        item the oracle run, the kernel_alone ratio run, and the kernel review rounds.
      - On failure, investigate and repair within this increment, persisting the
        investigation record (checked, ruled out, found) as it grows.
      - Commit to the campaign branch and write the one-file increment evidence
        record.
      allowed_effects:
      - Writes inside this campaign's worktree - or, for a concurrent-eligible set,
        one checkout per item on the campaign branch - and branch on the fork.
      - CPU-mode execution on local or assigned hosts (never counted -
        hardware_attempt_counts); on a served tip only as the purpose's fallback, the
        launch reading in the record.
      - For a kernel-class item - kernel_alone runs of its kernel (the ratio
        measurement and the device execution the oracle is read on) under a job lease
        taken through the hardware queue tool on a roster host of the target class;
        recorded in the attempt log with the class, fingerprint, and transcript.
      - For a localization item only - a diagnostic run, the class
        hardware_attempt_counts defines, on the served device under a job lease taken
        through the hardware queue tool; recorded in the attempt log with its class,
        fingerprint, and transcript.
      - Guardrailed delegate dispatch.
      forbidden_effects:
      - Opening a Neuron device for anything but a kernel_alone run of this item or
        that diagnostic run - a run that compiles a candidate graph or decides the
        candidate's acceptance is a serving attempt and belongs to execute_attempt_loop.
      - Mutating protected base branches on fork or upstream.
      - NxDI-stack imports in ported code.
      - Clearing the shared Neuron compile cache.
      - Any write into /opt or any venv cloning shortcut.
      outcomes:
        increment_passed:
          meaning: Every item of the selected work item or set passed its declared
            acceptance - the CPU-mode command transcript and exit status for glue
            build and repair increments; for a kernel-class increment the oracle
            match, the kernel-alone ratio within the bar or the written reason, and
            the kernel review record with no standing material finding;
            the recomputed gap check that found the gap for coverage-gap items,
            the recomputed one-unit coverage check for repackaging items, or the
            compare tool's recorded entry point or no-departure finding for
            localization items, or the exact-union readings and the whole-tree pass
            for fold items -
            and its evidence record is written; decided by values produced by
            the check tool, not the doer's judgment. Routes back to scoping for
            the next item.
          required_evidence:
          - increment_evidence_records
        evidence_contradicts_design:
          meaning: The increment cannot be implemented as designed and the contradiction
            is recorded with the observing evidence (the designed seam, API, or
            precondition does not hold in the worktree; or a kernel built to the costed
            form measures over the bar where its cost row predicted inside it - the
            measured and predicted values recorded). Implements the parent outcome
            design_defect_found. Outranks both other outcomes when results co-hold
            - a concrete recorded contradiction beats a green transcript reached
            by deviating from the design (deviation is out of scope, so such a
            pass is not a pass) and beats mere exhaustion. For a set, names the
            contradicted item.
        increment_stuck:
          meaning: Honest repair attempts on this increment are exhausted for
            this dispatch without a passing acceptance, or a kernel-class item's
            queued lease outlived its grant request's wall-clock cap; the persisted
            investigation
            record carries what was checked, ruled out, and found, and the stuck
            increment's id persists in the round record so recurrence feeds the
            no-progress detector. Routes back to scoping, which re-selects with
            the new evidence or detects no-progress from the round history. Reported
            only when neither a recorded contradiction stands nor the declared
            acceptance passed on work done as designed - the last door in the
            precedence. For a set, names each stuck item; the passed items' records
            stand and land.
    prepare_host:
      intent: execute
      instance_per: approved_campaigns
      purpose: Put one leased, identity-verified Neuron host with this campaign's
        own venv under the campaign. Three entry modes. Full mode (from the plan's
        completion, or after a host was given up) - lease, then venv. Recovery mode
        (from the attempt loop's host_faulted, or from a host-level build failure
        inside this node) - restore the faulted host this campaign leases, alone or
        beside other campaigns' leases, or give it up; the recovery rule is below.
        Probe-only mode (after a restored host) - the lease stands, so run only the
        venv verification probes and never re-request a lease the campaign already
        holds. Lease -
        a lease reserves named non-shareable pools from the roster's declared
        capacity, never the whole host. One noun at two grains. The campaign lease,
        taken here through the hardware queue tool on a target-capable host, reserves
        nothing and binds the campaign to the host's verified identity. A job lease
        is held by every job on that host that takes non-shareable capacity (a venv
        build, an attempt, a recovery action) and names the pools and amounts it
        takes - Neuron devices, host memory for compilation, CPU cores for a long
        compile or a many-worker start-up, the compile-cache write slot (a pool of
        one until the cache read is per job, because with two writers a clearing can
        hide behind the other's additions), any other pool the roster sizes. A job
        starts when its reservation fits the remaining capacity - the roster's pools
        minus every open job lease, derived from the lease records (grants without a
        release), never a stored counter - so jobs of different campaigns share a
        host when their reservations fit. A reservation larger than a pool's roster
        size is a defect in the request, corrected and re-requested, never a wait. A
        job that takes no pool (for example a CPU-mode run that opens no device,
        writes no cache, and needs no core or memory pool) holds no job lease,
        because it takes nothing another job could lack; it runs under the
        campaign lease on its own identity probe and attempt record. A kernel_alone
        job (a calibration row, a design anchor, an increment's ratio run) holds a job
        lease on any roster host of the target class and no campaign lease, because it
        binds nothing to a host identity; its grant request carries the job's
        pre-registration - the form or increment, the shapes and arms, the bar it is
        read against, its wall-clock cap and the resources it pins - and the tool's
        release record appends the host's fault telemetry for the job's devices since
        the grant, so a fault is attributed by a record join and never by a seat's
        reading. Before the
        campaign lease counts as held, re-verify the host's identity live over
        one-shot SSH against the roster's recorded identity markers (instance
        identifier, hostname, and a boot identifier when the host exposes one -
        record which markers were checkable). A boot-identifier-ONLY delta is
        expected when a logged reboot for that host precedes it in any campaign's
        recovery records for that host; an instance-identifier or hostname mismatch
        is always a hard stop. The hardware queue tool is the single writer of every
        lease record - grant, release, and amendment, one file per event, the grant
        taken under a per-host lock so two jobs never both get the last unit; a campaign
        lease asked for by a campaign that already holds one on that host is refused
        with the standing lease's reference, so one campaign never holds two; a
        serving-class job lease is granted only when the request names the job's
        class, its tip and the client leg that will drive its requests, and the
        attempt log carries the tip's bring-up
        records (the ladder at execute_attempt_loop), because a server held with no
        client, or launched past a defect a cheaper probe finds, is charged time that
        measures nothing; a grant whose job's attempt record closed without a release
        is released by the tool
        on its next invocation, never by hand; an amendment (a new boot identifier)
        applies to every campaign lease naming the host; the requesting seat invokes
        the tool and never writes a record by hand; the lead freezes the roster at
        intake, reads the records for scheduling, and arbitrates nothing per grant. A campaign lease
        record carries host, markers verified, markers unavailable, deltas explained,
        grant reference; a job lease record carries the job, its class, tip and client
        leg, the pools and amounts reserved, grant time, and release. Venv - build the
        campaign's isolated venv on the leased host by the freeze-replicate recipe
        and prove it live - discover the DLAMI baseline venv path per host (never
        hardcode a suffix), check the ~10 GB disk budget, freeze, SCREEN the freeze
        (drop the plugin package's own entry and every editable or direct-file
        reference, logging the screened lines), replay into a fresh per-campaign venv
        with the vendor private index, editable-install the campaign worktree with
        --no-deps, then verify - (a) the private-index core dependency resolved as
        a real distribution, checked via installed-package metadata; (b) an
        edit-visibility probe with a campaign-derived sentinel round-trips through
        the venv's import path; (c) the disk check ran before the build. Failure-class
        precedence when both hold - a build failure whose cause is host-level (disk
        exhaustion, device errors, unreachability) is a host fault and enters
        recovery mode here, never replication_failed. A recipe failure on a healthy
        host is fingerprinted and counted against the per-target hardware-attempt
        budget before any retry; never retry an identical fingerprinted build; at
        the tier-2 threshold exit replication_failed with all fingerprints attached.
        Recovery - a hard sequence, because a recovery action on the wrong host or
        under another campaign's open work is the costly, hard-to-reverse direction.
        Check the allowance first - one successful recovery per host per campaign,
        so a host that faults again after a successful recovery is unrecoverable
        with no action taken; every campaign that faulted in an episode consumes its
        allowance for the host, whoever recovered it, since the flap bound counts
        the faults this campaign saw. Then check whether another campaign's recovery
        of this host is open - one recovery per host at a time, because two ladders
        on one host reboot it twice; the first recorded fault owns it, and every
        other campaign releases its open job leases through the queue tool, waits
        for the owner's recovery record, re-verifies identity itself and takes the
        owner's result. Then re-verify the host's identity live against the lease
        record under the identity rule above BEFORE any state-changing action - a
        mismatch refuses to act, records the mismatch verbatim, and the host is
        unrecoverable; drain and checkpoint in-flight work; take the recovery action
        (service restart, then reboot as escalation) on the leased host only and
        never while another campaign's job lease on the host is open; after the host
        returns, re-verify identity again and record the new boot identifier through
        the queue tool as a lease amendment BEFORE the host counts as restored, so
        the next episode's pre-check compares against the current value. Every
        action is a one-file-per-event recovery record. A restored host - SSH
        answers, identity re-verified, the new boot identifier recorded, Neuron
        devices enumerable, decided by the post-recovery probe transcript in the
        recovery record and never by the recoverer's claim - continues in probe-only
        mode; the decision tier is conditional, tier-1 source binding where a boot
        identifier exists and the probe-only re-execution the catch where none does.
        An unrecoverable host - the ladder exhausted with each action and its
        evidence logged, the allowance exhausted, or an identity mismatch - has this
        campaign's lease released through the queue tool, and the node continues in
        full mode for a roster replacement; when none exists, no_host_available
        carries the recovery evidence. Recovery never touches the shared compile
        cache as a remedy, never acts on the GPU baseline (user confirmation only;
        it is never leased here), and never acts on a host this campaign's lease
        does not name; approach-level fixes belong to the stop limit path. Out of
        scope - any host mutation beyond the identity probe, the venv build and the
        recovery action; any write to the shared DLAMI venv or /opt.
      roles:
      - implementer
      - delegate_dispatcher
      consumes:
      - implementation_changeset
      - campaign_design_record
      produces:
      - hardware_attempt_log
      activities:
      - Full mode only - read the roster and the open lease records; take the campaign
        lease through the queue tool on a host matching the campaign's declared target
        hardware, excluding hosts
        whose recovery allowance for this campaign is exhausted (derived from the
        recovery records, never a stored counter); re-verify identity markers live
        before confirming the grant; any mismatch other than an explained
        boot-identifier delta refuses the host, reports the evidence verbatim, and
        requests the next roster candidate.
      - Full mode only - build the venv per the recipe above, under a job lease when
        the build takes a pool; none when it takes no pool.
      - Recovery mode only - allowance check, open-recovery check, identity
        re-verification, drain, action, re-verification and lease amendment, in
        the order the purpose fixes; a restored host continues in probe-only mode,
        an unrecoverable one releases the campaign lease and continues in full mode.
      - Full and probe-only modes - run the three verification probes and append
        their machine outputs (metadata dump, sentinel round-trip value) to the
        attempt log.
      - On a build failure, classify host-level causes first - a host-level cause
        enters recovery mode; fingerprint and count a recipe failure before any retry.
      allowed_effects:
      - Read-only one-shot SSH identity probes to roster hosts.
      - Campaign and job lease grant and release, and campaign lease amendment,
        through the hardware queue tool - in recovery mode the recovery action's
        own job lease and this campaign's faulted attempts' releases included.
      - In-band SSH to the leased host; venv AND campaign-worktree creation under
        the campaign's own directory only.
      - Recovery mode only - recovery actions (service restart, then reboot) on this
        campaign's leased host, identity-verified and logged.
      forbidden_effects:
      - Writing a lease record by hand (the queue tool is the only writer).
      - Any state-changing command on a host before the campaign lease names it and
        the job's identity probe matched, or beyond what the job lease reserves.
      - cp -a venv cloning; any pip write into /opt or the shared DLAMI venv (editable
        installs included).
      - Retrying a build whose failure fingerprint matches a recorded one.
      - Any action on the GPU baseline instance.
      - A recovery action on a host whose live identity fails to match the lease
        record (boot-identifier-only delta with logged prior reboot excepted), or a
        whole-host action (reboot or runtime restart) while another campaign's job
        lease on the host is open.
      - Clearing the shared compile cache as a recovery remedy.
      - Provisioning a replacement instance.
      outcomes:
        host_ready:
          meaning: A lease record written by the queue tool names this campaign as a
            holder of one named host whose live identity markers matched
            the roster (or whose sole delta is a boot-identifier change explained
            by a logged reboot), and the per-campaign venv exists at its discovered
            path with all three verification probes passed - decided by the lease
            record, the identity-probe transcript, and the probe artifacts in the
            attempt log, never by this node's assertion. Other campaigns may hold the
            same host; capacity is decided per job by its job lease, never here.
          required_evidence:
          - hardware_attempt_log
        no_host_available:
          meaning: Every roster host matching the target failed identity
            verification, exhausted its recovery allowance for
            this campaign, or is unreachable, and no replacement exists. Each
            refusal names the measured state it rests on - the probe or read output
            showing that host unreachable or mismatched - because this
            outcome closes an approved campaign. A precheck clause that no host of
            this class can satisfy is a defect in the precheck, recorded and re-run,
            never a refusal.
          required_evidence:
          - hardware_attempt_log
        replication_failed:
          meaning: The recipe cannot produce a verified venv on this healthy host
            after non-identical, budget-counted retries, or the tier-2 threshold
            is reached, with the failure fingerprints recorded; recipe dead ends
            are approach-level and route to the stop limit path. Host-level causes
            never land here - they enter recovery mode first.
    execute_attempt_loop:
      intent: execute
      purpose: Run compile-and-serve hardware attempts in-band over one-shot SSH on
        the leased host until the candidate serves. Before every attempt, consult the
        repo-tracked fingerprint file AND this run's attempt-log fingerprints; never
        launch an attempt identical to a recorded failure (tier 1). Before any
        serving-class launch, the tip has passed the bring-up ladder (activities),
        every rung uncharged and recorded. Count every serving attempt against the
        per-target budget by the one count rule at the hardware_attempt_counts state
        field, and halt at the tier-2 threshold (every 10 budget-counted attempts per
        target since the last re-derivation). A host fault on the threshold-reaching
        attempt routes to host_faulted first (the outcomes say why). Out of scope -
        adjudicating the candidate's quality (downstream measurement owns that);
        recovery actions (host preparation's recovery mode owns those).
      roles:
      - implementer
      - delegate_dispatcher
      consumes:
      - implementation_changeset
      - campaign_design_record
      produces:
      - hardware_attempt_log
      activities:
      - Pre-attempt tier-0 bring-up ladder, once per tip, every rung uncharged (cpu_mode or
        diagnostic class) and recorded in the attempt log before the serving grant -
        (a) the declared test paths collect and pass on the tip (the changeset's
        whole-tree record when the tip is the reviewed commit, a re-run otherwise);
        (b) every graph the launch compiles extracts device-free; (c) one rank loads
        its compiled graph on one device; (d) the per-process host footprint read from
        that load, times the launch's world size, fits the host memory pool the launch
        reserves; (e) one request passes the runner's request path in CPU mode. A
        failed rung is fingerprinted with the rung named; a product-source cause exits
        product_defect_found, any other is this node's to repair.
      - Pre-attempt tier-1 check against both fingerprint sources; design each attempt to
        differ materially from every fingerprinted failure. Pre-attempt
        tier-2 check against the per-target count.
      - Launch each attempt under its own job lease for the capacity it takes -
        none when it takes none (host preparation states the rule) - in-band over
        one-shot SSH; narrate transcripts into the attempt log; read results from
        stable artifacts, never first-sighting signals.
      - On failure, record a one-file-per-event fingerprint (failure class, signature,
        attempt configuration) and increment the per-target attempt count with
        this route named, unless the failure's cause is host-level - the fingerprint
        is still recorded; faults are never charged to the per-target budget.
      - On tier-1 early exhaustion, write the enumeration breaker_tripped names.
      - Dispatch delegates only through the guardrail wrapper (remedy interception,
        benchmark scope restriction).
      - A failure inside the attempt's own test, control, launcher, checker, or
        bundle is this node's to repair with no lead word - diagnosis and fix recorded together
        in the attempt log and committed; only a product-source change leaves the
        loop, as product_defect_found.
      allowed_effects:
      - In-band SSH compile and serve runs on the leased host using the campaign
        venv and the shared multi-writer-safe compile cache.
      - Job lease grant and release through the hardware queue tool.
      - Writes to the attempt's own tests, controls, launchers, checkers, and bundles
        in the campaign worktree, committed on the campaign branch.
      - Guardrailed delegate dispatch.
      forbidden_effects:
      - Clearing or bypassing the shared compile cache, including via a delegate's
        documented remedy.
      - Identical retry of a fingerprinted failure.
      - A serving-class launch on a tip without a passing record for every bring-up rung.
      - Use of the host beyond what the attempt's job lease reserves.
      - Out-of-band handoff files for hardware gates.
      - Provisioning any instance, or letting a delegate do so.
      outcomes:
        candidate_serving:
          meaning: The candidate engine compiles and serves inference on the leased
            host - decided by the serving transcript (request/response pairs actually
            returned by the engine) and the in-band gate's machine-readable result
            recorded in the attempt log, never by the implementer's claim; downstream
            measurement independently re-exercises the endpoint.
          required_evidence:
          - hardware_attempt_log
        breaker_tripped:
          meaning: The tenth budget-counted hardware attempt on this target since
            the last re-derivation completed without a serving candidate - or
            tier 1 leaves no materially different attempt to launch, recorded
            as an early-exhaustion enumeration of the attempted configuration
            space with the reason no material variation remains (falsifiable by
            rederive_approach against the same fingerprint records) - decided
            by the attempt count and fingerprint records; maps to the parent's
            breaker_tripped. Yields to host_faulted when the final attempt's failure
            is host-caused (precedence in purpose).
        host_faulted:
          meaning: The leased host failed under an attempt (unreachable, device
            or memory exhaustion, stuck runtime) and needs recovery before the
            loop can continue; the triggering attempt's fingerprint is recorded
            first. Takes precedence over breaker_tripped on the threshold-reaching
            attempt. Every attempt in flight on the host at the fault, this
            campaign's or another's, is host-faulted and never charged to the
            per-target budget - except an attempt whose transcript or fault telemetry
            names its own use beyond its job lease, which is a failed attempt, fingerprinted
            and charged; the count already standing from earlier budget-counted
            attempts is never rolled back - that standing count is what re-trips
            the stop limit on resume.
        product_defect_found:
          meaning: A bring-up rung or an attempt failed for a cause in product source, named in
            the fingerprint with its file set; scoping mints the repair item and the
            loop re-enters on the repaired tip (a kernel-class repair carrying its
            review) while the lease and host stand. Yields to host_faulted when the failure is
            host-caused.
      instance_per: approved_campaigns
    measure_candidate:
      intent: execute
      instance_per: approved_campaigns
      roles:
      - measurer
      - delegate_dispatcher
      purpose: Three steps in one seat, in order - procedures, baseline, runs - the
        first two before any measured run against the candidate. Procedures - turn
        the pre-registered comparator set in this campaign's design record into
        runnable measurement procedures (the kickoff-declared acceptance procedures
        for this campaign's route; upgrade routes execute the regression matrix
        instead of correctness+perf), each with a fixed invocation, declared inputs,
        and a declared output shape, smoke-verified end-to-end on scratch inputs, the
        same smoke run recording the procedure FAILING on its registered known-bad
        input. The measurer implements what the design record froze; it never
        chooses or alters a comparator. Baseline - produce the GPU-baseline side of
        every declared comparison, strictly read-only on the named GPU baseline over
        in-band SSH - reference outputs captured against the inputs the registration
        record names, using the fixed procedures, with the baseline-skew record (the
        GPU-side vLLM version read live plus the kickoff-recorded known cross-version
        behavior differences) written into the capture. When the route declares no
        GPU-baseline comparator, record the justified skip. Runs - execute the
        smoke-verified procedures against the serving candidate on this campaign's
        leased Neuron host(s) over in-band SSH, exactly as pre-registered - the
        measurer executes, never chooses. A run that exposes a defective procedure
        (it measured the wrong property, or its runner could not carry a run to its
        record while the host and the candidate stood) or a missing or defective
        baseline reference returns to the step that owns it, never a patch in the
        run - revise only the defective implementation against the frozen
        comparator, re-smoke it, record the revision (revision entries VERSION each
        implementation and NAME the comparisons a revision touches), and re-capture
        only the comparisons whose procedure changed, or re-capture the one named
        reference; unchanged procedures and captures stand; a defective
        implementation invalidates the reference captured with it and every number
        it produced, so its repair runs before a reference repair. Then assemble the
        evidence bundles and decide their completeness before any verdict. A re-entry
        (a performance shortfall, a code finding, a correctness shortfall re-serve,
        unstable evidence, an evidence gap) with the acceptance registration, every
        procedure with its smoke record, and the baseline captures digest-equal to
        the prior entry's starts at the runs step - a lead-run check, the equality
        recorded in the seat's brief and in the outcome row this entry ends with - and
        only a changed procedure
        re-smokes and re-captures its comparisons, because re-smoking an unchanged
        procedure proves nothing new and costs a seat per lever. Every run record
        stamps the measured git
        revision read at measurement time from the checked-out commit on the leased
        host (a git-issued identifier, never a branch name), plus the invocation,
        configuration, and environment used. Each bundle - one file per event under
        the campaign measurements directory - names the GPU-side vLLM version and the
        known cross-version behavior differences from the skew record, carries the
        measured revision copied verbatim from the run records (never minted or
        rewritten here), links the pre-registered comparator and procedure it
        implements, and records per criterion the threshold that was evaluated with
        the value read and the result of the comparison, plus the negative-control
        result from that procedure's smoke record - an exit status is not an
        evaluation. The served profile's per-op attribution at the declared shapes is
        one declared measurement, and the utilization cap per engine it shows is
        written as one row file per served profile under the hardware calibration
        record (the layout reference fixes the shape, because campaigns measure
        concurrently and a shared file would race); the measurer then re-rates the
        design's predicted rows under that cap into the bundle - a mechanical step,
        each predicted time scaled by the ratio of the cap row it was priced under to
        the served cap row - so the adjudicator judges components against evaluated
        records and never re-rates. Completeness is checked against the kickoff-declared acceptance
        procedures for this campaign's route, on a bundle read after its producer
        exited and its mtime settled - never a first sighting. A no-regression
        criterion for a served phase the campaign did not target is evaluated by
        compiled-program digest equality against the target base when the base's
        programs at that configuration are on disk - both digests in the bundle, no
        run, because an unchanged program cannot regress - and by its declared
        procedure when they are not or the digests differ. A bundle that is
        missing or incomplete is re-collected, and a procedure or reference defect
        repaired, inside this node within the shared per-measurement repair budget -
        derived by counting defect-record files by path, magnitudes pinned once at
        references/artifact-layout.md section 4.4, never a stored counter. Outcome
        precedence when several hold - serving_exhausted first (nothing here
        executes without the leased serving state); procedure_unrealizable second;
        baseline_unusable third; declared_measurement_unproducible fourth (only when
        NO declared measurement retains repair budget); bundles_stable last. The two
        permissions stay separate - smoke runs write scratch on leased Neuron hosts;
        the GPU baseline is read-only, always (the operational definition and its
        capture-launch boundary ruling live once at references/artifact-layout.md
        section 4.10). Out of scope - any verdict on the numbers produced; any
        durable host-state mutation on the baseline, ever.
      consumes:
      - hardware_attempt_log
      - campaign_design_record
      produces:
      - measurement_procedure_record
      - baseline_reference_capture
      - candidate_measurement_runs
      - measurement_artifacts
      - hardware_calibration_record
      activities:
      - Read the frozen comparator set and route-scoped acceptance procedures from
        the design record; enumerate every declared measurement this campaign must
        produce.
      - Implement each declared measurement as a runnable procedure with a fixed
        invocation, reusing verified in-repo primitives where they match the declared
        method and building thin harnesses where no repeatable procedure exists.
        Implement no procedure that reproduces a trap recorded in
        references/measurement-pitfalls.md; where a trap is in what the procedure
        counts, swapping the check tool that exposed it is not the remedy.
      - Smoke-verify every procedure end-to-end on scratch inputs; record the smoke
        evidence, the fixed invocation, and the known-bad-input failure per procedure.
      - Verify the baseline instance identity and read its live vLLM version; refuse
        to capture if it contradicts the kickoff record.
      - Run the fixed reference-capture procedures against the inputs the registration
        record names, each confirmed against the identity it declares; record outputs
        one file per event with the baseline-skew record.
      - Write the served utilization cap per engine from the served profile as one
        row file per profile under the calibration record, with the profile's run
        record; re-rate the design's predicted rows under it into the bundle.
      - Confirm the candidate serves per the attempt log; read and record the
        checked-out commit's git-issued revision identifier before the first measured
        run.
      - Execute each declared measurement's fixed invocation - a correctness
        ladder's rungs in registered order, stopping at the first failed rung and
        writing each later rung and each performance procedure its own bundle with
        the record "not run after rung n failed", so the bundles stay complete and the
        verdict can name the rung, because a later rung costs a lease and tells
        nothing the failed rung has not; write raw outputs one
        file per event, each stamped with the measured revision, invocation, and
        environment.
      - Write every defect finding (procedure, reference, or collection) as its own
        event file under the runs directory, so the shared per-measurement repair
        budget stays derivable by counting defect-record files by path; repair a
        procedure or reference defect at its own step while the budget lasts.
      - On a lost serving state, re-establish serving from the recorded attempt
        recipe within the declared retry bound, re-verify the checked-out revision,
        then resume.
      - Assemble one evidence bundle per declared measurement once its producer has
        exited; re-collect a defective bundle while its budget lasts.
      - When a measurement's shared repair budget is spent at either tier's threshold,
        record the defect and complete forward; never route backward at a threshold.
      allowed_effects:
      - In-band SSH to this campaign's leased Neuron hosts, smoke verification
        included.
      - Read-only use of the named GPU baseline over in-band SSH, for the reference
        capture only.
      - Writes under this campaign's measurements artifact directory, and the served
        cap row under the run's calibration artifact directory.
      forbidden_effects:
      - Choosing or altering comparators after measurement begins.
      - Any write, reboot or reset on the GPU baseline - it is read-only, always.
      - A measured run against the candidate recorded as campaign evidence before
        its procedure's smoke record and its reference capture (or justified skip)
        exist.
      - Editing the candidate checkout or switching its revision.
      - Minting or altering a measured revision value.
      - Any verdict on the numbers packaged.
      outcomes:
        bundles_stable:
          meaning: Every declared measurement for this campaign's route has a
            runnable, smoke-verified procedure with a fixed invocation and a
            negative-control result for its registered known-bad input, every
            declared GPU-baseline comparison has its reference side captured with
            the skew record (or a justified skip recorded for a route that declares
            none), and every kickoff-declared measurement exists as a complete
            evidence bundle carrying its evaluated-threshold record - or, behind a
            failed ladder rung, the "not run after rung n failed" record, which is
            complete for a stopped rung - and the measured revision from its run
            records. Taken last in the precedence order.
          required_evidence:
          - measurement_procedure_record
          - baseline_reference_capture
          - candidate_measurement_runs
          - measurement_artifacts
        procedure_unrealizable:
          meaning: A declared measurement has no realizable procedure (capability
            gap, including an unusable declared method); routed to re-derivation
            with the evidence. A lost serving state at any step is serving_exhausted.
        baseline_unusable:
          meaning: The named baseline is unreachable, contradicts the kickoff
            record, would require a reset to proceed, a named capture input's live
            identity contradicts the registration record, or the serving stack the
            capture must launch would write a cache to a persistent location that
            cannot be redirected to run-scoped scratch; routed to re-derivation
            with the evidence.
        serving_exhausted:
          meaning: The serving state cannot be re-established within the declared
            retry bound (suggested two bring-up retries per lost serving state) at
            any step - smoke verification or measured run; takes precedence over
            every co-held outcome and routes to re-derivation with the full defect
            trail as evidence.
        declared_measurement_unproducible:
          meaning: A declared measurement cannot be produced after its shared repair
            budget is spent at either tier; routed to re-derivation with the
            evidence. Decides only when NO declared measurement retains repair
            budget.
  edges:
  - id: preconditions_to_calibration
    from: verify_run_preconditions.preconditions_met
    to: calibrate_hardware
    checks:
    - preflight_record_complete
    rationale: The calibration record is the first device act of a run, before any
      route is costed, because every cost row downstream cites it; on a pin that
      already has a record the node is a lead-run check and costs nothing.
  - id: calibration_to_delta_scan
    from: calibrate_hardware.calibration_recorded
    to:
      fan_out: trace_target_delta
      for_each: requested_targets
    rationale: One tracer per requested target; a re-trace is the reports_insufficient
      row that named the target, so the one-re-trace bound is counted from the rows,
      never from a stored integer.
  - id: calibration_unproducible_to_pause
    from: calibrate_hardware.calibration_unproducible
    to: run_paused
  - id: missing_inputs_to_pause
    from: verify_run_preconditions.inputs_missing
    to: run_paused
  - id: trace_traced_to_costing
    from: trace_target_delta.target_traced
    to: cost_routes_and_rank_backlog
  - id: trace_unreachable_to_costing
    from: trace_target_delta.source_unreachable
    to: cost_routes_and_rank_backlog
    rationale: The partial per-target record is preserved; the run-level reachability
      verdict is decided at costing under its declared outcome precedence.
  - id: insufficient_reports_to_retrace
    from: cost_routes_and_rank_backlog.reports_insufficient
    to:
      fan_out: trace_target_delta
      for_each: deficient_targets
    rationale: Only the named deficient targets re-trace, each under the grant its
      grant file records; one re-trace per target, then the
      gap is recorded as residual.
  - id: unreachable_sources_to_pause
    from: cost_routes_and_rank_backlog.sources_unreachable
    to: run_paused
  - id: stalled_costing_to_pause
    from: cost_routes_and_rank_backlog.costing_stalled
    to: run_paused
  - id: backlog_to_kickoff
    from: cost_routes_and_rank_backlog.backlog_ranked
    to: assemble_kickoff_contracts
  - id: route_findings_to_recosting
    from: assemble_kickoff_contracts.material_findings
    to: cost_routes_and_rank_backlog
  - id: approved_campaigns_fan_out
    from: assemble_kickoff_contracts.contracts_ready
    to:
      fan_out: design_campaign
      for_each: approved_campaigns
    checks:
    - kickoff_contract_approved
    - scheduling_holds_recorded
  - id: no_campaigns_to_abort
    from: assemble_kickoff_contracts.no_campaign_approved
    to: run_aborted
  - id: design_to_design_review
    from: design_campaign.design_ready
    to: review_campaign_design
    state_effects:
    - The lead commits the pre-registered comparator set into comparator_registrations
      on consuming this edge, with the registration timestamp the comparators_preregistered
      check compares. The commitment lands before gate 2 because design_approved_by_user
      reads the registration as byte-unchanged across re-entries.
  - id: infeasible_design_to_closeout
    from: design_campaign.infeasibility_recorded
    to: close_campaign
    checks:
    - pin_infeasibility_socratic_guard
    rationale: The guard holds the expensive false-infeasibility direction; the lead
      evaluates it, never the note's author.
  - id: design_blocked_to_rederivation
    from: design_campaign.design_blocked
    to: rederive_approach
    rationale: Every design stop - recurring finding with no lever, bounded-context
      breach, unadjudicable criterion or cell, recurring record gap - is a kickoff
      or approach question, and re-derivation is the only in-graph move.
  - id: sound_design_to_implementation
    from: review_campaign_design.design_sound
    to: scope_next_increment
    checks:
    - design_approved_by_user
  - id: design_findings_to_redesign
    from: review_campaign_design.material_findings
    to: design_campaign
    checks:
    - design_loop_within_bound
    rationale: Full-round re-entry - the repair touches the parts the findings name; a
      finding that a capability is absent at the pin assembles the infeasibility
      variant.
  - id: narrow_design_repair
    from: review_campaign_design.narrow_findings
    to: design_campaign
    checks:
    - design_loop_within_bound
    - narrow_delta_scoped
    rationale: Block-scoped repair - the brief names the surfaces the findings name;
      a registered-value touch gets the value-level read; the block diff rides
      design_to_design_review back to the same gate under the standing approval.
  - id: selected_to_realization
    from: scope_next_increment.increment_selected
    to: realize_increment
  - id: plan_satisfied_to_hardware
    from: scope_next_increment.plan_satisfied
    to: prepare_host
    checks:
    - changeset_complete
    rationale: The kernel reviews inside realize_increment are the code review before
      hardware; the lead's changeset scans, the kernel records and the whole-tree test
      record close the gate. A gap fails changeset_complete back into scoping as a
      coverage-gap item with its class.
  - id: design_defect_to_redesign
    from: scope_next_increment.plan_unrealizable_as_designed
    to: design_campaign
  - id: implementation_scope_to_redesign
    from: scope_next_increment.plan_exceeds_node
    to: design_campaign
  - id: user_criteria_change_to_redesign
    from: scope_next_increment.criteria_changed_by_user
    to: design_campaign
    rationale: A frozen value moves only by the user's word (P9); this edge is that
      word's door back to the register step, so the lead never re-opens design by hand.
  - id: impl_no_progress_to_rederivation
    from: scope_next_increment.no_new_route
    to: rederive_approach
  - id: passed_to_next_scoping
    from: realize_increment.increment_passed
    to: scope_next_increment
  - id: stuck_to_rescoping
    from: realize_increment.increment_stuck
    to: scope_next_increment
    rationale: Scoping re-selects with the persisted investigation record or detects
      no-progress from the round history.
  - id: contradiction_to_redesign
    from: realize_increment.evidence_contradicts_design
    to: design_campaign
  - id: host_ready_to_attempts
    from: prepare_host.host_ready
    to: execute_attempt_loop
  - id: lost_hardware_to_closeout
    from: prepare_host.no_host_available
    to: close_campaign
  - id: replication_dead_end_to_rederivation
    from: prepare_host.replication_failed
    to: rederive_approach
    rationale: Recipe dead ends are approach-level and route to the stop limit path.
  - id: serving_candidate_to_measurement
    from: execute_attempt_loop.candidate_serving
    to: measure_candidate
    checks:
    - comparators_preregistered
  - id: breaker_to_rederivation
    from: execute_attempt_loop.breaker_tripped
    to: rederive_approach
  - id: attempt_host_fault_to_recovery
    from: execute_attempt_loop.host_faulted
    to: prepare_host
    rationale: Recovery mode - host preparation restores the host under the standing
      lease and continues in probe-only mode, or gives it up and re-leases in full
      mode; both ends of a recovery already landed in host preparation, which is why
      recovery is its step and not a node.
  - id: attempt_defect_to_repair
    from: execute_attempt_loop.product_defect_found
    to: scope_next_increment
    rationale: A product-source cause is a repair increment with its declared
      acceptance before the next serving launch.
  - id: unrealizable_procedure_to_rederivation
    from: measure_candidate.procedure_unrealizable
    to: rederive_approach
  - id: unusable_baseline_to_rederivation
    from: measure_candidate.baseline_unusable
    to: rederive_approach
  - id: measurements_to_adjudication
    from: measure_candidate.bundles_stable
    to: adjudicate_results
    checks:
    - procedures_smoke_verified
    - revision_stamped
    - acceptance_threshold_evaluated
    - measurer_not_adjudicator
    rationale: procedures_smoke_verified reads the smoke records against the run
      records here, where the ordering it asks about is on disk; the procedures
      step is this node's own, so the check sits at the exit of the node that holds
      both steps instead of the entry of a second node.
  - id: serving_exhaustion_to_rederivation
    from: measure_candidate.serving_exhausted
    to: rederive_approach
  - id: unproducible_measurement_to_rederivation
    from: measure_candidate.declared_measurement_unproducible
    to: rederive_approach
  - id: passed_gates_to_pr_prep
    from: adjudicate_results.gates_passed
    to: prepare_pr
  - id: shortfall_to_repair
    from: adjudicate_results.correctness_shortfall
    to: scope_next_increment
  - id: no_benefit_to_closeout
    from: adjudicate_results.no_benefit
    to: close_campaign
  - id: perf_shortfall_to_redesign
    from: adjudicate_results.performance_shortfall
    to: design_campaign
    rationale: An attributed component measured over its predicted cost, or served
      time no row predicted, is a cost-model miss; the design re-enters block-scoped
      for the named components' rows, never the whole plan, and the gate-2 approval
      stands while no registered value moves.
  - id: regression_to_repair
    from: adjudicate_results.regression_failed
    to: scope_next_increment
  - id: unstable_evidence_to_remeasure
    from: adjudicate_results.evidence_unstable
    to: measure_candidate
  - id: pr_package_to_pr_review
    from: prepare_pr.pr_package_ready
    to: review_pr_evidence
  - id: evidence_gap_to_remeasure
    from: prepare_pr.evidence_gap_found
    to: measure_candidate
  - id: pr_no_progress_to_rederivation
    from: prepare_pr.no_progress
    to: rederive_approach
  - id: reviewed_pr_to_closeout
    from: review_pr_evidence.pr_ready
    to: close_campaign
    checks:
    - impl_commit_is_reviewed
  - id: pr_findings_to_package_repair
    from: review_pr_evidence.material_findings
    to: prepare_pr
  - id: pr_code_findings_to_repair
    from: review_pr_evidence.code_findings
    to: scope_next_increment
    rationale: Scoping mints repair items keyed on the finding triples, so the
      no-progress detector sees them; the repaired tip re-serves and re-measures.
  - id: revised_approach_to_redesign
    from: rederive_approach.revised_approach
    to: design_campaign
  - id: rederived_closeout_to_gate
    from: rederive_approach.close_out_recommended
    to: close_campaign
  - id: closure_to_run_verification
    from: close_campaign.closure_recorded
    to: verify_run_closure
  - id: declined_closure_to_rederivation
    from: close_campaign.closure_declined
    to: rederive_approach
  - id: unverified_closure_to_closeout
    from: verify_run_closure.closure_unverified
    to:
      fan_out: close_campaign
      for_each: discrepant_campaigns
    rationale: Re-entry re-executes the SAME closure type and re-presents gate 3.
  - id: verified_run_to_complete
    from: verify_run_closure.run_closed_complete
    to: run_complete
  - id: open_campaigns_to_join
    from: verify_run_closure.campaigns_remaining
    to: await_remaining_closures
  - id: resumable_stop_to_pause
    from: verify_run_closure.resumable_stop
    to: run_paused
  - id: no_route_to_blocked
    from: verify_run_closure.no_route_remains
    to: run_blocked
  control_nodes:
    run_complete:
      kind: terminal
      meaning: Every gate-1-approved campaign reached exactly one verified gate-3
        closure and the cross-run artifacts reflect each closure.
      terminal_status: accepted
    run_paused:
      kind: pause
      meaning: The user pauses, a required input, source, or hardware capability
        is unavailable, or intake costing stalls and awaits user direction; resumable
        state preserved.
      resumable: true
    run_blocked:
      kind: terminal
      meaning: A required capability, resource, or authority is unavailable and
        no declared route remains.
      terminal_status: blocked
    run_aborted:
      kind: terminal
      meaning: The user stops the run before the approved campaign set closes;
        the terminal record preserves the user's verbatim reason - a gate-1 declination
        is recorded verbatim, never paraphrased.
      terminal_status: closed_unaccepted
    await_remaining_closures:
      kind: join
      meaning: Hold until every approved campaign instance reaches its verified
        closure; run-closure verification re-runs at each closure.
  write_limits:
    deny:
      - glob: "/Users/jinhun/GitHub/pave/*"
        bound_to: [lead]
        reason: "The workflow's own package repository is the user's; a lead that releases into it ships an unreviewed graph change."
        remedy: "Read it with the file-read tool; write the change as a proposal under the revision folder's proposals/ and hand the release command to the user."
        created_by: "v16"
      - glob: "/Users/jinhun/.claude/projects/*/memory/*"
        bound_to: [lead]
        reason: "Memory is the user's record of standing directives; a lead that edits it widens its own authority."
        remedy: "Read it with the file-read tool; put the proposed line in one message to the user, who writes it."
        created_by: "v16"
    caps: []
  state:
    required:
    - workflow_identity
    - pinned_release
    - requested_targets
    - instance_roster
    - cross_run_artifact_refs
    - ranked_backlog
    - approved_campaigns
    - campaign_states
    - campaign_target_pins
    - scheduling_holds
    - comparator_registrations
    - hardware_attempt_counts
    - hardware_lease_record
    - gate_approval_records
    - active_node_runs
    - completed_outcomes
    - evidence_references
    - open_questions
    - final_status
    fields:
      cross_run_artifact_refs:
        meaning: References to the four cross-run artifacts - the parity scorecard,
          the backlog, the debt list, and the repo-tracked failure-fingerprint
          file - loaded at intake and updated only by the lead's serialized writes
          at campaign closure. The fingerprint file lives at the concrete repo-tracked
          path declared in the artifact layout reference; an absent file reads
          as a legitimate empty set, never an error.
      discrepant_campaigns:
        meaning: Derived per run-closure verification round from the current run_closure_verdict
          - the campaigns whose claimed closure failed first-hand verification;
          the closure_unverified fan-out reads it. Never stored independently
          of the verdict record.
      pinned_release:
        meaning: Frozen at intake - base version, release-branch name, SDK and
          compiler versions. The single pin authority for the run; graph text
          never names these values.
      approved_campaigns:
        meaning: Fan-out collection - one entry per gate-1-approved campaign with
          target, route, source, type, and kickoff-contract reference.
      campaign_target_pins:
        meaning: Per-campaign target base - equals the run's frozen pinned_release
          for backport-route campaigns; the kickoff-declared upgrade base for
          upgrade-route campaigns. Values are run inputs, never graph text.
      scheduling_holds:
        meaning: Per-campaign predicted file surfaces and the serialization holds
          the lead derives from them - campaigns with overlapping surfaces serialize,
          and an upgrade-route campaign holds all others while it runs exclusively.
          Empty while one campaign is approved; otherwise re-derived under the lead's
          standing scheduling authority whenever a campaign design refines its
          predicted surface.
      instance_roster:
        meaning: Run input frozen at intake - each host's identity markers, target
          class, and non-shareable pools with sizes (Neuron devices, host memory
          for compilation, CPU cores, the compile-cache write slot, any other the
          run names).
          Values are run inputs, never graph text. A pool the roster leaves unsized
          is indivisible - a job that declares a need for it reserves the host whole - so a roster
          that sizes no pools behaves as one job per host.
      hardware_lease_record:
        meaning: Pointer to the lease records - one file per event in the attempt
          logs, keyed by host and, like the recovery records beside them, readable
          by every campaign leasing that host, written only by the hardware queue
          tool - campaign leases,
          job leases with the pools and amounts reserved, releases, and boot-identifier
          amendments. Remaining capacity per host is derived from open job leases
          (grants without a release), never stored here.
      hardware_attempt_counts:
        meaning: Per-target count of budget-counted hardware attempts across every
          route that spends them (the attempt loop, the venv recipe); the tier-2 stop
          limit reads it at every 10 since the last re-derivation. The one count rule,
          recomputable from the attempt records alone. Four run classes, each the
          job's declared purpose at launch and a field of its record, never a note
          added after the run - serving (a run that opens a Neuron device to make a
          candidate serve, or a venv build toward one), diagnostic (a device run that
          compiles no new graph on the device, serves no request and decides nothing
          about the candidate's acceptance - reading state out of a served tip's
          graphs, or loading one rank of a tip's compiled graph as a bring-up rung),
          kernel_alone (a device run that compiles and times one kernel or micro-form
          in isolation - a calibration row, a design anchor, or an increment's ratio
          measurement - serves no request and decides nothing beyond that increment's
          own acceptance), cpu_mode (opens no device). Only a serving attempt counts, and
          not when a host fault ended it. A measurement run is measure_candidate's
          own record and never enters this count.
      campaign_states:
        meaning: Pointer per campaign to its own state and evidence directory
          (one-file-per-event); never inlined into run state.
      deficient_targets:
        meaning: Derived per costing round from the run-level delta index - the
          named targets whose reports fail the costing-sufficiency rubric with
          re-trace bound unexhausted; the reports_insufficient fan-out reads it.
          Never stored independently of the index (mirrors discrepant_campaigns).
    checkpoint:
      after_every_consequential_transition: true
  completion:
    acceptance: Every gate-1-approved campaign closed through gate 3 as exactly
      one declared closure, each verified against external evidence, with
      all four cross-run artifacts updated.
    closure: The run records an honest final status and preserves open
      risks, discoveries, and resumable state.
