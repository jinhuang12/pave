[pytest]
filterwarnings =
    ignore::DeprecationWarning:_yaml
    ignore:.*_distutils_hack:pytest.PytestAssertRewriteWarning
    ignore::pytest.PytestUnknownMarkWarning
log_level = INFO
log_format = %(asctime)s %(levelname)s [%(process)d| __worker_id__] [%(name)s]: %(message)s (%(filename)s:%(lineno)s)
log_date_format=%Y-%m-%d %H:%M:%S

# Arm the (wall + CPU) timeout watchdog only around the test function call,
# excluding setup and teardown (teardown does slow rmtree IO).
timeout_func_only = true

markers =
    trace_only: marks tests as trace-only (run with kernel tracer, not on hardware)
    compile_only: marks tests as compile-only (compile kernel without execution)
    compile_and_infer: marks tests to compile and run inference on hardware
    simulation: marks tests to run in CPU simulation mode
    fast: marks test as fast-running using manual test vectors only
    slow: marks test as slow-running
    slow_simulation: marks test as slow for CPU simulation (large tensor shapes)
    coverage_parametrize: test parametrization with configurable coverage strategies
    platforms(exclude): skip when --platform-target matches an excluded platform
    high_rank: marks test as requiring more than a single core
    model: marks test as model-derived configuration
    tier0: marks test as TIER0 model config
    optimal: marks test as OPTIMAL model config
    generality: marks test as GENERALITY model config
    broad: marks test as BROAD model config
