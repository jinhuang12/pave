  semantic_diff: 'Base: revision 0, digest sha256:ca4687d250562775bab77bf8efcd27c92eddcb93bd5dd20381d59803f917a4be.
    Post-wave-1 name re-diff of the graph against the final skills/ammo/SKILL.md,
    orchestration/*.md, agents/*.md, and scripts/transitions.json. Counts: 13 nodes,
    47 edges, 45 outcomes, 13 roles, 5 control nodes unchanged; checks 30 become 31;
    evidence definitions 15 become 16. 10 hunks, 69 added lines against 27 removed;
    1314 lines become 1356. Every stage, audit, gate, outcome token, and status name
    was already 1:1; the drift was in role text only. (1) Spawn addresses: the nine
    agent-backed role purposes name the plugin address ammo:<role> (references/harness-binding.md),
    for example ammo:ammo-auditor. (2) Stage 7b fact-check: the report writer no longer
    runs it. The lead spawns a fresh ammo-delegate as the fact-checker after the writer
    returns, with only the plugin_root line, the artifact_dir line, and the unchanged
    assignment in agents/ammo-report-writer.md, and writes report_assets/report_fact_check.json
    with ok, findings, and report_sha256 (SKILL.md Stage 7b). Role report_fact_checker
    now says so; ammo_report_writer gains two forbidden effects (spawn the fact-checker,
    write the record); ammo_delegate names the separate fact-check seat. New evidence
    report_fact_check, produced by stage_7b_report and required by report_accepted.
    Check report_fact_check_ok keeps its evaluator and gains the ok:false repair loop
    as on_failure. New lead check report_fact_check_current (ok true, empty findings,
    report_sha256 equal to the current REPORT.md bytes) guards both report_accepted
    edges.'
