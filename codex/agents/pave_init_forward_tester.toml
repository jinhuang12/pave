Ignore YAML frontmatter in the role file. Treat its Markdown body as your complete role contract.
Apply the Codex binding to installation and `codex exec` launch mechanics. Preserve clean-room isolation, no-live-mutation, no-expected-answer, evidence, degradation, and return requirements. Inherit the real session model and reasoning defaults.
