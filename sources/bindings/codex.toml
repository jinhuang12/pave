version = 1
harness = "codex"
agent_output_kind = "toml"

[skills.orchestrate]
template = "sources/orchestrate/SKILL.md.tmpl"
output = "codex/skills/orchestrate/SKILL.md"

[skills.orchestrate.slots]
FRONTMATTER = '''---
name: orchestrate
description: >-
  Turn yourself into a pure orchestrator for any complex task. Decompose the
  goal into independent subtasks, run them in parallel on gpt-6.1-sol
  `orchestrate-worker` agents, and give each group of 2-3 workers a shared
  gpt-6-astra `adversarial-investigator` that reviews their work until it PASSes.
  Use this skill whenever a task has 3 or more independent parts, spans many
  files or components, would take one agent more than roughly an hour, or when
  the user asks, in any wording, to split the work across parallel agents
  (including "/orchestrate"). Also use it when a
  task mixes unrelated domains (e.g. backend + frontend + docs) even if the
  user never mentions parallelism. Do not use it for single-file edits,
  trivial fixes, or tasks whose steps are strictly sequential with no parallel
  width. Registers two lead-only plugin hooks: a goal restate on session
  resume and after compaction, and a speed-up question at most every 10
  minutes. They never block.
---'''
PEER_MESSAGES = "direct messages"
RESOURCE_PATHS = '''`$SKILL` in this file means the shared script directory `<PAVE_PLUGIN_ROOT>/skills/orchestrate`. Resolve PAVE_PLUGIN_ROOT three directories above this skill directory (`<root>/codex/skills/orchestrate` to `<root>`). These are placeholders, not environment variables, so write literal absolute paths in commands. References/ paths resolve beside this Codex SKILL.md, under `<PAVE_PLUGIN_ROOT>/codex/skills/orchestrate/`; scripts/ and hooks/ resolve under `$SKILL`. Supply `ORCHESTRATE_ROOT: <absolute shared script directory>` in agent briefs.'''
LOG_COMMAND = "python3 $SKILL/scripts/orchestrate_log.py --runtime codex"
ISOLATION = "give each an explicit separate Git worktree"
TEAM_MODELS = '''Workers use `pave-init:orchestrate-worker` on `gpt-6.1-sol` with `xhigh`; DAs use `pave-init:adversarial-investigator` on `gpt-6-astra` with `xhigh`. Use `fork_turns: "none"` so each installed custom agent keeps its own model and effort. See `references/model-seats.md` for the runtime-specific dispatch rules. Count available agent slots before dispatch; retained agents and research helpers count too. Reduce the wave or investigate without helpers when capacity is insufficient.'''
PREFLIGHT = '''**Pre-flight first.** Run `python3 <PAVE_PLUGIN_ROOT>/codex/orchestrate_preflight.py --project <working directory>` to check installed roles and shared resources. Then check the live session: `spawn_agent`, `followup_task`, `send_message`, `list_agents`, `wait_agent`, and `interrupt_agent` must be available, and the custom-agent list must include `pave-init:orchestrate-worker` and `pave-init:adversarial-investigator`. File checks do not prove live availability. If either check fails, report the setup commands in `codex/README.md`; do not install roles or alter trust automatically.'''
SPAWN_RUNTIME = '''Spawn every agent through `spawn_agent` with its installed `agent_type`, a unique `task_name` such as `worker_1` or `da_1`, and `fork_turns: "none"`. Retain the canonical task paths returned by the tool; labels such as worker-1 and da-1 remain the run-log IDs. Record the lead, worker, and reviewer paths in each PLAN entry so Resume can match log IDs to the live roster. Include the actual lead and reviewer paths in every subtask, and update reviewers with worker paths as workers start. Do not assume the lead is `/root` when this orchestrator is nested. After spawning, call `list_agents` once and confirm the roster. If direct peer delivery fails, broker through the lead (Step 4).'''
SPAWN_ORDER = "using independent calls concurrently where the runtime permits"
SPAWN_ADDRESSES = '''Read `references/protocol.md` for the exact DA spawn prompt and `references/subtask.md` for the worker subtask. Set `Orchestrator` and `Reviewer` to their actual canonical task paths, and supply `ORCHESTRATE_ROOT`. Read applicable skills from their listed SKILL.md files.'''
SPAWN_EXAMPLE = '''spawn_agent(task_name: "da_1", agent_type: "pave-init:adversarial-investigator", fork_turns: "none", message: <DA prompt from protocol.md>)
spawn_agent(task_name: "worker_1", agent_type: "pave-init:orchestrate-worker", fork_turns: "none", message: <subtask>)'''
MONITOR_DELIVERY = '''Workers and DAs talk directly using their canonical task paths. For every actionable brief, verdict, relay, or reassignment to a worker or DA, use `followup_task(target=<canonical path>, message=<full message>)`; it wakes an idle peer. Passive `send_message` does not wake an idle agent. Workers and DAs send lead events with `send_message`.

Keep the lead active and use bounded `wait_agent` waits for arrivals; do not end the lead turn while required work remains. Do not poll with `list_agents` or "are you done?" messages. Two kinds of traffic arrive:

- **Turn completions.** A worker ending with `WAITING worker-N: round R sent to da-M` is waiting for its DA, not DONE.
- **Messages.** These are the events. Act only on a message whose first line is one of these:'''
PROVIDER_FAILURE = '''**Provider failures.** An explicit runtime failure or confirmed dead agent means the worker died mid-task, and its files may be half-written. Spawn a replacement under the **next unused index** (`worker-7`, never a reused name), with the same subtask plus a line saying which files the dead worker may have touched, and tell its DA the new canonical path. Log it as `append RESPAWN <old> "-> <new> | <reason>"`. A new Codex agent does not imply a different provider identity or quota.'''
ASK_USER = "a bounded plain-text question, or `request_user_input` when it is available"
HELPERS = '''Spawn helpers with `spawn_agent` (`agent_type: "pave-init:research-delegate"`, `fork_turns: "none"`) within the capacity you counted for them. Start each brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>` and collect the reports with `wait_agent`. That role reports evidence only, so you write every Step 1b draft yourself.'''
SIMPLIFY = '''Give four helpers the plan file, one question each: does a draft reuse what already exists, can it have fewer parts or steps, does it waste work, does it change the right layer. Rule on each answer yourself and edit the plan file.'''
SHUTDOWN = '''Then release the team: use `interrupt_agent` for agents that remain busy. Idle completed agents need no close; do not wake them merely to announce shutdown.'''
DONE_RELEASE = ""
NOTES_ROUTE = "go to the owning workers to apply before CLOSE, with no `PLAN` line and no re-review."
FIX_ROUTE = '''route each finding to the worker that owns the cited file as a new round through its DA, and log one line per worker: `append PLAN worker-N "-> da-M | fix: <finding summary> | <acceptance>"`. A `PLAN` after a `DONE` reopens that subtask.'''
LIST_AGENTS = "`list_agents`"
NEW_SESSION = '''After a new session changes the session ID, `status` finds no run for this session and prints the `adopt` command for the orphaned log. Run `adopt <log>` first, then the steps above.'''
HOOK_CONTRACT = '''The plugin registers two lead hooks in `codex/hooks/hooks.json`. Review and trust them through `/hooks`. Each acts only in your own session and only for the run this session owns (its `.orchestrate/active-<session id>` marker); the hooks read the payload session ID and cwd, and the log uses `CODEX_THREAD_ID`. Each stays silent once the log's last line is a `CLOSE`, adds context, and never blocks. `ORCHESTRATE_PYTHON` sets the interpreter they use.

- **Goal restate** fires on session resume and after compaction. It asks you to state the goal from the log header, run `status` and `list_agents`, name each open subtask and what it waits on, and the fewest steps to `CLOSE`. Answer it with Resume. It never throttles.
- **Speed-up question** fires after a log write whose last line is `PLAN`, `DONE`, `BLOCKED`, `ESCALATE`, `RESPAWN`, or `INTEGRATE`, at most once per 10 minutes (`ORCHESTRATE_SPEEDUP_SECONDS`). It asks whether anything else can overlap, run in parallel, or be cut. Answer in one line: `optimal`, or the change you make now.'''
RUNTIME_ANTIPATTERNS = '''- **Expecting peers to read each other's plain text.** Worker-to-DA briefs and verdicts must use `followup_task`; a final line only reports turn completion to the lead.
- **Using an unavailable role or delivery operation.** Stop and report the missing capability; do not substitute a generic worker or rely on passive messages to wake an idle peer.
- **Ending the lead turn while workers wait.** Stay active with `wait_agent` so lead events can be handled.'''
MODEL_REFERENCE = '''`references/model-seats.md` — which model each role gets and how to preserve its configured model and effort.'''
PREFLIGHT_REFERENCE = '''`<PAVE_PLUGIN_ROOT>/codex/orchestrate_preflight.py` — installed-role and shared-resource checks; also check the live tools before every spawn.'''

SKILL_EXAMPLES = "domain skills, available testing skills, etc."

[skills.orchestrate.references.protocol]
DELIVERY = '''Everything between peers travels by `followup_task`, addressed to canonical task paths; it wakes an idle worker or DA. Events to the active orchestrator use `send_message`, and the orchestrator waits with `wait_agent`. Plain text never delivers a review to a peer. A worker's WAITING turn completion is a heartbeat, not DONE. Passive `send_message` does not wake idle peers.'''
LEAD_NAME = "The orchestrator's canonical task path supplied in the brief"
NAMING = '''Names below are run-log IDs; pair them with the canonical task paths returned by `spawn_agent`. Indices continue across waves. Never reuse a name in one run; a later agent with the same name shadows the earlier one.'''
DA_ADDRESSES = '''worker-A, worker-B, worker-C, paired with their canonical task paths.
Orchestrator: <actual canonical task path>
ORCHESTRATE_ROOT: <absolute plugin root>/skills/orchestrate'''
WAIT_BRIEFS = "Wait for review briefs via `followup_task`."
VERDICT_DELIVERY = "uses `followup_task` to a worker or `send_message` to the active orchestrator."
WHOLE_GOAL_REPLY = "Use `send_message` to the supplied orchestrator path with first line"
LEAD_EVENTS = '''Workers send nothing else to the orchestrator by `send_message`. The heartbeat is the plain-text last line of each waiting turn, `WAITING worker-N: round R sent to da-M`, which the orchestrator sees as a turn-completion notification.'''
ROSTER = "`list_agents` does not show the peer"
REASSIGN = '''```
followup_task(target: "<worker-N canonical path>", message: "Your reviewer is now da-K at <canonical path>. Resend your current round brief there, including the prior findings and your FIX/DEFER/FALSE_POSITIVE notes so da-K has the history.")
followup_task(target: "<da-K canonical path>", message: "worker-N at <canonical path> is now yours in addition to your current workers. Its brief follows from the worker.")
```'''
SHUTDOWN = '''After the final report, use `interrupt_agent` on any agent that stays busy. Idle completed agents need no close; do not wake them just to announce shutdown.'''

[skills.orchestrate.references.subtask]
SPAWN_FIELD = "`message`"
ADDRESSES = '''Orchestrator: <canonical task path>
Reviewer: <DA canonical task path>
ORCHESTRATE_ROOT: <absolute plugin root>/skills/orchestrate'''
TESTING_SKILL = "- <available testing skill>"

[skills.orchestrate.references.model-seats]
MODEL_DOCTRINE = '''Use gpt-6.1-sol for implementation and gpt-6-astra for review. Use the installed research-delegate role for evidence and mechanical checks.'''
SEAT_TABLE = '''| Role | Custom agent | Model and effort |
|---|---|---|
| Worker | `pave-init:orchestrate-worker` | `gpt-6.1-sol`, `xhigh` |
| DA | `pave-init:adversarial-investigator` | `gpt-6-astra`, `xhigh` |
| Evidence, Step 1 helpers | `pave-init:research-delegate` | The installed role's configured model and effort |'''
DISPATCH_GUIDANCE = '''## Keep each role's model and effort

Use `spawn_agent` with the named `agent_type` and `fork_turns: "none"` to retain its model and effort. Count retained agents and research helpers against available capacity; reserve helper slots or investigate directly. A fresh agent does not imply a different provider identity or quota.'''

[roles.orchestrate-worker]
sandbox_mode = "workspace-write"
model = "gpt-6.1-sol"
reasoning_effort = "xhigh"
runtime = '''Use the canonical task paths supplied in the brief, not display labels. Read applicable skills from their listed SKILL.md files. Deliver review requests with followup_task(target=<reviewer path>, message=<full brief>), which wakes an idle reviewer. After sending, end your turn with WAITING <worker ID>: round R sent to <reviewer>. The reviewer's followup_task wakes you with the verdict. Send DONE, BLOCKED, ESCALATE, and BROKER to the lead with send_message; the lead waits actively. Do not rely on passive send_message to wake a peer. Do not start another reviewer.'''

[roles.orchestrate-worker.slots]
TESTING_SKILLS = "an available testing skill for code with tests, an available verification skill before you submit"
DESCRIPTION = '''Implements one subtask issued by the orchestrate skill, loads the relevant skills, and loops with its assigned adversarial-investigator until the review PASSes. Dispatched by the orchestrate skill only, with the installed Codex custom-agent role; do not trigger from an implicit match.'''
LEAD_ADDRESS = "(the canonical task path supplied in the brief)"
SKILL_LOADER = "Read the listed SKILL.md files to load"
REVIEW_WAIT = '''When acceptance passes, send your DA a brief with `followup_task`, then end your turn with one plain-text line: `WAITING <your name>: round 1 sent to <Reviewer>`. That line never reaches the DA; the orchestrator receives your turn completion. The DA's `followup_task` reply wakes you.'''
REVIEW_SEND = "followup_task(target: \"<Reviewer canonical path>\", message: |"
DONE_SEND = "`DONE` message via send_message"
PEER_FAILURE = "If `followup_task` to your DA errors, or `list_agents` does not show it"
BLOCKED_ADDRESS = "`WAITING <your name>: BLOCKED sent to <Orchestrator>`"
MESSAGE_DELIVERY = '''- Every review request to your DA goes through `followup_task`; events to the active orchestrator go through `send_message`. Your plain output never reaches the DA; the orchestrator receives your turn completion. Passive `send_message` does not wake an idle peer.'''

[roles.adversarial-investigator]
sandbox_mode = "workspace-write"
model = "gpt-6-astra"
reasoning_effort = "xhigh"
runtime = '''For standalone reviews, return findings directly to the requester. The following delivery rules apply to orchestration assignments only. Use the canonical task paths supplied in each brief. Read applicable skills from their listed SKILL.md files. Deliver worker verdicts with followup_task(target=<worker path>, message=<full verdict>), which wakes an idle worker. Send whole-goal verdicts, escalations, and relays to the lead with send_message. End each startup or waiting turn; do not wait indefinitely or rely on passive send_message to wake a peer. If the lead reserved a research slot, use spawn_agent with agent_type pave-init:research-delegate and fork_turns none. Start that helper's brief with PAVE_PLUGIN_ROOT: <two directories above ORCHESTRATE_ROOT>. Otherwise investigate directly.'''

[roles.adversarial-investigator.slots]
GOAL_CHANNEL = "(send_message to the active requester)"
SKILL_LOADER = "Read the listed SKILL.md files to load"
SKILL_EXAMPLE = "`skill-creator`"
RESEARCH_DISPATCH = '''For each high-priority claim, decide what would confirm it and what would refute it, then get that evidence. Read the cited files and run the cited commands yourself. Delegate when it pays: several independent reads that can run at once, or a search whose bulk you do not need in your own context, go to `pave-init:research-delegate` sub-agents using `spawn_agent` with `fork_turns: "none"` and the installed role model and effort. Dispatch independent questions together. Under orchestration, use only capacity reserved by the lead. Start each helper brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>` (two directories above ORCHESTRATE_ROOT when supplied). If the root, role, or capacity is unavailable, investigate directly. Questions about Codex itself go through the available `openai-docs` skill and primary documentation.'''
TEAM_OUTPUT = "### When Part of a Team (use followup_task for workers; send_message for the active lead)"
STANDALONE_OUTPUT = "rather than via followup_task or send_message"
COMMUNICATION = '''- When dispatched by an orchestrator or as part of a team: use **followup_task** for worker verdicts and **send_message** for events to the active lead, using the canonical paths supplied in the brief.
- When spawned standalone by the user or main Codex session: output findings directly as text.'''

[skills.pave-init]
template = "sources/pave-init/SKILL.md.tmpl"
output = "codex/skills/pave-init/SKILL.md"

[skills.pave-init.slots]
FRONTMATTER = '''---
name: pave-init
description: >-
  Create a PAVE-based Codex workflow plugin from a goal the user states.
  Manual-only: use only after explicit $pave-init:pave-init invocation or
  selection through /skills. This long campaign clarifies the goal, explores
  the system, designs and reviews a PAVE graph, and builds and tests the
  plugin. The plugin registers disclosed stop-alignment, stale-state,
  planning-layout, and write-for-the-reader hooks. While a run is active,
  stop alignment blocks at most one stop in three.
---'''
PRODUCT_INTRO = '''Turn a system or engineering process into a validated PAVE graph file and a Codex plugin: a lead workflow skill plus custom role agents. Resolve `PAVE_PLUGIN_ROOT` as the absolute path three directories above this file (`<root>/codex/skills/pave-init/SKILL.md` → `<root>`) and resolve every `orchestration/...`, `references/...`, `schemas/...`, and `scripts/...` path below under `<PAVE_PLUGIN_ROOT>/skills/pave-init/`. The user's stated goal drives the run: clarify it until it is designable, then design. Treat the approved PAVE YAML as the workflow authority.'''
MULTI_AGENT_CONTRACT = '''Every worker role is a named Codex custom agent installed from this plugin. Its TOML contains the complete role contract. Start every brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>`.

Codex V2 is required. Keep `features.multi_agent = true`; set `features.multi_agent_v2.enabled = true`, `agents.enabled = true`, and `agents.max_concurrent_threads_per_session = 16`. Remove `agents.max_depth`; V2 ignores it. This configuration provides 16 child slots and 17 total V2 slots including the root.

- Dispatch one-shot workers with `spawn_agent`, `agent_type: pave-init:<role>`, and `fork_turns: "none"` so the role keeps its own model and effort. Start independent workers together and wait with `wait_agent`. A finished thread needs no close; call `interrupt_agent` only when a thread is still running after its node instance closed.
- Retain one exact `pave-init:pave-material-reviewer` thread through every repair round at a gate. Continue it with `followup_task`; a fresh thread is a new reviewer. Start a fresh reviewer for the final-skill gate.
- Use the role's configured Codex model and reasoning effort. The forward tester inherits session defaults. `gpt-5.6-sol` maps Claude `fable` and `opus`; `gpt-5.6-terra` maps Claude `sonnet`. Preserve each approved effort exactly, using the highest supported effort only when the configured level is unavailable.
- Ask bounded user questions in plain text or with `request_user_input` when it is available. Present approval briefs in full and require an explicit response that names what the user approves.

Before Stage 1, resolve the target project root and a fresh evidence directory, then run `python3 <PAVE_PLUGIN_ROOT>/codex/preflight.py --project <project-root> --evidence-dir <fresh-evidence-dir>`. Also verify that `yaml` and `jsonschema` import, shared resources are readable, and the user reviewed plugin hooks through `/hooks`. Do not enter Stage 1 unless the preflight exits 0. The preflight proves effective Codex V2, canonical nested task paths, two turns on one retained reviewer, and the installed `pave-init:*` role content and runtime fields from persisted rollout evidence; it is the authority because Codex configuration is layered. If it fails, pause and report the setup and preflight commands from `codex/README.md`. Do not use a generic worker and claim equivalent review.'''
PACKAGE_IDENTITY = '''The delivered unit is a Codex plugin — the native Codex shape of pave-init.'''
MANIFEST_COMPONENT = '''the plugin manifest (`.codex-plugin/plugin.json`: name, description, version); the plugin name is `<workflow-name>` — one string serving as the manifest name, lead-skill directory, and custom-agent prefix;'''
ROLE_COMPONENT = '''custom-agent TOML sources plus an explicit consented installer under the plugin root, when authority or context differs;'''
HOOK_COMPONENT = '''hook scripts plus plugin-level `hooks/hooks.json` registration per the approved enforcement table;'''
ROLE_RUNTIME_BINDING = '''Roles map to named custom-agent TOML contracts only when they need distinct authority or context. The lead dispatches the mapped custom-agent name and pauses when it is unavailable; it never substitutes a generic worker. Installation is explicit and must not hide inside a hook.'''
MODEL_RUNTIME_BINDING = '''Map the approved capability tier to Codex models explicitly: top-capability and strong-judgment roles use `gpt-5.6-sol`, while small, fast evidence roles use `gpt-5.6-terra`. A reviewer or adjudicator seat binds at or above the producer whose artifact it judges — a judge below its producer misses the findings that need the producer's whole reasoning to see. Preserve the approved reasoning effort in custom-agent TOML and each scripted invocation.'''
HOOK_RUNTIME_BINDING = '''A prohibition that must hold after its prose leaves context maps to a hook per the approved enforcement table. Register it in plugin-level `hooks/hooks.json`; a payload adapter may change wire format but not policy, actor scope, or enforcement strength.'''
SCRIPT_RUNTIME_BINDING = '''A subgraph with an approved `workflow_script` binding maps to one deterministic Python or TypeScript `codex_exec_script` per the native `skill-builder` contract, with lead-driven custom-agent dispatch as fallback when the script runtime is unavailable. In generated custom-agent TOML, map top-capability and strong-judgment roles to `gpt-5.6-sol` and small, fast evidence roles to `gpt-5.6-terra`. Preserve the approved reasoning effort exactly; use the highest supported effort only when the approved level is unavailable and record that fallback.'''
DELIVERY_INSTALL_BULLET = '''- install or enable the Codex plugin, run its explicit custom-agent installer, review hooks through `/hooks`, then invoke `$<workflow-name>:<workflow-name>`; marketplace installation alone is incomplete while agents remain outside the manifest;'''
SKILL_VALIDATION_BINDING = '''the `$skill-creator` quick validator'''

[skills.pave-evolve]
template = "sources/pave-evolve/SKILL.md.tmpl"
output = "codex/skills/pave-evolve/SKILL.md"

[skills.pave-evolve.slots]
FRONTMATTER = '''---
name: pave-evolve
description: >-
  Revise a delivered PAVE workflow — pave-init included — from recorded defect
  and usage evidence: a workflow-updater drafts a successor patch, an
  update-reviewer judges it, the user approves where the user-only changes
  moved, and the lead applies it in the append-only revision log.
  Manual-only: use only after explicit $pave-init:pave-evolve invocation or
  selection through /skills, or when a PAVE lead routes here from a run paused
  on a defect in its own graph. Registers no hooks.
---'''
DISPATCH_CONTRACT = '''Resolve `PAVE_PLUGIN_ROOT` as the absolute path three directories above this file (`<root>/codex/skills/pave-evolve/SKILL.md` → `<root>`) and resolve every `references/...` and `scripts/...` path in this file under `<PAVE_PLUGIN_ROOT>/skills/pave-init/`. Both seats are named Codex custom agents installed from this plugin; each TOML contains the complete role contract. Start every brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>`.

- Start the updater with `spawn_agent`, `agent_type: pave-init:workflow-updater`, a unique `task_name`, and `fork_turns: "none"` so the role keeps its own model and effort; continue that same thread through review rounds with `followup_task` — a fresh thread re-derives the proposal and loses the rounds' record.
- Start the reviewer with `spawn_agent`, `agent_type: pave-init:update-reviewer`, and `fork_turns: "none"`; continue that exact thread through repair rounds with `followup_task`. Wait with `wait_agent`; a finished thread needs no close.
- Use each role's configured Codex model and reasoning effort.
- Ask the approval question in plain text or with `request_user_input` when it is available; the approval option names the revision number and digest.

Before the first dispatch, run `python3 <PAVE_PLUGIN_ROOT>/codex/preflight.py --project <project-root> --evidence-dir <fresh-evidence-dir>` unless this session already passed it; it proves Codex V2 and the installed `pave-init:*` roles through a live nested dispatch. If a role is unavailable, pause and report the setup commands from `codex/README.md`. Do not use a generic worker and claim equivalent review.'''

[roles.forward-tester]
model = "inherit"
reasoning_effort = "inherit"
sandbox_mode = "workspace-write"
runtime = '''Install or enable the generated plugin and its custom agents in the temporary project, then run `codex exec --ephemeral --sandbox workspace-write "<request>"`. A launch that cannot load the plugin or resolve a custom agent is degraded evidence.'''

[roles.node-planner]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
runtime = '''When more evidence is needed, use `spawn_agent` with `agent_type: pave-init:research-delegate`, one bounded read-only question per worker. Start independent questions together and collect each result with `wait_agent`; a finished worker needs no close.'''

[roles.pave-material-reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''When the artifact is a generated skill package, load `$skill-creator` for skill-quality context when it is available. Use `spawn_agent` with `agent_type: pave-init:research-delegate` for independent bounded questions and start them together. Return findings on this exact reviewer thread. The lead continues this thread with `followup_task` through repair rounds.'''

[roles.research-delegate]
model = "gpt-5.6-terra"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''Return the bounded research result to the parent thread. Do not modify files.'''

[roles.skill-builder]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox_mode = "workspace-write"
runtime = '''Generate a Codex plugin with `.codex-plugin/plugin.json`, a lead under `skills/<workflow-name>/`, custom-agent TOML plus an explicit installer, and plugin-level `hooks/hooks.json`. Use named custom agents through `spawn_agent`, retain reviewers with `followup_task`, wait with `wait_agent`, ask explicit user gates in plain text or `request_user_input`, and apply model, effort, and sandbox per role. Map top-capability and strong-judgment roles to `gpt-5.6-sol`; map small, fast evidence roles to `gpt-5.6-terra`. Preserve the approved reasoning effort exactly, with a recorded highest-supported fallback only when required. Require Codex V2 for every generated multi-agent plugin: keep `features.multi_agent = true`; set `features.multi_agent_v2.enabled = true`, `agents.enabled = true`, and `agents.max_concurrent_threads_per_session = 16`; remove `agents.max_depth`. This provides 16 child slots and 17 total V2 slots. When the approved plan selects `workflow_script`, generate a deterministic Python or TypeScript `codex_exec_script` that launches `codex exec --json --ephemeral` per node with structured outcomes and keeps lead-driven custom-agent dispatch as fallback.'''

[roles.system-explorer]
model = "gpt-5.6-terra"
reasoning_effort = "high"
sandbox_mode = "workspace-write"
runtime = '''Return the bounded exploration result to the parent thread and write only the assigned report.'''

[roles.update-reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''When the proposal touches a lead skill, load `$skill-creator` for skill-quality context when it is available. Use `spawn_agent` with `agent_type: pave-init:research-delegate` for independent bounded questions and start them together. Return findings on this exact reviewer thread. The lead continues this thread with `followup_task` through repair rounds.'''

[roles.workflow-updater]
model = "gpt-5.6-sol"
