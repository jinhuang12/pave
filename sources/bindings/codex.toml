version = 1
harness = "codex"
agent_output_kind = "toml"

[skills.pave-init]
template = "sources/pave-init/SKILL.md.tmpl"
output = "codex/skills/pave-init/SKILL.md"

[skills.pave-init.slots]
FRONTMATTER = '''---
name: pave-init
description: >-
  Create a PAVE-based Codex workflow plugin from a goal the user states.
  Manual-only: use only after explicit $pave-init:pave-init invocation or
  selection through /skills. This long campaign clarifies the goal, explores
  the system, designs and reviews a PAVE graph, and builds and tests the
  plugin. The plugin registers disclosed stop-alignment, stale-state,
  planning-layout, and write-for-the-reader hooks. While a run is active,
  stop alignment blocks at most one stop in three.
---'''
PRODUCT_INTRO = '''Turn a system or engineering process into a validated PAVE Graph Profile and a Codex plugin: a lead workflow skill plus custom role agents. Resolve `PAVE_PLUGIN_ROOT` as the absolute path three directories above this file (`<root>/codex/skills/pave-init/SKILL.md` → `<root>`) and resolve every `orchestration/...`, `references/...`, `schemas/...`, and `scripts/...` path below under `<PAVE_PLUGIN_ROOT>/skills/pave-init/`. The user's stated goal drives the run: clarify it until it is designable, then design. Treat the approved PAVE YAML as the workflow authority.'''
MULTI_AGENT_CONTRACT = '''Every worker role is a named Codex custom agent installed from this plugin. Its TOML contains the complete role contract. Start every brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>`.

- Dispatch one-shot workers with `spawn_agent`, `agent_type: pave-init:<role>`, and `fork_turns: "none"` so the role keeps its own model and effort. Start independent workers together and wait with `wait_agent`. A finished thread needs no close; call `interrupt_agent` only when a thread is still running after its node instance closed.
- Retain one exact `pave-init:pave-material-reviewer` thread through every repair round at a gate. Continue it with `followup_task`; a fresh thread is a new reviewer. Start a fresh reviewer for the final-skill gate.
- Use the role's configured Codex model and reasoning effort. The forward tester inherits session defaults. `gpt-5.6-sol` maps Claude `fable` and `opus`; `gpt-5.6-terra` maps Claude `sonnet`. Preserve each approved effort exactly, using the highest supported effort only when the configured level is unavailable.
- Ask bounded user questions in plain text or with `request_user_input` when it is available. Present approval briefs in full and require an explicit response that names what the user approves.

Before Stage 1, resolve the target project root and a fresh evidence directory, then run `python3 <PAVE_PLUGIN_ROOT>/codex/preflight.py --project <project-root> --evidence-dir <fresh-evidence-dir>`. Also verify that `yaml` and `jsonschema` import, shared resources are readable, and the user reviewed plugin hooks through `/hooks`. Do not enter Stage 1 unless the preflight exits 0. The preflight proves effective Codex V1 (`features.multi_agent_v2 = false`), `agents.max_depth = 2`, and the installed `pave-init:*` roles through a live nested dispatch; it is the authority because Codex configuration is layered. If it fails, pause and report the setup and preflight commands from `codex/README.md`. Do not use a generic worker and claim equivalent review.'''
PACKAGE_IDENTITY = '''The delivered unit is a Codex plugin — the native Codex shape of pave-init.'''
MANIFEST_COMPONENT = '''the plugin manifest (`.codex-plugin/plugin.json`: name, description, version); the plugin name is `<workflow-name>` — one string serving as the manifest name, lead-skill directory, and custom-agent prefix;'''
ROLE_COMPONENT = '''custom-agent TOML sources plus an explicit consented installer under the plugin root, when authority or context differs;'''
HOOK_COMPONENT = '''hook scripts plus plugin-level `hooks/hooks.json` registration per the approved enforcement record;'''
ROLE_RUNTIME_BINDING = '''Roles map to named custom-agent TOML contracts only when they need distinct authority or context. The lead dispatches the mapped custom-agent name and pauses when it is unavailable; it never substitutes a generic worker. Installation is explicit and must not hide inside a hook.'''
MODEL_RUNTIME_BINDING = '''Map the approved capability tier to Codex models explicitly: top-capability and strong-judgment roles use `gpt-5.6-sol`, while small, fast evidence roles use `gpt-5.6-terra`. A reviewer or adjudicator seat binds at or above the producer whose artifact it judges — a judge below its producer misses the findings that need the producer's whole reasoning to see. Preserve the approved reasoning effort in custom-agent TOML and each scripted invocation.'''
HOOK_RUNTIME_BINDING = '''A prohibition that must hold after its prose leaves context maps to a hook per the approved enforcement record. Register it in plugin-level `hooks/hooks.json`; a payload adapter may change wire format but not policy, actor scope, or enforcement strength.'''
SCRIPT_RUNTIME_BINDING = '''A subgraph with an approved `workflow_script` binding maps to one deterministic Python or TypeScript `codex_exec_script` per the native `skill-builder` contract, with lead-driven custom-agent dispatch as fallback when the script runtime is unavailable. In generated custom-agent TOML, map top-capability and strong-judgment roles to `gpt-5.6-sol` and small, fast evidence roles to `gpt-5.6-terra`. Preserve the approved reasoning effort exactly; use the highest supported effort only when the approved level is unavailable and record that fallback.'''
DELIVERY_INSTALL_BULLET = '''- install or enable the Codex plugin, run its explicit custom-agent installer, review hooks through `/hooks`, then invoke `$<workflow-name>:<workflow-name>`; marketplace installation alone is incomplete while agents remain outside the manifest;'''
SKILL_VALIDATION_BINDING = '''the `$skill-creator` quick validator'''

[skills.pave-evolve]
template = "sources/pave-evolve/SKILL.md.tmpl"
output = "codex/skills/pave-evolve/SKILL.md"

[skills.pave-evolve.slots]
FRONTMATTER = '''---
name: pave-evolve
description: >-
  Revise a delivered PAVE workflow — pave-init included — from recorded defect
  and usage evidence: a workflow-updater drafts a successor patch, an
  update-reviewer judges it, the user approves where the authority envelope
  moved, and the lead lands it in the append-only revision ledger.
  Manual-only: use only after explicit $pave-init:pave-evolve invocation or
  selection through /skills, or when a PAVE lead routes here from a run paused
  on a defect in its own graph. Registers no hooks.
---'''
DISPATCH_CONTRACT = '''Resolve `PAVE_PLUGIN_ROOT` as the absolute path three directories above this file (`<root>/codex/skills/pave-evolve/SKILL.md` → `<root>`) and resolve every `references/...` and `scripts/...` path in this file under `<PAVE_PLUGIN_ROOT>/skills/pave-init/`. Both seats are named Codex custom agents installed from this plugin; each TOML contains the complete role contract. Start every brief with `PAVE_PLUGIN_ROOT: <absolute plugin root>`.

- Start the updater with `spawn_agent`, `agent_type: pave-init:workflow-updater`, a unique `task_name`, and `fork_turns: "none"` so the role keeps its own model and effort; continue that same thread through review rounds with `followup_task` — a fresh thread re-derives the proposal and loses the rounds' record.
- Start the reviewer with `spawn_agent`, `agent_type: pave-init:update-reviewer`, and `fork_turns: "none"`; continue that exact thread through repair rounds with `followup_task`. Wait with `wait_agent`; a finished thread needs no close.
- Use each role's configured Codex model and reasoning effort.
- Ask the approval question in plain text or with `request_user_input` when it is available; the approval option names the revision number and digest.

Before the first dispatch, run `python3 <PAVE_PLUGIN_ROOT>/codex/preflight.py --project <project-root> --evidence-dir <fresh-evidence-dir>` unless this session already passed it; it proves the installed `pave-init:*` roles through a live nested dispatch. If a role is unavailable, pause and report the setup commands from `codex/README.md`. Do not use a generic worker and claim equivalent review.'''

[roles.forward-tester]
model = "inherit"
reasoning_effort = "inherit"
sandbox_mode = "workspace-write"
runtime = '''Install or enable the generated plugin and its custom agents in the temporary project, then run `codex exec --ephemeral --sandbox workspace-write "<request>"`. A launch that cannot load the plugin or resolve a custom agent is degraded evidence.'''

[roles.node-planner]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
runtime = '''When more evidence is needed, use `spawn_agent` with `agent_type: pave-init:research-delegate`, one bounded read-only question per worker. Start independent questions together and collect each result with `wait_agent`; a finished worker needs no close.'''

[roles.pave-material-reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''When the artifact is a generated skill package, load `$skill-creator` for skill-quality context when it is available. Use `spawn_agent` with `agent_type: pave-init:research-delegate` for independent bounded questions and start them together. Return findings on this exact reviewer thread. The lead continues this thread with `followup_task` through repair rounds.'''

[roles.research-delegate]
model = "gpt-5.6-terra"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''Return the bounded research result to the parent thread. Do not modify files.'''

[roles.skill-builder]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox_mode = "workspace-write"
runtime = '''Generate a Codex plugin with `.codex-plugin/plugin.json`, a lead under `skills/<workflow-name>/`, custom-agent TOML plus an explicit installer, and plugin-level `hooks/hooks.json`. Use named custom agents through `spawn_agent`, retain reviewers with `followup_task`, wait with `wait_agent`, ask explicit user gates in plain text or `request_user_input`, and apply model, effort, and sandbox per role. Map top-capability and strong-judgment roles to `gpt-5.6-sol`; map small, fast evidence roles to `gpt-5.6-terra`. Preserve the approved reasoning effort exactly, with a recorded highest-supported fallback only when required. Require Codex V1 with `agents.max_depth = 2` when a generated graph nests dispatch. When the approved plan selects `workflow_script`, generate a deterministic Python or TypeScript `codex_exec_script` that launches `codex exec --json --ephemeral` per node with structured outcomes and keeps lead-driven custom-agent dispatch as fallback.'''

[roles.system-explorer]
model = "gpt-5.6-terra"
reasoning_effort = "high"
sandbox_mode = "workspace-write"
runtime = '''Return the bounded exploration result to the parent thread and write only the assigned report.'''

[roles.update-reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox_mode = "read-only"
runtime = '''When the proposal touches a lead skill, load `$skill-creator` for skill-quality context when it is available. Use `spawn_agent` with `agent_type: pave-init:research-delegate` for independent bounded questions and start them together. Return findings on this exact reviewer thread. The lead continues this thread with `followup_task` through repair rounds.'''

[roles.workflow-updater]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
runtime = '''Load `$skill-creator` for skill-quality context and read the pave-init skill (`<PAVE_PLUGIN_ROOT>/codex/skills/pave-init/SKILL.md`) for the design language before drafting. When more evidence is needed, use `spawn_agent` with `agent_type: pave-init:research-delegate`, one bounded read-only question per worker, and collect each result with `wait_agent`. Return the proposal report on this exact thread; the lead continues it with `followup_task` through review rounds.'''
