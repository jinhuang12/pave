version = 1
harness = "claude"
agent_output_kind = "markdown"

[skills.orchestrate]
template = "sources/orchestrate/SKILL.md.tmpl"
output = "skills/orchestrate/SKILL.md"

[skills.orchestrate.slots]
FRONTMATTER = '''---
name: orchestrate
description: >-
  Turn yourself into a pure orchestrator for any complex task. Decompose the
  goal into independent subtasks, run them in parallel on opus
  `orchestrate-worker` agents, and give each group of 2-3 workers a shared
  fable `adversarial-investigator` that reviews their work until it PASSes.
  Use this skill whenever a task has 3 or more independent parts, spans many
  files or components, would take one agent more than roughly an hour, or when
  the user says "parallelize", "fan out", "orchestrate", "delegate", "use
  workers", "split this up", "swarm", or "/orchestrate". Also use it when a
  task mixes unrelated domains (e.g. backend + frontend + docs) even if the
  user never mentions parallelism. Do not use it for single-file edits,
  trivial fixes, or tasks whose steps are strictly sequential with no parallel
  width. Registers one lead-only hook: a goal restate on session resume and
  after compaction, which adds context and never blocks.
hooks:
  SessionStart:
    - matcher: "resume|compact"
      hooks:
        - type: command
          command: "d=\"${CLAUDE_SKILL_DIR:-${CLAUDE_PLUGIN_ROOT}/skills/orchestrate}\"; \"$d\"/hooks/goal_restate.sh"
---'''
PEER_MESSAGES = "direct SendMessage"
RESOURCE_PATHS = '''`$SKILL` in this file means this skill's base directory: the Skill tool printed it as `Base directory for this skill: <path>` when the skill loaded. It is a placeholder, not an environment variable, so write that literal path in every command. Do not guess an install path.'''
LOG_COMMAND = "python3 $SKILL/scripts/orchestrate_log.py --runtime claude"
ISOLATION = "give each `isolation: \"worktree\"`"
TEAM_MODELS = '''Workers run on `opus`, DAs on `fable`, always passed explicitly on the Agent call; teammate spawns ignore the agent file's `model:` and inherit yours when the call omits it. See `references/model-seats.md` for why, and why no per-seat id spread is possible from here.'''
PREFLIGHT = '''**Pre-flight first.** Run `python3 $SKILL/scripts/preflight.py --fix` from the working directory. Teammates open in your cwd, and if that directory was never trusted in your Claude config (`.claude.json` in your home directory) every teammate stalls at the trust dialog with an unread inbox, looking alive but silent for as long as you wait. The script marks the cwd trusted and confirms agent teams are on.'''
SPAWN_RUNTIME = '''Spawn every agent as a **teammate**, not an in-process subagent. Teammates are separate processes with their own inbox, so a worker can message its DA directly and the pair can loop without you in the middle. With agent teams enabled (`CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`), an Agent call that carries a `name` becomes a teammate; the `name` is what makes it addressable. After spawning, run `ListAgents` once and confirm every worker and DA appears under **Teammates**. If they appear as plain subagents instead, teams are off in this session; the protocol still works, but expect to broker (Step 4).'''
SPAWN_ORDER = "Spawn DAs first, then workers, all in one message so they run concurrently."
SPAWN_ADDRESSES = '''Read `references/protocol.md` for the exact DA spawn prompt and `references/subtask.md` for the worker subtask. Teammates address you as **`team-lead`**, never `main` (a teammate that sends to `main` is told it *is* main and the send fails); put `Orchestrator: team-lead` in every subtask. Every spawn uses `run_in_background: true`, a `name`, and an explicit `model`.'''
SPAWN_EXAMPLE = '''Agent(name: "da-1", subagent_type: "pave-init:adversarial-investigator", model: "fable", run_in_background: true, prompt: <DA prompt from protocol.md>)
Agent(name: "worker-1", subagent_type: "pave-init:orchestrate-worker", model: "opus", run_in_background: true, prompt: <subtask>)'''
MONITOR_DELIVERY = '''Workers and DAs talk to each other directly by name. You wait. Do not poll with `ListAgents` or "are you done?" messages; every relevant event arrives as a SendMessage.

Teammate traffic reaches you **only between your turns**. After spawning, end your turn and wait; a `sleep` loop or repeated `ListAgents` inside one turn sees nothing. Two kinds of traffic arrive:

- **Idle notifications.** Whenever a teammate ends a turn you get its last plain-text line as `result`. Workers end each waiting turn with `WAITING worker-N: round R sent to da-M`, so these are your heartbeat. They are not events; do not act on them.
- **SendMessages.** These are the events. Act only on a message whose first line is one of these:'''
PROVIDER_FAILURE = '''**Provider failures.** An idle notification with `idleReason: failed` and an API error as the reason (503/429 after exhausted retries) means the worker died mid-task, and its files may be half-written. Spawn a replacement under the **next unused index** (`worker-7`, never a reused name), with the same subtask plus a line saying which files the dead worker may have touched, and tell its DA the new name. Log it as `append RESPAWN <old> "-> <new> | <reason>"`. Each teammate launch gets its own identity slot from the teammate launcher, so a fresh spawn usually lands on a different quota than the one that failed.'''
SHUTDOWN = "Then release the team: tell each agent it is done; use `TaskStop` on any that remain busy."
LIST_AGENTS = "`ListAgents`"
NEW_SESSION = '''After `/clear` the session id changes, so `status` finds no run for this session and prints the `adopt` command for the orphaned log. Run `adopt <log>` first, then the steps above.'''
HOOK_CONTRACT = '''The one hook in this skill's frontmatter, **goal restate**, fires on session resume and after compaction, only in your own session, and only for the run this session owns (its `.orchestrate/active-<session id>` marker). It stays silent once the log's last line is a `CLOSE`. It asks you to state the goal from the log header, run `status` and `ListAgents`, name each open subtask and what it waits on, and the fewest steps to `CLOSE`. Answer it with Resume. It never throttles and never blocks. `ORCHESTRATE_PYTHON` sets the interpreter it uses.'''
RUNTIME_ANTIPATTERNS = '''- **Expecting peers to read each other's plain text.** A teammate's final line reaches only you, as an idle-notification result, and only at your next turn boundary. Worker-to-DA traffic must be SendMessage.
- **Using an agent type with a restricted tool list.** No `SendMessage` in its tools means it can never reach its DA or you. `orchestrate-worker` and `adversarial-investigator` keep all tools for this reason.
- **Running this headless.** `claude -p` never spawns teammates; the skill is for interactive sessions.'''
MODEL_REFERENCE = "`references/model-seats.md` — which model each role gets and why `model:` must be explicit."
PREFLIGHT_REFERENCE = "`scripts/preflight.py` — trust-dialog and agent-teams check; run with `--fix` before every spawn."

SKILL_EXAMPLES = "domain skills, `superpowers:test-driven-development`, etc."

[skills.orchestrate.references.protocol]
DELIVERY = '''Everything between peers travels by `SendMessage`. A teammate's plain text never reaches another teammate; it reaches the orchestrator only as the `result` field of an idle notification, delivered at the orchestrator's next turn boundary. Names are stable addresses: a send to an idle agent wakes it, which is what lets a worker end its turn after submitting a brief and be woken by the DA's reply. Every agent type used here must have `SendMessage` in its tools; a restricted tool list silently strands the agent.'''
LEAD_NAME = "`team-lead` (teammates cannot address `main`; that name means \"myself\" inside a teammate)"
NAMING = '''Indices continue across waves. Never reuse a name in one run; a later agent with the same name shadows the earlier one.'''
DA_ADDRESSES = "worker-A, worker-B, worker-C. The orchestrator is `team-lead`."
WAIT_BRIEFS = "Wait for review briefs via SendMessage."
VERDICT_DELIVERY = "is a SendMessage."
WHOLE_GOAL_REPLY = "Reply to team-lead with first line"
LEAD_EVENTS = '''Workers send nothing else to the orchestrator by SendMessage. The heartbeat is the plain-text last line of each waiting turn, `WAITING worker-N: round R sent to da-M`, which the orchestrator sees as an idle-notification result.'''
ROSTER = "`ListAgents` does not show the peer"
REASSIGN = '''```
SendMessage(to: "worker-N", message: "Your reviewer is now da-K. Resend your current round brief to da-K, including the prior findings and your FIX/DEFER/FALSE_POSITIVE notes so da-K has the history.")
SendMessage(to: "da-K", message: "worker-N is now yours in addition to your current workers. Its brief follows from the worker.")
```'''
SHUTDOWN = '''After the final report, tell each agent `You are released; no further work.` Use `TaskStop` on any agent that stays busy.'''

[skills.orchestrate.references.subtask]
SPAWN_FIELD = "`prompt`"
ADDRESSES = '''Orchestrator: team-lead       # teammates cannot address "main"
Reviewer: da-M                # the adversarial-investigator assigned to you'''
TESTING_SKILL = "- superpowers:test-driven-development"

[skills.orchestrate.references.model-seats]
MODEL_DOCTRINE = '''Tiering follows the user's standing rule: fable for hard judgment, opus for medium work, sonnet for evidence and mechanical checks. Never default every seat to fable.'''
SEAT_TABLE = '''| Role | Agent call | Why |
|---|---|---|
| Worker | `subagent_type: "pave-init:orchestrate-worker", model: "opus"` | Implementation is medium work; opus is fast enough and cheaper than fable per round. |
| DA | `subagent_type: "pave-init:adversarial-investigator", model: "fable"` | Reviewing is the hard-judgment seat; a weak reviewer passes bad work. |
| Evidence | DAs spawn `pave-init:research-delegate` on `sonnet` themselves; workers may spawn `Explore` on `sonnet` | Read-only lookups do not need judgment. |'''
DISPATCH_GUIDANCE = '''## Always pass `model:` explicitly

Teammate spawns **ignore the `model:` field in the agent's frontmatter** and use the Agent call's `model` parameter, inheriting the parent's model when it is omitted (verified 2026-09-30: an `orchestrate-worker` spawned without `model:` ran on Fable 5.1 under a fable parent). If you forget `model: "opus"` on a worker, the whole team silently runs on the orchestrator's model and the tiering rule is broken.

## Why there is no 60/20/20 id spread here

The user's rule spreads each tier over several model ids for capacity (`opus` / `anthropic.claude-opus-5[1m]` / `anthropic.claude-opus-4-8[1m]`, and `fable` / `global.anthropic.claude-fable-5[1m]`). The Agent tool's `model` parameter only accepts `sonnet | opus | haiku | fable`, and agent-file frontmatter is ignored for teammates, so this skill cannot select a full id per seat. The only place a per-teammate id can be set is the teammate launch command (`CLAUDE_CODE_TEAMMATE_COMMAND`, the user's launcher wrapper), which already rotates AWS identity per teammate and receives `--model opus` on the command line. Rewriting `--model` there by seat is the follow-up that would restore the spread; until then, plain `opus` and `fable` are what every seat gets.'''

[roles.orchestrate-worker]
model = "opus"
effort = "inherit"
runtime = ""

[roles.orchestrate-worker.slots]
TESTING_SKILLS = '''`superpowers:test-driven-development` for code with tests, `superpowers:verification-before-completion` before you submit'''
DESCRIPTION = '''Implements one subtask issued by the orchestrate skill, loads the relevant skills, and loops with its assigned adversarial-investigator until the review PASSes. Dispatched by the orchestrate skill only, as a teammate with model opus passed on the Agent call; do not trigger from an implicit match.'''
LEAD_ADDRESS = "(`team-lead`; sending to `main` fails because inside a teammate `main` means yourself)"
SKILL_LOADER = "Use the `Skill` tool to load"
REVIEW_WAIT = '''When acceptance passes, send your DA a brief, then end your turn with one plain-text line: `WAITING <your name>: round 1 sent to <Reviewer>`. That line never reaches the DA; it reaches the orchestrator as a heartbeat when you go idle. The DA's reply wakes you.'''
REVIEW_SEND = "SendMessage(to: \"<Reviewer>\", message: |"
DONE_SEND = "`DONE` message via SendMessage"
PEER_FAILURE = "If `SendMessage` to your DA errors, or `ListAgents` does not show it"
BLOCKED_ADDRESS = "`WAITING <your name>: BLOCKED sent to team-lead`"
MESSAGE_DELIVERY = '''- Every message to a peer goes through `SendMessage`. Your plain output never reaches the DA; only your last line reaches the orchestrator, as a heartbeat, when you go idle.'''

[roles.adversarial-investigator]
model = "fable"
effort = "inherit"
runtime = ""

[roles.adversarial-investigator.slots]
GOAL_CHANNEL = "(SendMessage)"
SKILL_LOADER = "Use the `Skill` tool to load"
SKILL_EXAMPLE = "`skill-creator:skill-creator`"
RESEARCH_DISPATCH = '''For each high-priority claim, decide what would confirm it and what would refute it, then get that evidence. Read the cited files and run the cited commands yourself. Delegate when it pays: several independent reads that can run at once, or a search whose bulk you do not need in your own context, go to `pave-init:research-delegate` sub-agents (`model: "sonnet"`, `run_in_background: true`), spawned in one message so they run in parallel. Questions about Claude Code itself (hooks, slash commands, MCP servers, settings, the Agent SDK) go to a `claude-code-guide` sub-agent, also on `sonnet`.'''
TEAM_OUTPUT = "### When Part of a Team (use SendMessage)"
STANDALONE_OUTPUT = "rather than via SendMessage"
COMMUNICATION = '''- When dispatched by an orchestrator or as part of a team: report via **SendMessage** to whoever dispatched you.
- When spawned standalone by the user or main Claude session: output findings directly as text.'''

[skills.pave-init]
template = "sources/pave-init/SKILL.md.tmpl"
output = "skills/pave-init/SKILL.md"

[skills.pave-init.slots]
FRONTMATTER = '''---
name: pave-init
description: >-
  Create a PAVE-based Claude Code workflow plugin from a goal the user states.
  Manual-only: use only when the user explicitly invokes /pave-init. This long
  campaign clarifies the goal, explores the system, designs and reviews a PAVE
  graph, and builds and tests the plugin. It registers five disclosed hooks:
  stop alignment and a stale run-state reminder live in this skill's
  frontmatter (lead-only); the planning layout warning, the
  write-for-the-reader reminder, and a goal-restatement prompt (at session
  resume, after compaction, and at each seat's start) live in the plugin's
  hooks.json so they also reach subagents. While a run is active, the stop
  check blocks at most one stop in three; nothing registers silently.
compatibility: >-
  Requires Claude Code skill-frontmatter hooks and plugin-level hooks
  (hooks/hooks.json), registered pave-init agent types, bash, and Python 3.
  PAVE validation also requires pyyaml and jsonschema and fails closed
  without them.
hooks:
  PostToolUse:
    - matcher: "Bash|Write|Edit"
      hooks:
        - type: command
          command: "d=\"${CLAUDE_SKILL_DIR:-${CLAUDE_PLUGIN_ROOT}/skills/pave-init}\"; \"$d\"/hooks/state_staleness_reminder.sh"
  Stop:
    - hooks:
        - type: command
          command: "d=\"${CLAUDE_SKILL_DIR:-${CLAUDE_PLUGIN_ROOT}/skills/pave-init}\"; \"$d\"/hooks/stop_alignment_check.sh"
---'''
PRODUCT_INTRO = '''Turn a system or engineering process into a validated PAVE graph file and a Claude Code plugin: a lead workflow skill plus registered role agents. The user's stated goal drives the run: clarify it until it is designable, then design. Treat the approved PAVE YAML as the workflow authority.'''
MULTI_AGENT_CONTRACT = '''Every worker role is a registered agent type from this plugin. Its role contract is the harness-loaded system prompt, so a brief carries task context, not a role file to read. Resolve this skill's absolute installation path before dispatch and include it in briefs so workers can resolve `references/...`, `schemas/...`, and `scripts/...`.

- Dispatch one-shot workers with the Agent tool and `subagent_type: pave-init:<role>`. Give each a complete prompt and no `name`. Start independent workers together.
- Start each gate reviewer with `subagent_type: pave-init:pave-material-reviewer`, a unique `name`, and `run_in_background: true`. Continue that same reviewer through repair rounds with `SendMessage`. Start a fresh reviewer for the final-skill gate.
- Use the model and effort in agent frontmatter. The forward tester intentionally inherits session defaults.
- Use `AskUserQuestion` for bounded decisions and approval gates. Use free text for open discovery. If the tool is unavailable, ask the same bounded questions in plain text.

If a required `pave-init:*` agent type is unavailable, pause and report an incomplete plugin installation. Do not substitute an ordinary worker and claim equivalent review.'''
PACKAGE_IDENTITY = '''The delivered unit is a Claude Code plugin — the same shape as pave-init itself.'''
MANIFEST_COMPONENT = '''the plugin manifest (`.claude-plugin/plugin.json`: name, description, version); the plugin name is `<workflow-name>` — one string serving as the manifest name, lead-skill directory, and `subagent_type` prefix;'''
ROLE_COMPONENT = '''role contracts as registered Markdown agents under the plugin root's `agents/`, when authority or context differs;'''
HOOK_COMPONENT = '''hook scripts under `skills/<workflow-name>/hooks/`, registered per the approved enforcement table — in generated skill frontmatter when only the lead's tool calls or lead-only events matter, in the plugin's `hooks/hooks.json` when the hook must see subagent tool calls (a skill-frontmatter hook fires only for the agent that invoked the skill) — plus one consent-gated settings fragment only for rules neither placement can carry;'''
ROLE_RUNTIME_BINDING = '''Roles map to registered plugin agents (`agents/<role>.md`) only when they need distinct authority or context. The lead dispatches `subagent_type: <workflow-name>:<role>` and pauses when it is unavailable; it never substitutes an ordinary worker.'''
MODEL_RUNTIME_BINDING = '''Map the approved capability tier to Claude model slugs explicitly: top-capability planning roles use `fable`, strong judgment roles use `opus`, and small, fast evidence roles use `sonnet`. A reviewer or adjudicator seat binds at or above the producer whose artifact it judges — a judge below its producer misses the findings that need the producer's whole reasoning to see. Preserve the approved effort in agent frontmatter and each scripted agent call.'''
HOOK_RUNTIME_BINDING = '''A prohibition that must hold after its prose leaves context maps to a hook per the approved enforcement table. Register it by the actor it watches: skill frontmatter for a hook that only the lead's tool calls or lead-only events (Stop, UserPromptSubmit, SessionStart) must reach; the plugin's `hooks/hooks.json` for a hook that must see a subagent's tool calls — a skill-frontmatter hook fires only for the agent that invoked the skill (measured on Claude Code 2.1.258). A settings fragment ships only behind the generated skill's run-start consent gate, for rules neither placement can carry.'''
SCRIPT_RUNTIME_BINDING = '''A subgraph with an approved `workflow_script` binding maps to one Claude Agent SDK `@beta` workflow script per the native `skill-builder` contract, with lead-driven Agent calls as fallback when the script runtime is unavailable.'''
DELIVERY_INSTALL_BULLET = '''- the one-line install: `claude --plugin-dir <package-root>` loads it for a session; a marketplace install makes it permanent;'''
SKILL_VALIDATION_BINDING = '''the `skill-creator:skill-creator` quick validator'''

[skills.pave-evolve]
template = "sources/pave-evolve/SKILL.md.tmpl"
output = "skills/pave-evolve/SKILL.md"

[skills.pave-evolve.slots]
FRONTMATTER = '''---
name: pave-evolve
description: >-
  Revise a delivered PAVE workflow — pave-init included — from recorded defect
  and usage evidence: a workflow-updater drafts a successor patch, an
  update-reviewer judges it, the user approves where the user-only changes
  moved, and the lead applies it in the append-only revision log. Manual-only:
  use only when the user explicitly invokes /pave-evolve, or when a PAVE lead
  routes here from a run paused on a defect in its own graph. Registers no
  hooks.
compatibility: >-
  Requires the pave-init plugin's registered agent types (workflow-updater,
  update-reviewer), bash, git, and Python 3 with pyyaml and jsonschema —
  record_revision.py and validate_pave.py fail closed without them.
---'''
DISPATCH_CONTRACT = '''Both seats are registered agent types from this plugin. A role contract is the harness-loaded system prompt, so a brief carries task context, not a role file to read. Resolve this plugin's absolute installation path before dispatch and include the pave-init skill directory (`<plugin-root>/skills/pave-init/`) in every brief so seats can resolve `references/...` and `scripts/...`.

- Start the updater with the Agent tool, `subagent_type: pave-init:workflow-updater`, a unique `name`, and `run_in_background: true`; continue that same updater through review rounds with `SendMessage` — a fresh updater re-derives the proposal and loses the rounds' record.
- Start the reviewer with `subagent_type: pave-init:update-reviewer`, a unique `name`, and `run_in_background: true`; continue that same reviewer through repair rounds with `SendMessage`.
- Use the model and effort in agent frontmatter.
- Use `AskUserQuestion` for the approval gate; the approval option names the revision number and digest. If the tool is unavailable, ask the same bounded question in plain text.

If `pave-init:workflow-updater` or `pave-init:update-reviewer` is unavailable, pause and report an incomplete pave-init installation. Do not substitute an ordinary worker and claim equivalent review.'''

[roles.forward-tester]
sandbox_mode = "workspace-write"
model = "inherit"
effort = "inherit"
runtime = '''Use a fresh headless Claude Code session with the generated plugin loaded: `claude -p "<request>" --plugin-dir <package-root> --permission-mode bypassPermissions`. Run it from the temporary output directory. The permission mode is required because a bare headless session cannot approve needed writes or dispatches.'''

[roles.node-planner]
sandbox_mode = "workspace-write"
model = "fable"
effort = "xhigh"
runtime = '''When more evidence is needed, dispatch read-only workers with the Agent tool: use `subagent_type: Explore` for pure search and `general-purpose` only when a command must run.'''

[roles.pave-material-reviewer]
sandbox_mode = "read-only"
model = "fable"
effort = "high"
runtime = '''When the artifact is a generated skill package, load `skill-creator:skill-creator` for skill-quality context when it is available. Dispatch `pave-init:research-delegate` workers with the Agent tool and `run_in_background: true`, starting independent questions together. Return findings through `SendMessage` and remain the same named background reviewer through repairs at this gate.'''

[roles.research-delegate]
sandbox_mode = "read-only"
model = "sonnet"
effort = "high"
runtime = '''Return the bounded research result to the parent agent. Do not modify files.'''

[roles.skill-builder]
sandbox_mode = "workspace-write"
model = "opus"
effort = "medium"
runtime = '''Generate a Claude Code plugin with `.claude-plugin/plugin.json`, a lead under `skills/<workflow-name>/`, and role contracts under `agents/`. Use Agent calls with `subagent_type: <workflow-name>:<role>`, `AskUserQuestion` gates, named reviewers continued with `SendMessage`, agent-frontmatter model and effort pins, skill-frontmatter hooks for lead-only rules and the plugin's `hooks/hooks.json` for hooks that must see subagent tool calls, and Claude Agent SDK `@beta` workflow scripts when the approved plan selects `workflow_script`. A script uses one `agent()` call per node, `pipeline()` or `parallel()` for fan-out, structured outcomes, and lead-driven Agent calls as fallback.'''

[roles.system-explorer]
sandbox_mode = "workspace-write"
model = "sonnet"
effort = "high"
runtime = '''Return the bounded exploration result through the normal Claude agent result channel and write only the assigned report.'''

[roles.update-reviewer]
sandbox_mode = "read-only"
model = "fable"
effort = "high"
runtime = '''When the proposal touches a lead skill, load `skill-creator:skill-creator` for skill-quality context when it is available. Dispatch `pave-init:research-delegate` workers with the Agent tool and `run_in_background: true`, starting independent questions together. Return findings through `SendMessage` and remain the same named background reviewer through repair rounds on this proposal.'''

[roles.workflow-updater]
sandbox_mode = "workspace-write"
model = "fable"
effort = "xhigh"
runtime = '''Load `skill-creator:skill-creator` for skill-quality context and read the pave-init skill (`skills/pave-init/SKILL.md` under the plugin root) for the design language before drafting. When your judgment needs more evidence, dispatch read-only workers with the Agent tool: `subagent_type: Explore` for pure search and `general-purpose` only when a command must run. Return the proposal report through `SendMessage` and remain the same named background updater through review rounds.'''
